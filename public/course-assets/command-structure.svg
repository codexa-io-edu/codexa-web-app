<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Command: Wrap a Request as an Object</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748b">The invoker triggers a command without knowing what it does or who performs it</text>

  <defs>
    <marker id="cm_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- invoker -->
  <rect x="40" y="150" width="150" height="70" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Button (Invoker)</text>
  <text x="115" y="198" text-anchor="middle" font-size="9" fill="#1e3a8a">holds a Command,</text>
  <text x="115" y="212" text-anchor="middle" font-size="9" fill="#1e3a8a">calls execute()</text>

  <!-- command interface -->
  <rect x="245" y="150" width="160" height="70" rx="9" fill="#ffedd5" stroke="#d97706" stroke-width="2.4"/>
  <text x="325" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">«interface»</text>
  <text x="325" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Command</text>
  <text x="325" y="210" text-anchor="middle" font-size="9.5" fill="#7c2d12" font-family="monospace">execute() / undo()</text>

  <!-- concrete command -->
  <rect x="460" y="150" width="160" height="70" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="540" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">LightOnCommand</text>
  <text x="540" y="196" text-anchor="middle" font-size="9" fill="#7c2d12">binds receiver +</text>
  <text x="540" y="210" text-anchor="middle" font-size="9" fill="#7c2d12">action</text>

  <!-- receiver -->
  <rect x="660" y="150" width="120" height="70" rx="9" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="720" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Light</text>
  <text x="720" y="198" text-anchor="middle" font-size="9" fill="#065f46">(Receiver)</text>
  <text x="720" y="212" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">turnOn()</text>

  <line x1="190" y1="185" x2="243" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#cm_arr)"/>
  <text x="216" y="176" text-anchor="middle" font-size="8.5" fill="#64748b">execute()</text>
  <line x1="620" y1="185" x2="658" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#cm_arr)"/>
  <text x="639" y="176" text-anchor="middle" font-size="8.5" fill="#64748b">turnOn()</text>

  <!-- optional queue/history -->
  <rect x="245" y="285" width="375" height="66" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="432" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Because a request is now an OBJECT, you can:</text>
  <text x="432" y="330" text-anchor="middle" font-size="10.5" fill="#334155">queue it • log it • schedule it • push to an undo/redo stack</text>
  <line x1="325" y1="285" x2="325" y2="222" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#cm_arr)"/>

  <text x="400" y="382" text-anchor="middle" font-size="11" fill="#64748b">The invoker is fully decoupled from the receiver — like a restaurant order ticket that any cook can pick up.</text>
</svg>
