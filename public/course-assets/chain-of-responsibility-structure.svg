<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="380" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Chain of Responsibility: Pass It Along Until Someone Handles It</text>

  <defs>
    <marker id="ch_arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- request -->
  <rect x="40" y="150" width="110" height="56" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Request</text>
  <text x="95" y="192" text-anchor="middle" font-size="9" fill="#1e3a8a">$8,000 expense</text>

  <!-- handlers -->
  <rect x="200" y="140" width="150" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="275" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">TeamLead</text>
  <text x="275" y="185" text-anchor="middle" font-size="9.5" fill="#991b1b">approves &#8804; $1,000</text>
  <text x="275" y="203" text-anchor="middle" font-size="9.5" fill="#dc2626">too big &#8594; pass on</text>

  <rect x="400" y="140" width="150" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="475" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Manager</text>
  <text x="475" y="185" text-anchor="middle" font-size="9.5" fill="#991b1b">approves &#8804; $5,000</text>
  <text x="475" y="203" text-anchor="middle" font-size="9.5" fill="#dc2626">too big &#8594; pass on</text>

  <rect x="600" y="140" width="150" height="76" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="675" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Director</text>
  <text x="675" y="185" text-anchor="middle" font-size="9.5" fill="#065f46">approves &#8804; $25,000</text>
  <text x="675" y="203" text-anchor="middle" font-size="9.5" fill="#047857" font-weight="700">&#10003; handles it!</text>

  <line x1="150" y1="178" x2="198" y2="178" stroke="#dc2626" stroke-width="2" marker-end="url(#ch_arr)"/>
  <line x1="350" y1="178" x2="398" y2="178" stroke="#dc2626" stroke-width="2" marker-end="url(#ch_arr)"/>
  <line x1="550" y1="178" x2="598" y2="178" stroke="#dc2626" stroke-width="2" marker-end="url(#ch_arr)"/>

  <text x="275" y="252" text-anchor="middle" font-size="10" fill="#64748b">can't handle</text>
  <text x="475" y="252" text-anchor="middle" font-size="10" fill="#64748b">can't handle</text>
  <text x="675" y="252" text-anchor="middle" font-size="10" fill="#047857" font-weight="700">handles</text>

  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#334155">Each handler either handles the request or passes it to the next — the sender doesn't know who will handle it.</text>
  <text x="400" y="326" text-anchor="middle" font-size="11.5" fill="#64748b">Add or reorder handlers freely. This is exactly how web middleware and event pipelines work.</text>
</svg>
