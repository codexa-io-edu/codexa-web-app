<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
    .step { font-size: 10px; font-weight: 700; fill: #1e293b; }
    .warn { font-size: 10px; font-weight: 700; fill: #dc2626; }
    .good { font-size: 10px; font-weight: 700; fill: #059669; }
  </style>

  <text x="24" y="30" class="title">Synchronous vs. asynchronous processing</text>

  <!-- SYNC -->
  <rect x="24" y="48" width="370" height="376" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="24" y="48" width="370" height="36" rx="10" fill="#dc2626"/>
  <text x="44" y="72" class="h">Synchronous — caller waits for everything</text>

  <rect x="44" y="110" width="70" height="34" rx="6" fill="#64748b"/><text x="79" y="132" text-anchor="middle" class="box">user</text>
  <rect x="160" y="110" width="80" height="34" rx="6" fill="#2563eb"/><text x="200" y="132" text-anchor="middle" class="box">Order svc</text>
  <rect x="290" y="110" width="80" height="34" rx="6" fill="#7c3aed"/><text x="330" y="132" text-anchor="middle" class="box">Email svc</text>

  <line x1="114" y1="127" x2="158" y2="127" stroke="#334155" stroke-width="1.8" marker-end="url(#d)"/>
  <line x1="240" y1="127" x2="288" y2="127" stroke="#334155" stroke-width="1.8" marker-end="url(#d)"/>

  <text x="44" y="180" class="step">1. place order → 2. charge card →</text>
  <text x="44" y="198" class="step">3. send email → 4. update analytics →</text>
  <text x="44" y="216" class="step">5. only THEN respond to the user</text>

  <rect x="44" y="238" width="326" height="26" rx="4" fill="#fca5a5"/><text x="207" y="256" text-anchor="middle" class="box">user waits: 200 + 400 + 300 + 150 ms</text>

  <text x="44" y="296" class="warn">✗ Slow — user blocked on the sum of all steps</text>
  <text x="44" y="318" class="warn">✗ Fragile — if Email svc is down, the order fails</text>
  <text x="44" y="340" class="warn">✗ Tightly coupled — all must be up together</text>
  <text x="44" y="374" class="note">Right for reads and anything the user must see</text>
  <text x="44" y="390" class="note">the result of immediately (e.g. "is this in stock?").</text>

  <!-- ASYNC -->
  <rect x="406" y="48" width="370" height="376" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="406" y="48" width="370" height="36" rx="10" fill="#059669"/>
  <text x="426" y="72" class="h">Asynchronous — hand off, respond now</text>

  <rect x="426" y="110" width="70" height="34" rx="6" fill="#64748b"/><text x="461" y="132" text-anchor="middle" class="box">user</text>
  <rect x="542" y="110" width="80" height="34" rx="6" fill="#2563eb"/><text x="582" y="132" text-anchor="middle" class="box">Order svc</text>
  <rect x="672" y="98" width="80" height="58" rx="6" fill="#d97706"/><text x="712" y="122" text-anchor="middle" class="box">Broker</text><text x="712" y="140" text-anchor="middle" class="box">(queue)</text>

  <line x1="496" y1="127" x2="540" y2="127" stroke="#334155" stroke-width="1.8" marker-end="url(#d)"/>
  <line x1="622" y1="127" x2="670" y2="127" stroke="#059669" stroke-width="1.8" marker-end="url(#g)"/>

  <text x="426" y="180" class="step">1. place order → 2. drop 3 messages</text>
  <text x="426" y="198" class="step">   in the broker → 3. respond NOW</text>

  <rect x="426" y="216" width="200" height="26" rx="4" fill="#86efac"/><text x="526" y="234" text-anchor="middle" class="box">user waits: ~200 ms</text>

  <text x="426" y="272" class="note">workers process the messages later:</text>
  <rect x="426" y="284" width="90" height="24" rx="4" fill="#7c3aed"/><text x="471" y="301" text-anchor="middle" class="box">email worker</text>
  <rect x="524" y="284" width="110" height="24" rx="4" fill="#7c3aed"/><text x="579" y="301" text-anchor="middle" class="box">analytics worker</text>
  <line x1="700" y1="156" x2="560" y2="284" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="426" y="340" class="good">✓ Fast — user returns after the hand-off</text>
  <text x="426" y="362" class="good">✓ Resilient — email down? messages wait &amp; retry</text>
  <text x="426" y="384" class="good">✓ Decoupled &amp; scalable — add workers to catch up</text>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  </defs>
</svg>
