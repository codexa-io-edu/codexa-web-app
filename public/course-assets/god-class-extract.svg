<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="460" fill="#f8fafc"/>
  <text x="410" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">God Class → Extract Class Refactoring</text>
  <text x="410" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">Identify cohesive groups of methods and fields, then move them to a new, focused class</text>

  <defs><marker id="gc_a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs>

  <!-- Before -->
  <rect x="30" y="68" width="230" height="340" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">UserManager (BEFORE)</text>
  <text x="145" y="104" text-anchor="middle" font-size="9" fill="#991b1b">300+ lines, 4 concerns mixed</text>

  <rect x="44" y="112" width="202" height="58" rx="5" fill="#fecaca" stroke="#fca5a5"/>
  <text x="54" y="128" font-size="9" fill="#991b1b" font-weight="700">Auth concern</text>
  <text x="54" y="143" font-size="8.5" font-family="monospace" fill="#334155">authenticate(u, p)</text>
  <text x="54" y="158" font-size="8.5" font-family="monospace" fill="#334155">changePassword(id, p)</text>

  <rect x="44" y="176" width="202" height="58" rx="5" fill="#fecaca" stroke="#fca5a5"/>
  <text x="54" y="192" font-size="9" fill="#991b1b" font-weight="700">Profile concern</text>
  <text x="54" y="207" font-size="8.5" font-family="monospace" fill="#334155">updateProfile(id, dto)</text>
  <text x="54" y="222" font-size="8.5" font-family="monospace" fill="#334155">getProfile(id)</text>

  <rect x="44" y="240" width="202" height="58" rx="5" fill="#fecaca" stroke="#fca5a5"/>
  <text x="54" y="256" font-size="9" fill="#991b1b" font-weight="700">Email concern</text>
  <text x="54" y="271" font-size="8.5" font-family="monospace" fill="#334155">sendWelcome(email)</text>
  <text x="54" y="286" font-size="8.5" font-family="monospace" fill="#334155">sendReset(email)</text>

  <rect x="44" y="304" width="202" height="58" rx="5" fill="#fecaca" stroke="#fca5a5"/>
  <text x="54" y="320" font-size="9" fill="#991b1b" font-weight="700">Billing concern</text>
  <text x="54" y="335" font-size="8.5" font-family="monospace" fill="#334155">subscribe(id, plan)</text>
  <text x="54" y="350" font-size="8.5" font-family="monospace" fill="#334155">generateInvoice(id)</text>

  <!-- After - 4 focused classes -->
  <text x="590" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">AFTER — 4 focused classes</text>

  <rect x="430" y="100" width="170" height="60" rx="7" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="515" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">AuthenticationService</text>
  <text x="440" y="138" font-size="8.5" font-family="monospace" fill="#334155">authenticate(), changePassword()</text>

  <rect x="620" y="100" width="170" height="60" rx="7" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="705" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">UserProfileService</text>
  <text x="630" y="138" font-size="8.5" font-family="monospace" fill="#334155">updateProfile(), getProfile()</text>

  <rect x="430" y="200" width="170" height="60" rx="7" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="515" y="220" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">UserEmailService</text>
  <text x="440" y="238" font-size="8.5" font-family="monospace" fill="#334155">sendWelcome(), sendReset()</text>

  <rect x="620" y="200" width="170" height="60" rx="7" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="705" y="220" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">SubscriptionService</text>
  <text x="630" y="238" font-size="8.5" font-family="monospace" fill="#334155">subscribe(), generateInvoice()</text>

  <!-- arrow -->
  <line x1="262" y1="235" x2="426" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#gc_a)"/>
  <text x="344" y="225" text-anchor="middle" font-size="10" fill="#047857" font-weight="700">Extract Class</text>

  <!-- payoff -->
  <rect x="430" y="298" width="360" height="110" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.4"/>
  <text x="610" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">The payoff</text>
  <text x="440" y="342" font-size="9.5" fill="#334155">&#10003; Each class has one reason to change</text>
  <text x="440" y="360" font-size="9.5" fill="#334155">&#10003; Each can be tested with only its own collaborators</text>
  <text x="440" y="378" font-size="9.5" fill="#334155">&#10003; Teams can own different services independently</text>
  <text x="440" y="396" font-size="9.5" fill="#334155">&#10003; Each class fits in one screen and has a clear name</text>
</svg>
