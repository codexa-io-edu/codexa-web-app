<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">The Concurrent Collections Family</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">Pick by the shape of data you need — map, list, set, or queue — and your access pattern</text>

  <!-- MAPS -->
  <rect x="30" y="80" width="380" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Maps</text>
  <rect x="46" y="116" width="348" height="40" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="56" y="133" font-size="11" font-weight="700" fill="#1e3a8a">ConcurrentHashMap</text>
  <text x="56" y="149" font-size="9" fill="#334155">the workhorse: high-concurrency hash map, atomic ops</text>
  <rect x="46" y="162" width="348" height="40" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="56" y="179" font-size="11" font-weight="700" fill="#1e3a8a">ConcurrentSkipListMap</text>
  <text x="56" y="195" font-size="9" fill="#334155">sorted keys (like TreeMap), concurrent</text>
  <rect x="46" y="208" width="348" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="56" y="225" font-size="11" font-weight="700" fill="#1e3a8a">ConcurrentHashMap.newKeySet()</text>
  <text x="56" y="241" font-size="9" fill="#334155">concurrent Set backed by CHM</text>

  <!-- LISTS/SETS -->
  <rect x="430" y="80" width="360" height="180" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="610" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Lists &amp; Sets (copy-on-write)</text>
  <rect x="446" y="116" width="328" height="60" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="456" y="133" font-size="11" font-weight="700" fill="#065f46">CopyOnWriteArrayList</text>
  <text x="456" y="149" font-size="9" fill="#334155">every write copies the array;</text>
  <text x="456" y="163" font-size="9" fill="#334155">reads are lock-free. Read-mostly only.</text>
  <rect x="446" y="182" width="328" height="60" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="456" y="199" font-size="11" font-weight="700" fill="#065f46">CopyOnWriteArraySet</text>
  <text x="456" y="215" font-size="9" fill="#334155">same idea for Set semantics;</text>
  <text x="456" y="229" font-size="9" fill="#334155">ideal for listener/subscriber lists</text>

  <!-- QUEUES -->
  <rect x="30" y="278" width="760" height="204" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Queues &amp; Deques</text>

  <rect x="46" y="314" width="240" height="70" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="56" y="331" font-size="10.5" font-weight="700" fill="#7c2d12">ConcurrentLinkedQueue</text>
  <text x="56" y="347" font-size="8.5" fill="#334155">non-blocking (CAS), unbounded,</text>
  <text x="56" y="360" font-size="8.5" fill="#334155">returns null when empty</text>
  <text x="56" y="376" font-size="8.5" fill="#a16207">use: high-throughput, no blocking</text>

  <rect x="298" y="314" width="240" height="70" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="308" y="331" font-size="10.5" font-weight="700" fill="#7c2d12">BlockingQueue (interface)</text>
  <text x="308" y="347" font-size="8.5" fill="#334155">Array/Linked/Synchronous/</text>
  <text x="308" y="360" font-size="8.5" fill="#334155">Priority/Delay — blocks when</text>
  <text x="308" y="376" font-size="8.5" fill="#a16207">full/empty. use: producer-consumer</text>

  <rect x="550" y="314" width="224" height="70" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="560" y="331" font-size="10.5" font-weight="700" fill="#7c2d12">BlockingDeque / Deque</text>
  <text x="560" y="347" font-size="8.5" fill="#334155">LinkedBlockingDeque,</text>
  <text x="560" y="360" font-size="8.5" fill="#334155">ConcurrentLinkedDeque</text>
  <text x="560" y="376" font-size="8.5" fill="#a16207">use: work-stealing, both ends</text>

  <rect x="46" y="398" width="728" height="70" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="410" y="418" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a16207">Two locking philosophies across the whole family:</text>
  <text x="410" y="438" text-anchor="middle" font-size="9.5" fill="#7c2d12">Non-blocking (CAS): ConcurrentHashMap, ConcurrentLinkedQueue — never block, return null/false or retry</text>
  <text x="410" y="456" text-anchor="middle" font-size="9.5" fill="#7c2d12">Blocking: BlockingQueue family — wait for the condition (space/item). Copy-on-write: lock-free reads, expensive writes</text>
</svg>
