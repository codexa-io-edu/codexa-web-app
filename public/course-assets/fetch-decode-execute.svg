<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .stage { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .ssub { font-size: 10.5px; fill: #e0e7ff; }
    .note { font-size: 11px; fill: #64748b; }
    .clock { font-size: 11px; font-weight: 700; fill: #d97706; }
  </style>

  <text x="24" y="30" class="title">The instruction cycle: what a CPU does, billions of times a second</text>

  <!-- center: clock -->
  <circle cx="380" cy="220" r="52" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="352" y="212" class="clock">CLOCK</text>
  <text x="335" y="230" class="note">each "tick" drives</text>
  <text x="345" y="245" class="note">the cycle on</text>

  <!-- FETCH (top) -->
  <rect x="290" y="70" width="180" height="60" rx="10" fill="#2563eb"/>
  <text x="322" y="96" class="stage">1 · FETCH</text>
  <text x="304" y="116" class="ssub">read the next instruction from RAM</text>

  <!-- DECODE (right) -->
  <rect x="540" y="190" width="190" height="60" rx="10" fill="#2563eb"/>
  <text x="560" y="216" class="stage">2 · DECODE</text>
  <text x="560" y="236" class="ssub">work out what it means &amp; needs</text>

  <!-- EXECUTE (bottom) -->
  <rect x="290" y="310" width="180" height="60" rx="10" fill="#2563eb"/>
  <text x="316" y="336" class="stage">3 · EXECUTE</text>
  <text x="300" y="356" class="ssub">ALU does the work (add, compare…)</text>

  <!-- STORE (left) -->
  <rect x="30" y="190" width="190" height="60" rx="10" fill="#2563eb"/>
  <text x="52" y="216" class="stage">4 · STORE</text>
  <text x="46" y="236" class="ssub">write the result to a register/RAM</text>

  <!-- circular arrows -->
  <path d="M 470 100 C 560 110, 620 150, 640 186" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="634,178 644,190 646,174" fill="#64748b"/>

  <path d="M 630 250 C 610 300, 540 340, 472 344" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="480,338 468,346 482,352" fill="#64748b"/>

  <path d="M 290 344 C 200 340, 140 300, 120 252" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="126,260 116,248 114,264" fill="#64748b"/>

  <path d="M 120 188 C 140 150, 200 110, 288 102" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="280,108 292,100 278,94" fill="#64748b"/>

  <!-- footer -->
  <rect x="24" y="386" width="712" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="405" class="note"><tspan font-weight="700">Clock speed</tspan> (e.g. 3 GHz = 3 billion ticks/sec) sets the pace. Modern CPUs overlap many instructions at once (pipelining) to go even faster.</text>
</svg>
