<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="420" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Association: Direction &amp; Multiplicity</text>

  <defs>
    <marker id="oa" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- ===== Unidirectional ===== -->
  <text x="30" y="82" font-size="15" font-weight="700" fill="#334155">1. Unidirectional  (one side knows the other)</text>
  <rect x="90" y="100" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Order</text>
  <rect x="540" y="100" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="615" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Customer</text>
  <line x1="240" y1="125" x2="536" y2="125" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#oa)"/>
  <text x="390" y="116" text-anchor="middle" font-size="11.5" fill="#64748b">Order knows its Customer; Customer needn't know its Orders</text>

  <!-- ===== Bidirectional ===== -->
  <text x="30" y="200" font-size="15" font-weight="700" fill="#334155">2. Bidirectional  (both sides know each other)</text>
  <rect x="90" y="218" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Student</text>
  <rect x="540" y="218" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="615" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Course</text>
  <line x1="240" y1="243" x2="540" y2="243" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="258" y="235" font-size="12" font-weight="600" fill="#047857">*</text>
  <text x="512" y="235" font-size="12" font-weight="600" fill="#047857">*</text>
  <text x="390" y="234" text-anchor="middle" font-size="11.5" fill="#64748b">many-to-many: a student takes many courses; a course has many students</text>

  <!-- ===== Multiplicity reference ===== -->
  <rect x="90" y="300" width="600" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="390" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Multiplicity notation (how many on each end)</text>
  <text x="120" y="352" font-size="12.5" fill="#0f172a" font-family="monospace">1</text>
  <text x="150" y="352" font-size="12" fill="#475569">exactly one</text>
  <text x="120" y="374" font-size="12.5" fill="#0f172a" font-family="monospace">0..1</text>
  <text x="150" y="374" font-size="12" fill="#475569">zero or one (optional)</text>
  <text x="330" y="352" font-size="12.5" fill="#0f172a" font-family="monospace">*</text>
  <text x="360" y="352" font-size="12" fill="#475569">zero or more (many)</text>
  <text x="330" y="374" font-size="12.5" fill="#0f172a" font-family="monospace">1..*</text>
  <text x="360" y="374" font-size="12" fill="#475569">one or more (at least one)</text>
  <text x="560" y="352" font-size="12.5" fill="#0f172a" font-family="monospace">2..4</text>
  <text x="560" y="374" font-size="11" fill="#475569">a specific range</text>
</svg>
