<svg viewBox="0 0 820 490" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="490" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Message Types &amp; Combined Fragments</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Arrows encode the call style; fragments add conditionals, loops, and alternatives</text>

  <!-- LEFT: message types -->
  <rect x="30" y="70" width="360" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="210" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Message (arrow) types</text>

  <defs>
    <marker id="m_solid" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="m_openb" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.5"/></marker>
  </defs>

  <line x1="60" y1="120" x2="250" y2="120" stroke="#334155" stroke-width="1.7" marker-end="url(#m_solid)"/>
  <text x="270" y="118" font-size="10" fill="#334155">Synchronous</text>
  <text x="60" y="138" font-size="8.5" fill="#64748b">solid line, filled arrowhead — caller waits</text>

  <line x1="60" y1="160" x2="250" y2="160" stroke="#334155" stroke-width="1.7" marker-end="url(#m_openb)"/>
  <text x="270" y="158" font-size="10" fill="#334155">Asynchronous</text>
  <text x="60" y="178" font-size="8.5" fill="#64748b">solid line, open arrowhead — caller continues</text>

  <line x1="60" y1="200" x2="250" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#m_openb)"/>
  <text x="270" y="198" font-size="10" fill="#334155">Return / reply</text>
  <text x="60" y="218" font-size="8.5" fill="#64748b">dashed line, open arrowhead</text>

  <circle cx="60" cy="240" r="4" fill="#334155"/>
  <line x1="60" y1="240" x2="250" y2="240" stroke="#334155" stroke-width="1.7" marker-end="url(#m_solid)"/>
  <text x="270" y="243" font-size="10" fill="#334155">Create / found</text>
  <text x="60" y="258" font-size="8.5" fill="#64748b">a message that instantiates a new object</text>

  <!-- RIGHT: fragments -->
  <rect x="410" y="70" width="380" height="200" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
  <text x="600" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Combined fragments</text>

  <text x="428" y="118" font-size="10.5" font-weight="700" fill="#047857">alt</text>
  <text x="460" y="118" font-size="9.5" fill="#334155">if / else &#8212; mutually exclusive branches</text>
  <text x="428" y="142" font-size="10.5" font-weight="700" fill="#047857">opt</text>
  <text x="460" y="142" font-size="9.5" fill="#334155">optional &#8212; runs only if a condition holds</text>
  <text x="428" y="166" font-size="10.5" font-weight="700" fill="#047857">loop</text>
  <text x="460" y="166" font-size="9.5" fill="#334155">repetition &#8212; repeat while/for each</text>
  <text x="428" y="190" font-size="10.5" font-weight="700" fill="#047857">par</text>
  <text x="460" y="190" font-size="9.5" fill="#334155">parallel &#8212; concurrent execution</text>
  <text x="428" y="214" font-size="10.5" font-weight="700" fill="#047857">ref</text>
  <text x="460" y="214" font-size="9.5" fill="#334155">reference &#8212; reuse another diagram</text>
  <text x="428" y="238" font-size="10.5" font-weight="700" fill="#047857">break</text>
  <text x="460" y="238" font-size="9.5" fill="#334155">break &#8212; exit on an exceptional case</text>

  <!-- bottom: alt fragment drawn -->
  <text x="410" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">An "alt" fragment, drawn</text>

  <line x1="180" y1="316" x2="180" y2="470" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="620" y1="316" x2="620" y2="470" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="140" y="300" width="80" height="16" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="312" text-anchor="middle" font-size="8.5" fill="#1e3a8a">:Checkout</text>
  <rect x="576" y="300" width="88" height="16" rx="3" fill="#ede9fe" stroke="#7c3aed"/><text x="620" y="312" text-anchor="middle" font-size="8.5" fill="#6d28d9">:PaymentGW</text>

  <rect x="120" y="330" width="560" height="130" rx="4" fill="none" stroke="#059669" stroke-width="1.6"/>
  <path d="M120,330 L175,330 L175,344 L165,352 L120,352 Z" fill="#dcfce7" stroke="#059669" stroke-width="1.4"/>
  <text x="140" y="345" font-size="9.5" font-weight="700" fill="#047857">alt</text>
  <text x="300" y="345" font-size="9" font-style="italic" fill="#334155">[funds available]</text>
  <line x1="186" y1="366" x2="574" y2="366" stroke="#334155" stroke-width="1.5" marker-end="url(#m_solid)"/>
  <text x="380" y="360" text-anchor="middle" font-size="9" fill="#334155" font-family="monospace">charge(amt)</text>
  <line x1="574" y1="386" x2="186" y2="386" stroke="#334155" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#m_openb)"/>
  <text x="380" y="380" text-anchor="middle" font-size="8.5" fill="#64748b" font-family="monospace">approved</text>

  <line x1="120" y1="400" x2="680" y2="400" stroke="#059669" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="300" y="418" font-size="9" font-style="italic" fill="#334155">[insufficient funds]</text>
  <line x1="186" y1="436" x2="574" y2="436" stroke="#334155" stroke-width="1.5" marker-end="url(#m_solid)"/>
  <text x="380" y="430" text-anchor="middle" font-size="9" fill="#334155" font-family="monospace">declineOrder()</text>

  <text x="700" y="400" font-size="8.5" fill="#059669">&#8592; separator</text>
</svg>
