<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .sub { font-size: 9.5px; fill: #e2e8f0; }
    .note { font-size: 10px; fill: #64748b; }
    .warn { font-size: 10px; font-weight: 700; fill: #dc2626; }
    .good { font-size: 10px; font-weight: 700; fill: #059669; }
  </style>

  <text x="24" y="30" class="title">Session affinity (sticky) vs. externalized session state</text>

  <!-- Sticky panel -->
  <rect x="24" y="48" width="370" height="380" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="72" class="h">Sticky sessions — state lives on one server</text>

  <rect x="40" y="90" width="80" height="34" rx="6" fill="#64748b"/><text x="80" y="112" text-anchor="middle" class="box">client</text>
  <text x="44" y="140" class="note">cookie: session=abc</text>

  <rect x="150" y="88" width="110" height="40" rx="8" fill="#2563eb"/><text x="205" y="112" text-anchor="middle" class="box">Load Balancer</text>
  <line x1="120" y1="107" x2="148" y2="107" stroke="#94a3b8" stroke-width="1.8"/>

  <rect x="150" y="170" width="200" height="44" rx="8" fill="#94a3b8"/><text x="250" y="190" text-anchor="middle" class="box">Server A</text><text x="250" y="206" text-anchor="middle" class="sub">(no session here)</text>
  <rect x="150" y="228" width="200" height="52" rx="8" fill="#059669"/><text x="250" y="250" text-anchor="middle" class="box">Server B  ← always</text><text x="250" y="266" text-anchor="middle" class="sub">holds session abc in memory</text>

  <line x1="205" y1="128" x2="250" y2="226" stroke="#059669" stroke-width="2.2" marker-end="url(#k)"/>

  <text x="40" y="312" class="warn">✗ If Server B dies, the session is gone</text>
  <text x="40" y="330" class="note">   (user logged out, cart lost).</text>
  <text x="40" y="352" class="warn">✗ Load can get lopsided; scaling is awkward.</text>
  <text x="40" y="374" class="note">Set via source-IP affinity or an LB/app cookie.</text>
  <text x="40" y="404" class="note">A necessary crutch when the app keeps</text>
  <text x="40" y="420" class="note">session state in local memory.</text>

  <!-- Shared store panel -->
  <rect x="406" y="48" width="370" height="380" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="422" y="72" class="h">Externalized state — servers are stateless</text>

  <rect x="422" y="90" width="80" height="34" rx="6" fill="#64748b"/><text x="462" y="112" text-anchor="middle" class="box">client</text>

  <rect x="532" y="88" width="110" height="40" rx="8" fill="#2563eb"/><text x="587" y="112" text-anchor="middle" class="box">Load Balancer</text>
  <line x1="502" y1="107" x2="530" y2="107" stroke="#94a3b8" stroke-width="1.8"/>

  <rect x="450" y="170" width="120" height="44" rx="8" fill="#059669"/><text x="510" y="196" text-anchor="middle" class="box">Server A</text>
  <rect x="600" y="170" width="120" height="44" rx="8" fill="#059669"/><text x="660" y="196" text-anchor="middle" class="box">Server B</text>
  <line x1="570" y1="128" x2="520" y2="168" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#k2)"/>
  <line x1="604" y1="128" x2="650" y2="168" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#k2)"/>

  <rect x="500" y="262" width="180" height="48" rx="8" fill="#dc2626"/><text x="590" y="284" text-anchor="middle" class="box">Shared session store</text><text x="590" y="300" text-anchor="middle" class="sub">e.g. Redis</text>
  <line x1="510" y1="214" x2="560" y2="260" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="660" y1="214" x2="620" y2="260" stroke="#dc2626" stroke-width="1.8"/>

  <text x="422" y="340" class="good">✓ Any server can handle any request</text>
  <text x="422" y="362" class="good">✓ A server dying loses no session</text>
  <text x="422" y="384" class="good">✓ Free to use simple stateless algorithms</text>
  <text x="422" y="410" class="note">Preferred at scale — sticky sessions become</text>
  <text x="422" y="424" class="note">unnecessary once state lives outside the servers.</text>

  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="k2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
