<svg viewBox="0 0 780 410" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="410" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Observer: One Subject Notifies Many Observers</text>
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#64748b">Observers subscribe; when the subject changes, it pushes an update to all of them</text>

  <defs>
    <marker id="ob_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- subject -->
  <rect x="290" y="90" width="200" height="90" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="2.6"/>
  <text x="390" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">WeatherStation</text>
  <text x="390" y="136" text-anchor="middle" font-size="9.5" fill="#065f46">(the Subject)</text>
  <line x1="308" y1="146" x2="472" y2="146" stroke="#86efac" stroke-width="1.2"/>
  <text x="390" y="166" text-anchor="middle" font-size="10" fill="#065f46" font-family="monospace">subscribe() / notifyAll()</text>

  <!-- observers -->
  <rect x="60" y="290" width="180" height="60" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="150" y="315" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">PhoneDisplay</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#1e3a8a" font-family="monospace">update(temp)</text>

  <rect x="300" y="290" width="180" height="60" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="390" y="315" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">WebDashboard</text>
  <text x="390" y="334" text-anchor="middle" font-size="9" fill="#1e3a8a" font-family="monospace">update(temp)</text>

  <rect x="540" y="290" width="180" height="60" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="630" y="315" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">AlertService</text>
  <text x="630" y="334" text-anchor="middle" font-size="9" fill="#1e3a8a" font-family="monospace">update(temp)</text>

  <!-- notify arrows -->
  <line x1="360" y1="180" x2="170" y2="288" stroke="#059669" stroke-width="2" marker-end="url(#ob_arr)"/>
  <line x1="390" y1="180" x2="390" y2="288" stroke="#059669" stroke-width="2" marker-end="url(#ob_arr)"/>
  <line x1="420" y1="180" x2="610" y2="288" stroke="#059669" stroke-width="2" marker-end="url(#ob_arr)"/>
  <text x="250" y="235" font-size="10.5" fill="#059669" font-weight="700">notify</text>
  <text x="470" y="235" font-size="10.5" fill="#059669" font-weight="700">notify</text>

  <text x="390" y="388" text-anchor="middle" font-size="11.5" fill="#334155">The subject knows only the Observer interface — add or remove observers at runtime without changing it. (Loose coupling.)</text>
</svg>
