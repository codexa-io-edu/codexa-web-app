<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Thread Pool: Reuse Workers Instead of Creating One Per Task</text>

  <defs>
    <marker id="tp_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- task queue -->
  <text x="130" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Task Queue</text>
  <rect x="60" y="104" width="140" height="230" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <g font-size="11" fill="#1e3a8a">
    <rect x="76" y="120" width="108" height="30" rx="6" fill="#dbeafe"/><text x="130" y="140" text-anchor="middle">Task 6</text>
    <rect x="76" y="156" width="108" height="30" rx="6" fill="#dbeafe"/><text x="130" y="176" text-anchor="middle">Task 5</text>
    <rect x="76" y="192" width="108" height="30" rx="6" fill="#dbeafe"/><text x="130" y="212" text-anchor="middle">Task 4</text>
    <rect x="76" y="228" width="108" height="30" rx="6" fill="#bfdbfe"/><text x="130" y="248" text-anchor="middle">Task 3</text>
  </g>
  <text x="130" y="352" text-anchor="middle" font-size="10" fill="#64748b">tasks wait here for a free worker</text>

  <!-- pool -->
  <text x="430" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Fixed Pool of Worker Threads</text>
  <rect x="270" y="104" width="320" height="230" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>

  <rect x="290" y="128" width="130" height="56" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="355" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">Worker 1</text>
  <text x="355" y="168" text-anchor="middle" font-size="9.5" fill="#065f46">running Task 1</text>
  <rect x="440" y="128" width="130" height="56" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="505" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">Worker 2</text>
  <text x="505" y="168" text-anchor="middle" font-size="9.5" fill="#065f46">running Task 2</text>
  <rect x="290" y="200" width="130" height="56" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="355" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">Worker 3</text>
  <text x="355" y="240" text-anchor="middle" font-size="9.5" fill="#065f46">idle → pulls next</text>
  <rect x="440" y="200" width="130" height="56" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="505" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">Worker 4</text>
  <text x="505" y="240" text-anchor="middle" font-size="9.5" fill="#065f46">idle → pulls next</text>

  <text x="430" y="300" text-anchor="middle" font-size="10.5" fill="#065f46">a finished worker loops back and takes the next queued task</text>
  <text x="430" y="320" text-anchor="middle" font-size="10.5" fill="#065f46">— threads are reused, never re-created per task</text>

  <line x1="200" y1="200" x2="268" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#tp_arr)"/>
  <text x="234" y="192" text-anchor="middle" font-size="9" fill="#334155">pull</text>

  <!-- results -->
  <rect x="640" y="150" width="130" height="120" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="705" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">Results</text>
  <text x="705" y="200" text-anchor="middle" font-size="9.5" fill="#0e7490">Future / callback</text>
  <text x="705" y="222" text-anchor="middle" font-size="9.5" fill="#0e7490">per completed task</text>
  <line x1="590" y1="210" x2="638" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#tp_arr)"/>

  <text x="400" y="378" text-anchor="middle" font-size="11.5" fill="#334155">Creating a thread is expensive; a pool amortizes that cost and caps concurrency to protect the machine.</text>
</svg>
