<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .hdr { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .lvl { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .yes { font-size: 13px; font-weight: 700; fill: #dc2626; }   /* anomaly possible = bad */
    .no  { font-size: 13px; font-weight: 700; fill: #059669; }   /* prevented = good */
    .note { font-size: 11px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="title">Isolation levels vs. the anomalies they prevent</text>
  <text x="24" y="50" class="note">Higher isolation = fewer anomalies, but more locking/contention. "Possible" = the anomaly can occur.</text>

  <!-- header row -->
  <rect x="24" y="66" width="200" height="40" fill="#1e293b"/>
  <rect x="224" y="66" width="140" height="40" fill="#2563eb"/>
  <rect x="364" y="66" width="140" height="40" fill="#2563eb"/>
  <rect x="504" y="66" width="140" height="40" fill="#2563eb"/>
  <rect x="644" y="66" width="112" height="40" fill="#2563eb"/>
  <text x="34" y="91" class="hdr">Isolation level</text>
  <text x="234" y="83" class="hdr">Dirty</text><text x="234" y="99" class="hdr">read</text>
  <text x="374" y="83" class="hdr">Non-repeat.</text><text x="374" y="99" class="hdr">read</text>
  <text x="514" y="83" class="hdr">Phantom</text><text x="514" y="99" class="hdr">read</text>
  <text x="654" y="83" class="hdr">Lost</text><text x="654" y="99" class="hdr">update</text>

  <!-- rows -->
  <!-- Read Uncommitted -->
  <rect x="24" y="106" width="732" height="52" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="130" class="lvl">Read Uncommitted</text>
  <text x="34" y="148" class="note">lowest — rarely used</text>
  <text x="270" y="138" class="yes">Possible</text>
  <text x="405" y="138" class="yes">Possible</text>
  <text x="548" y="138" class="yes">Possible</text>
  <text x="672" y="138" class="yes">Possible</text>

  <!-- Read Committed -->
  <rect x="24" y="158" width="732" height="52" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="34" y="182" class="lvl">Read Committed</text>
  <text x="34" y="200" class="note">Postgres / Oracle default</text>
  <text x="286" y="190" class="no">Safe</text>
  <text x="405" y="190" class="yes">Possible</text>
  <text x="548" y="190" class="yes">Possible</text>
  <text x="672" y="190" class="yes">Possible</text>

  <!-- Repeatable Read -->
  <rect x="24" y="210" width="732" height="52" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="234" class="lvl">Repeatable Read</text>
  <text x="34" y="252" class="note">MySQL/InnoDB default</text>
  <text x="286" y="242" class="no">Safe</text>
  <text x="425" y="242" class="no">Safe</text>
  <text x="548" y="242" class="yes">Possible*</text>
  <text x="672" y="242" class="no">Safe</text>

  <!-- Serializable -->
  <rect x="24" y="262" width="732" height="52" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="34" y="286" class="lvl">Serializable</text>
  <text x="34" y="304" class="note">strongest — as if one-at-a-time</text>
  <text x="286" y="294" class="no">Safe</text>
  <text x="425" y="294" class="no">Safe</text>
  <text x="562" y="294" class="no">Safe</text>
  <text x="686" y="294" class="no">Safe</text>

  <!-- column separators -->
  <line x1="224" y1="106" x2="224" y2="314" stroke="#e2e8f0"/>
  <line x1="364" y1="106" x2="364" y2="314" stroke="#e2e8f0"/>
  <line x1="504" y1="106" x2="504" y2="314" stroke="#e2e8f0"/>
  <line x1="644" y1="106" x2="644" y2="314" stroke="#e2e8f0"/>

  <text x="24" y="342" class="note">* The SQL standard permits phantoms at Repeatable Read; some engines (e.g. PostgreSQL) prevent them via snapshot isolation.</text>
  <text x="24" y="362" class="note">Choose the lowest level that keeps your data correct. Most apps run at Read Committed and add explicit locks where needed.</text>
</svg>
