<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Breaking vs Non-Breaking Changes</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Non-breaking = additive only. Breaking = anything existing clients have to change to accommodate.</text>

  <!-- Breaking -->
  <rect x="30" y="70" width="380" height="390" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">BREAKING &#x2014; requires a new version</text>

  <text x="46" y="124" font-size="11" font-weight="700" fill="#991b1b">Requests (what clients send)</text>
  <text x="46" y="144" font-size="10" fill="#334155">&#10007; Removing a field the client sends</text>
  <text x="46" y="162" font-size="10" fill="#334155">&#10007; Making an optional field required</text>
  <text x="46" y="180" font-size="10" fill="#334155">&#10007; Renaming a field (name change = remove + add)</text>
  <text x="46" y="198" font-size="10" fill="#334155">&#10007; Changing a field's type (string → int)</text>
  <text x="46" y="216" font-size="10" fill="#334155">&#10007; Tightening validation (min was 0, now 1)</text>
  <text x="46" y="234" font-size="10" fill="#334155">&#10007; Removing an accepted query parameter</text>

  <text x="46" y="262" font-size="11" font-weight="700" fill="#991b1b">Responses (what clients receive)</text>
  <text x="46" y="282" font-size="10" fill="#334155">&#10007; Removing a field from the response</text>
  <text x="46" y="300" font-size="10" fill="#334155">&#10007; Renaming a response field</text>
  <text x="46" y="318" font-size="10" fill="#334155">&#10007; Changing a field's type or format</text>
  <text x="46" y="336" font-size="10" fill="#334155">&#10007; Changing the meaning of a field's value</text>

  <text x="46" y="364" font-size="11" font-weight="700" fill="#991b1b">Endpoints &amp; Behaviour</text>
  <text x="46" y="384" font-size="10" fill="#334155">&#10007; Removing or renaming an endpoint</text>
  <text x="46" y="402" font-size="10" fill="#334155">&#10007; Changing the HTTP method (GET → POST)</text>
  <text x="46" y="420" font-size="10" fill="#334155">&#10007; Changing URL structure</text>
  <text x="46" y="438" font-size="10" fill="#334155">&#10007; Changing status codes in a breaking way</text>

  <!-- Non-breaking -->
  <rect x="430" y="70" width="360" height="390" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="610" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">NON-BREAKING &#x2014; safe to ship</text>

  <text x="446" y="124" font-size="11" font-weight="700" fill="#065f46">Additive to requests</text>
  <text x="446" y="144" font-size="10" fill="#334155">&#10003; Adding a new optional request field</text>
  <text x="446" y="162" font-size="10" fill="#334155">&#10003; Adding a new optional query parameter</text>
  <text x="446" y="180" font-size="10" fill="#334155">&#10003; Loosening validation (was min 1, now 0)</text>

  <text x="446" y="208" font-size="11" font-weight="700" fill="#065f46">Additive to responses</text>
  <text x="446" y="228" font-size="10" fill="#334155">&#10003; Adding a new field to a response</text>
  <text x="446" y="246" font-size="10" fill="#334155">&#10003; Adding a new value to an enum</text>
  <text x="446" y="264" font-size="10" fill="#334155">&#10003; Returning more data than before</text>

  <text x="446" y="292" font-size="11" font-weight="700" fill="#065f46">Additive endpoints</text>
  <text x="446" y="312" font-size="10" fill="#334155">&#10003; Adding a new endpoint</text>
  <text x="446" y="330" font-size="10" fill="#334155">&#10003; Adding a new optional HTTP header</text>

  <text x="446" y="358" font-size="11" font-weight="700" fill="#065f46">Performance / implementation</text>
  <text x="446" y="378" font-size="10" fill="#334155">&#10003; Bug fixes that don't change the contract</text>
  <text x="446" y="396" font-size="10" fill="#334155">&#10003; Performance improvements</text>
  <text x="446" y="414" font-size="10" fill="#334155">&#10003; Changing internal implementation</text>

  <rect x="446" y="432" width="326" height="22" rx="5" fill="#dcfce7"/>
  <text x="609" y="447" text-anchor="middle" font-size="9.5" font-weight="700" fill="#047857">If it's additive only, it's almost certainly safe.</text>
</svg>
