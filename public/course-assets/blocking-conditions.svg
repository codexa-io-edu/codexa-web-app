<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">The Two Blocking Conditions</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">A bounded buffer forces both sides to wait at their limits — this is what creates backpressure</text>

  <line x1="410" y1="76" x2="410" y2="384" stroke="#e2e8f0" stroke-width="2"/>

  <!-- LEFT: buffer full -->
  <text x="205" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Buffer FULL &#8594; producer waits</text>

  <rect x="90" y="120" width="230" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="104" y="138" width="34" height="36" rx="4" fill="#fca5a5" stroke="#b91c1c"/>
  <rect x="142" y="138" width="34" height="36" rx="4" fill="#fca5a5" stroke="#b91c1c"/>
  <rect x="180" y="138" width="34" height="36" rx="4" fill="#fca5a5" stroke="#b91c1c"/>
  <rect x="218" y="138" width="34" height="36" rx="4" fill="#fca5a5" stroke="#b91c1c"/>
  <rect x="256" y="138" width="34" height="36" rx="4" fill="#fca5a5" stroke="#b91c1c"/>
  <text x="205" y="210" text-anchor="middle" font-size="10.5" fill="#991b1b">no free slots</text>

  <rect x="90" y="232" width="230" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="205" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Producer calls put()</text>
  <text x="205" y="276" text-anchor="middle" font-size="10" fill="#334155">&#8594; blocks until a slot frees up</text>

  <text x="205" y="322" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">Backpressure:</text>
  <text x="205" y="342" text-anchor="middle" font-size="10.5" fill="#334155">a fast producer is throttled to the</text>
  <text x="205" y="358" text-anchor="middle" font-size="10.5" fill="#334155">consumer's pace — no unbounded growth.</text>

  <!-- RIGHT: buffer empty -->
  <text x="615" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Buffer EMPTY &#8594; consumer waits</text>

  <rect x="500" y="120" width="230" height="70" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="514" y="138" width="34" height="36" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-dasharray="3 2"/>
  <rect x="552" y="138" width="34" height="36" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-dasharray="3 2"/>
  <rect x="590" y="138" width="34" height="36" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-dasharray="3 2"/>
  <rect x="628" y="138" width="34" height="36" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-dasharray="3 2"/>
  <rect x="666" y="138" width="34" height="36" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-dasharray="3 2"/>
  <text x="615" y="210" text-anchor="middle" font-size="10.5" fill="#a16207">nothing to take</text>

  <rect x="500" y="232" width="230" height="60" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="615" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Consumer calls take()</text>
  <text x="615" y="276" text-anchor="middle" font-size="10" fill="#334155">&#8594; blocks until an item arrives</text>

  <text x="615" y="322" text-anchor="middle" font-size="11" fill="#b45309" font-weight="700">No busy-waiting:</text>
  <text x="615" y="342" text-anchor="middle" font-size="10.5" fill="#334155">an idle consumer sleeps (0% CPU)</text>
  <text x="615" y="358" text-anchor="middle" font-size="10.5" fill="#334155">and is woken the moment work arrives.</text>
</svg>
