<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="620" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">The Six Behavioral Patterns</text>
  <text x="410" y="63" text-anchor="middle" font-size="13" fill="#64748b">All of them organize how objects communicate and share responsibility — each solves a different interaction problem</text>

  <!-- Strategy -->
  <rect x="40" y="90" width="740" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="52" y="102" width="200" height="52" rx="8" fill="#2563eb"/>
  <text x="152" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Strategy</text>
  <text x="268" y="124" font-size="13" font-weight="700" fill="#1d4ed8">Swap interchangeable algorithms behind one interface.</text>
  <text x="268" y="148" font-size="12" fill="#334155">Use when: the same task has several variants you want to choose at runtime.</text>

  <!-- Observer -->
  <rect x="40" y="178" width="740" height="76" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="52" y="190" width="200" height="52" rx="8" fill="#059669"/>
  <text x="152" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Observer</text>
  <text x="268" y="212" font-size="13" font-weight="700" fill="#047857">Notify many dependents automatically when one object changes.</text>
  <text x="268" y="236" font-size="12" fill="#334155">Use when: a change in one object must trigger updates in others (events, pub/sub).</text>

  <!-- Command -->
  <rect x="40" y="266" width="740" height="76" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="52" y="278" width="200" height="52" rx="8" fill="#d97706"/>
  <text x="152" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Command</text>
  <text x="268" y="300" font-size="13" font-weight="700" fill="#b45309">Wrap a request as an object.</text>
  <text x="268" y="324" font-size="12" fill="#334155">Use when: you need to queue, log, schedule, or undo/redo operations.</text>

  <!-- State -->
  <rect x="40" y="354" width="740" height="76" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="52" y="366" width="200" height="52" rx="8" fill="#7c3aed"/>
  <text x="152" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">State</text>
  <text x="268" y="388" font-size="13" font-weight="700" fill="#6d28d9">Change an object's behavior when its internal state changes.</text>
  <text x="268" y="412" font-size="12" fill="#334155">Use when: an object behaves like a state machine (order, document, connection).</text>

  <!-- Template Method -->
  <rect x="40" y="442" width="740" height="76" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="52" y="454" width="200" height="52" rx="8" fill="#0891b2"/>
  <text x="152" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Template</text>
  <text x="152" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Method</text>
  <text x="268" y="476" font-size="13" font-weight="700" fill="#0e7490">Fix an algorithm's skeleton; let subclasses fill in steps.</text>
  <text x="268" y="500" font-size="12" fill="#334155">Use when: several variants share a workflow but differ in a few steps.</text>

  <!-- Chain of Responsibility -->
  <rect x="40" y="530" width="740" height="76" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="52" y="542" width="200" height="52" rx="8" fill="#dc2626"/>
  <text x="152" y="568" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Chain of</text>
  <text x="152" y="586" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Responsibility</text>
  <text x="268" y="564" font-size="13" font-weight="700" fill="#b91c1c">Pass a request along handlers until one handles it.</text>
  <text x="268" y="588" font-size="12" fill="#334155">Use when: several handlers might process a request (middleware, approval flows).</text>
</svg>
