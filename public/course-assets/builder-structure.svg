<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Builder: Assemble a Complex Object Step by Step</text>

  <line x1="400" y1="56" x2="400" y2="400" stroke="#e2e8f0" stroke-width="2"/>

  <!-- LEFT: telescoping problem -->
  <text x="200" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">&#10007; Telescoping constructors</text>
  <rect x="40" y="96" width="320" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="120" font-size="11" fill="#991b1b" font-family="monospace">new Computer(cpu, ram)</text>
  <text x="56" y="140" font-size="11" fill="#991b1b" font-family="monospace">new Computer(cpu, ram, gpu)</text>
  <text x="56" y="160" font-size="11" fill="#991b1b" font-family="monospace">new Computer(cpu, ram, gpu, ssd)</text>
  <text x="56" y="180" font-size="11" fill="#991b1b" font-family="monospace">new Computer(cpu, ram, gpu,</text>
  <text x="56" y="196" font-size="11" fill="#991b1b" font-family="monospace">   ssd, os, wifi, bt, ...)</text>
  <text x="56" y="222" font-size="10.5" fill="#dc2626" font-weight="700">Which boolean was Wi-Fi again?</text>
  <text x="56" y="238" font-size="10.5" fill="#dc2626" font-weight="700">Unreadable &amp; error-prone.</text>

  <!-- RIGHT: fluent builder -->
  <text x="600" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">&#10003; Fluent builder</text>
  <rect x="440" y="96" width="330" height="150" rx="10" fill="#0f172a"/>
  <text x="456" y="120" font-size="11.5" fill="#93c5fd" font-family="monospace">Computer pc = new Builder()</text>
  <text x="470" y="140" font-size="11.5" fill="#e2e8f0" font-family="monospace">.cpu("M3").ram(16)</text>
  <text x="470" y="160" font-size="11.5" fill="#e2e8f0" font-family="monospace">.gpu("RTX")</text>
  <text x="470" y="180" font-size="11.5" fill="#e2e8f0" font-family="monospace">.wifi(true)</text>
  <text x="470" y="200" font-size="11.5" fill="#6ee7b7" font-family="monospace">.build();</text>
  <text x="456" y="228" font-size="10.5" fill="#94a3b8" font-family="monospace">// each step is NAMED and optional</text>

  <!-- flow -->
  <defs>
    <marker id="b_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="150" y="300" width="120" height="44" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="210" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Client</text>

  <rect x="340" y="300" width="130" height="44" rx="8" fill="#f5d0fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="405" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Builder</text>
  <text x="405" y="337" text-anchor="middle" font-size="9" fill="#6d28d9">collects the parts</text>

  <rect x="540" y="300" width="130" height="44" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="605" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">Computer</text>
  <text x="605" y="337" text-anchor="middle" font-size="9" fill="#0e7490">immutable result</text>

  <line x1="270" y1="322" x2="338" y2="322" stroke="#7c3aed" stroke-width="2" marker-end="url(#b_arr)"/>
  <text x="304" y="313" text-anchor="middle" font-size="9.5" fill="#6d28d9">steps</text>
  <line x1="470" y1="322" x2="538" y2="322" stroke="#7c3aed" stroke-width="2" marker-end="url(#b_arr)"/>
  <text x="504" y="313" text-anchor="middle" font-size="9.5" fill="#6d28d9">build()</text>

  <text x="400" y="384" text-anchor="middle" font-size="11.5" fill="#334155">build() can validate the whole object at the end and return an immutable, fully-formed Computer.</text>
</svg>
