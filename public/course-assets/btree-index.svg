<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .node { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .leaf { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 11px; fill: #64748b; }
    .path { font-size: 12px; font-weight: 700; fill: #d97706; }
    .step { font-size: 12px; fill: #334155; }
  </style>

  <text x="24" y="30" class="title">B-Tree index: finding id = 57 in ~3 steps, not a full scan</text>

  <!-- root -->
  <rect x="310" y="60" width="160" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="86" class="node">[ 30 | 60 ]</text>
  <text x="330" y="118" class="note">root: is 57 &lt;30? no. &lt;60? yes → middle</text>

  <!-- level 2 -->
  <rect x="70"  y="170" width="140" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="92"  y="195" class="node">[10 | 20]</text>
  <rect x="320" y="170" width="140" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="342" y="195" class="node">[40 | 50]</text>
  <rect x="570" y="170" width="140" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="592" y="195" class="node">[70 | 85]</text>
  <text x="320" y="230" class="note">is 57 &lt;40? no. &lt;50? no → right child</text>

  <!-- root to level2 lines -->
  <line x1="360" y1="102" x2="140" y2="170" stroke="#cbd5e1"/>
  <line x1="390" y1="102" x2="390" y2="170" stroke="#2563eb" stroke-width="2"/>
  <line x1="420" y1="102" x2="640" y2="170" stroke="#cbd5e1"/>

  <!-- leaves -->
  <g>
    <rect x="30"  y="290" width="86" height="36" rx="5" fill="#64748b"/><text x="44"  y="313" class="leaf">5,10</text>
    <rect x="124" y="290" width="86" height="36" rx="5" fill="#64748b"/><text x="138" y="313" class="leaf">15,20</text>
    <rect x="280" y="290" width="86" height="36" rx="5" fill="#64748b"/><text x="294" y="313" class="leaf">40,45</text>
    <rect x="374" y="290" width="96" height="36" rx="5" fill="#059669"/><text x="386" y="313" class="leaf">50,57★</text>
    <rect x="560" y="290" width="86" height="36" rx="5" fill="#64748b"/><text x="574" y="313" class="leaf">70,80</text>
    <rect x="654" y="290" width="86" height="36" rx="5" fill="#64748b"/><text x="668" y="313" class="leaf">85,90</text>
  </g>

  <!-- level2 to leaves lines -->
  <line x1="120" y1="210" x2="73"  y2="290" stroke="#cbd5e1"/>
  <line x1="160" y1="210" x2="167" y2="290" stroke="#cbd5e1"/>
  <line x1="370" y1="210" x2="323" y2="290" stroke="#cbd5e1"/>
  <line x1="410" y1="210" x2="422" y2="290" stroke="#059669" stroke-width="2"/>
  <line x1="620" y1="210" x2="603" y2="290" stroke="#cbd5e1"/>
  <line x1="660" y1="210" x2="697" y2="290" stroke="#cbd5e1"/>

  <text x="374" y="352" class="path">★ found: leaf points to the row on disk</text>

  <!-- leaf link (range scan) -->
  <path d="M 116 326 L 124 326 M 210 326 L 280 326 M 366 326 L 374 326 M 470 326 L 560 326 M 646 326 L 654 326" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="30" y="378" class="note">Leaves are linked in sorted order → range queries (id BETWEEN 40 AND 70) just walk sideways.</text>

  <!-- summary box -->
  <rect x="24" y="398" width="732" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="422" class="step">Without index: scan every row (O(n)).  With B-Tree: follow 3 pointers (O(log n)).</text>
  <text x="40" y="444" class="step">1 million rows → ~20 steps instead of 1,000,000. This is why indexes feel "instant".</text>
</svg>
