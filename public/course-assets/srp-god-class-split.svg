<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">SRP: One Class, One Reason to Change</text>
  <text x="410" y="56" text-anchor="middle" font-size="13" fill="#64748b">Each responsibility answers to a different stakeholder ("actor")</text>

  <!-- BEFORE: god class -->
  <text x="185" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">&#10007; Before &#8212; one class, three actors</text>
  <rect x="70" y="100" width="230" height="220" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="185" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">Invoice</text>
  <line x1="86" y1="138" x2="284" y2="138" stroke="#fca5a5" stroke-width="1.5"/>

  <rect x="88" y="150" width="194" height="46" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.4"/>
  <text x="100" y="169" font-size="12" fill="#991b1b" font-family="monospace">calculateTotals()</text>
  <text x="100" y="186" font-size="10" fill="#b45309">changes for &#8594; Finance</text>

  <rect x="88" y="204" width="194" height="46" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.4"/>
  <text x="100" y="223" font-size="12" fill="#991b1b" font-family="monospace">renderAsPdf()</text>
  <text x="100" y="240" font-size="10" fill="#7c3aed">changes for &#8594; Design</text>

  <rect x="88" y="258" width="194" height="46" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.4"/>
  <text x="100" y="277" font-size="12" fill="#991b1b" font-family="monospace">saveToDatabase()</text>
  <text x="100" y="294" font-size="10" fill="#1d4ed8">changes for &#8594; IT / DBA</text>

  <!-- arrow -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="312" y1="210" x2="360" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="336" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">split</text>

  <!-- AFTER: focused classes -->
  <text x="580" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">&#10003; After &#8212; one class per actor</text>

  <rect x="378" y="104" width="200" height="58" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="478" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">InvoiceCalculator</text>
  <text x="478" y="148" font-size="11" text-anchor="middle" fill="#065f46" font-family="monospace">calculateTotals()</text>

  <rect x="378" y="176" width="200" height="58" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="478" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">InvoicePdfRenderer</text>
  <text x="478" y="220" font-size="11" text-anchor="middle" fill="#065f46" font-family="monospace">renderAsPdf()</text>

  <rect x="378" y="248" width="200" height="58" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="478" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">InvoiceRepository</text>
  <text x="478" y="292" font-size="11" text-anchor="middle" fill="#065f46" font-family="monospace">save()</text>

  <!-- data object -->
  <rect x="620" y="176" width="160" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Invoice (data)</text>
  <text x="700" y="220" font-size="10.5" text-anchor="middle" fill="#1e3a8a">pure state, no logic</text>
  <line x1="578" y1="205" x2="616" y2="205" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>

  <text x="410" y="344" text-anchor="middle" font-size="12" fill="#334155">A change requested by Finance now touches only InvoiceCalculator &#8212; the PDF and storage code stay untouched.</text>
  <text x="410" y="366" text-anchor="middle" font-size="11.5" fill="#64748b">"Responsibility" = a reason to change = a stakeholder group. Three actors &#8594; three classes.</text>
</svg>
