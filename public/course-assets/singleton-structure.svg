<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Singleton: Every Caller Gets the Same One Instance</text>

  <defs>
    <marker id="s_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- clients -->
  <rect x="40" y="90" width="150" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="115" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">ServiceA</text>
  <rect x="40" y="177" width="150" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="115" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">ServiceB</text>
  <rect x="40" y="264" width="150" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="115" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">ServiceC</text>

  <text x="115" y="340" text-anchor="middle" font-size="11" fill="#64748b">each calls getInstance()</text>

  <!-- singleton -->
  <rect x="430" y="120" width="290" height="170" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="575" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">ConfigRegistry</text>
  <text x="575" y="166" text-anchor="middle" font-size="11" fill="#3730a3">(the single instance)</text>
  <line x1="450" y1="178" x2="700" y2="178" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="450" y="202" font-size="11.5" fill="#1e3a8a" font-family="monospace">- private static INSTANCE</text>
  <text x="450" y="224" font-size="11.5" fill="#1e3a8a" font-family="monospace">- private constructor()</text>
  <text x="450" y="252" font-size="11.5" fill="#1e3a8a" font-family="monospace">+ static getInstance()</text>
  <text x="450" y="274" font-size="11" fill="#2563eb">returns the one INSTANCE</text>

  <!-- arrows -->
  <line x1="190" y1="113" x2="428" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#s_arr)"/>
  <line x1="190" y1="200" x2="428" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#s_arr)"/>
  <line x1="190" y1="287" x2="428" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#s_arr)"/>

  <text x="380" y="380" text-anchor="middle" font-size="12" fill="#334155">The private constructor blocks <tspan font-family="monospace">new</tspan>; the only way in is getInstance(), which hands back the same object every time.</text>
</svg>
