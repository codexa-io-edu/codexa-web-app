<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Read-Write Lock: Many Readers OR One Writer</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">Reads don't conflict with each other, so let them run in parallel — only writes need exclusivity</text>

  <!-- READ mode -->
  <rect x="40" y="80" width="360" height="300" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="220" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">Read Lock (shared)</text>

  <rect x="70" y="126" width="80" height="40" rx="7" fill="#dcfce7" stroke="#059669"/><text x="110" y="151" text-anchor="middle" font-size="11" fill="#047857">Reader 1</text>
  <rect x="180" y="126" width="80" height="40" rx="7" fill="#dcfce7" stroke="#059669"/><text x="220" y="151" text-anchor="middle" font-size="11" fill="#047857">Reader 2</text>
  <rect x="290" y="126" width="80" height="40" rx="7" fill="#dcfce7" stroke="#059669"/><text x="330" y="151" text-anchor="middle" font-size="11" fill="#047857">Reader 3</text>

  <defs>
    <marker id="rw_arr" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="rw_arrR" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <line x1="110" y1="166" x2="200" y2="250" stroke="#059669" stroke-width="1.8" marker-end="url(#rw_arr)"/>
  <line x1="220" y1="166" x2="220" y2="250" stroke="#059669" stroke-width="1.8" marker-end="url(#rw_arr)"/>
  <line x1="330" y1="166" x2="240" y2="250" stroke="#059669" stroke-width="1.8" marker-end="url(#rw_arr)"/>

  <rect x="140" y="256" width="160" height="60" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
  <text x="220" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Shared Data</text>
  <text x="220" y="300" text-anchor="middle" font-size="9.5" fill="#065f46">read concurrently — safe</text>

  <text x="220" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">All readers proceed at once.</text>
  <text x="220" y="370" text-anchor="middle" font-size="10.5" fill="#065f46">Huge win for read-heavy workloads.</text>

  <!-- WRITE mode -->
  <rect x="420" y="80" width="360" height="300" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Write Lock (exclusive)</text>

  <rect x="560" y="126" width="80" height="40" rx="7" fill="#fee2e2" stroke="#dc2626"/><text x="600" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Writer</text>

  <rect x="450" y="126" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><text x="495" y="151" text-anchor="middle" font-size="9.5" fill="#64748b">reader — blocked</text>
  <rect x="660" y="126" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><text x="705" y="151" text-anchor="middle" font-size="9.5" fill="#64748b">reader — blocked</text>

  <line x1="600" y1="166" x2="600" y2="250" stroke="#dc2626" stroke-width="2" marker-end="url(#rw_arrR)"/>

  <rect x="520" y="256" width="160" height="60" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.8"/>
  <text x="600" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Shared Data</text>
  <text x="600" y="300" text-anchor="middle" font-size="9.5" fill="#991b1b">being modified</text>

  <text x="600" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">A writer excludes everyone —</text>
  <text x="600" y="370" text-anchor="middle" font-size="10.5" fill="#991b1b">all other readers and writers wait.</text>
</svg>
