<svg viewBox="0 0 820 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="450" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">DRY: The Three Situations</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Not all duplication is equal — and not all deduplication is an improvement</text>

  <!-- DUPLICATION -->
  <rect x="30" y="70" width="235" height="350" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="147" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">❌ Real Duplication</text>
  <text x="147" y="110" text-anchor="middle" font-size="9" fill="#64748b">same logic, two places</text>
  <rect x="46" y="120" width="204" height="120" rx="6" fill="#0f172a"/>
  <text x="56" y="140" font-family="monospace" font-size="8.5" fill="#e2e8f0">// in UserService</text>
  <text x="56" y="155" font-family="monospace" font-size="8.5" fill="#e2e8f0">double tax = amount * 0.18;</text>
  <text x="56" y="170" font-family="monospace" font-size="8.5" fill="#e2e8f0">total = amount + tax;</text>
  <text x="56" y="192" font-family="monospace" font-size="8.5" fill="#e2e8f0">// in OrderService</text>
  <text x="56" y="207" font-family="monospace" font-size="8.5" fill="#e2e8f0">double tax = amount * 0.18;</text>
  <text x="56" y="222" font-family="monospace" font-size="8.5" fill="#e2e8f0">total = amount + tax;</text>
  <text x="46" y="262" font-size="9.5" fill="#b91c1c">Tax rate change: must update</text>
  <text x="46" y="278" font-size="9.5" fill="#b91c1c">in TWO places. Miss one and</text>
  <text x="46" y="294" font-size="9.5" fill="#b91c1c">you have a silent bug.</text>
  <text x="46" y="318" font-size="9.5" font-weight="700" fill="#b91c1c">Fix: extract TaxCalculator</text>

  <!-- RIGHT ABSTRACTION -->
  <rect x="295" y="70" width="235" height="350" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="412" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">✓ Right Abstraction</text>
  <text x="412" y="110" text-anchor="middle" font-size="9" fill="#64748b">one home for one piece of knowledge</text>
  <rect x="311" y="120" width="204" height="130" rx="6" fill="#0f172a"/>
  <text x="321" y="140" font-family="monospace" font-size="8.5" fill="#e2e8f0">class TaxCalculator {</text>
  <text x="321" y="155" font-family="monospace" font-size="8.5" fill="#86efac">  double compute(double amt) {</text>
  <text x="321" y="170" font-family="monospace" font-size="8.5" fill="#86efac">    return amt * TAX_RATE;</text>
  <text x="321" y="185" font-family="monospace" font-size="8.5" fill="#86efac">  }</text>
  <text x="321" y="200" font-family="monospace" font-size="8.5" fill="#e2e8f0">}</text>
  <text x="321" y="220" font-family="monospace" font-size="8.5" fill="#e2e8f0">// UserService AND</text>
  <text x="321" y="235" font-family="monospace" font-size="8.5" fill="#e2e8f0">// OrderService both use it</text>
  <text x="311" y="275" font-size="9.5" fill="#047857">Tax rate change: update</text>
  <text x="311" y="291" font-size="9.5" fill="#047857">in ONE place. Correct</text>
  <text x="311" y="307" font-size="9.5" fill="#047857">everywhere, immediately.</text>
  <text x="311" y="330" font-size="9.5" font-weight="700" fill="#047857">The "right" DRY</text>

  <!-- OVER-ABSTRACTION -->
  <rect x="560" y="70" width="235" height="350" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="677" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">⚠ Over-Abstraction</text>
  <text x="677" y="110" text-anchor="middle" font-size="9" fill="#64748b">looks similar ≠ same thing</text>
  <rect x="576" y="120" width="204" height="150" rx="6" fill="#0f172a"/>
  <text x="586" y="140" font-family="monospace" font-size="8.5" fill="#e2e8f0">// User validation:</text>
  <text x="586" y="155" font-family="monospace" font-size="8.5" fill="#e2e8f0">if (name.length() > 50)</text>
  <text x="586" y="170" font-family="monospace" font-size="8.5" fill="#e2e8f0">  throw error();</text>
  <text x="586" y="188" font-family="monospace" font-size="8.5" fill="#e2e8f0">// Product validation:</text>
  <text x="586" y="203" font-family="monospace" font-size="8.5" fill="#e2e8f0">if (name.length() > 50)</text>
  <text x="586" y="218" font-family="monospace" font-size="8.5" fill="#e2e8f0">  throw error();</text>
  <text x="586" y="238" font-family="monospace" font-size="8.5" fill="#fbbf24">// "DRY" this into one method?</text>
  <text x="586" y="253" font-family="monospace" font-size="8.5" fill="#fbbf24">// NO — will diverge later:</text>
  <text x="576" y="294" font-size="9.5" fill="#b45309">User limit may go to 100;</text>
  <text x="576" y="310" font-size="9.5" fill="#b45309">Product limit to 200.</text>
  <text x="576" y="326" font-size="9.5" fill="#b45309">Merging them now couples</text>
  <text x="576" y="342" font-size="9.5" fill="#b45309">independent business rules.</text>
  <text x="576" y="366" font-size="9.5" font-weight="700" fill="#b45309">Rule of Three: wait for a third</text>
  <text x="576" y="382" font-size="9.5" font-weight="700" fill="#b45309">occurrence before abstracting.</text>

  <rect x="30" y="434" width="760" height="10" rx="3" fill="#f1f5f9"/>
</svg>
