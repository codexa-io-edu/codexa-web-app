<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .layer { font-size: 10px; font-weight: 700; fill: #1e293b; }
    .app { font-size: 9.5px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="title">Virtual machines vs. containers</text>

  <!-- VMs -->
  <rect x="24" y="48" width="360" height="300" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="24" y="48" width="360" height="32" rx="10" fill="#dc2626"/>
  <text x="44" y="70" class="h">Virtual machines — a full OS each</text>

  <!-- VM guests -->
  <g>
    <rect x="44" y="94" width="100" height="120" rx="6" fill="#fca5a5"/>
    <rect x="52" y="102" width="84" height="26" rx="3" fill="#dc2626"/><text x="94" y="119" text-anchor="middle" class="app">App A</text>
    <rect x="52" y="132" width="84" height="22" rx="3" fill="#ef4444"/><text x="94" y="147" text-anchor="middle" class="app">libs/bins</text>
    <rect x="52" y="158" width="84" height="48" rx="3" fill="#991b1b"/><text x="94" y="178" text-anchor="middle" class="app">Guest OS</text><text x="94" y="192" text-anchor="middle" class="app">(full kernel)</text>
  </g>
  <g>
    <rect x="152" y="94" width="100" height="120" rx="6" fill="#fca5a5"/>
    <rect x="160" y="102" width="84" height="26" rx="3" fill="#dc2626"/><text x="202" y="119" text-anchor="middle" class="app">App B</text>
    <rect x="160" y="132" width="84" height="22" rx="3" fill="#ef4444"/><text x="202" y="147" text-anchor="middle" class="app">libs/bins</text>
    <rect x="160" y="158" width="84" height="48" rx="3" fill="#991b1b"/><text x="202" y="178" text-anchor="middle" class="app">Guest OS</text><text x="202" y="192" text-anchor="middle" class="app">(full kernel)</text>
  </g>
  <g>
    <rect x="260" y="94" width="100" height="120" rx="6" fill="#fca5a5"/>
    <rect x="268" y="102" width="84" height="26" rx="3" fill="#dc2626"/><text x="310" y="119" text-anchor="middle" class="app">App C</text>
    <rect x="268" y="132" width="84" height="22" rx="3" fill="#ef4444"/><text x="310" y="147" text-anchor="middle" class="app">libs/bins</text>
    <rect x="268" y="158" width="84" height="48" rx="3" fill="#991b1b"/><text x="310" y="178" text-anchor="middle" class="app">Guest OS</text><text x="310" y="192" text-anchor="middle" class="app">(full kernel)</text>
  </g>

  <rect x="44" y="224" width="316" height="28" rx="4" fill="#7f1d1d"/><text x="202" y="243" text-anchor="middle" class="app">Hypervisor</text>
  <rect x="44" y="258" width="316" height="26" rx="4" fill="#475569"/><text x="202" y="276" text-anchor="middle" class="app">Host OS</text>
  <rect x="44" y="290" width="316" height="26" rx="4" fill="#334155"/><text x="202" y="308" text-anchor="middle" class="app">Physical hardware</text>

  <text x="44" y="336" class="note" fill="#991b1b">Each VM ships a full guest OS → GBs, slow boot (min).</text>

  <!-- Containers -->
  <rect x="416" y="48" width="360" height="300" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="416" y="48" width="360" height="32" rx="10" fill="#059669"/>
  <text x="436" y="70" class="h">Containers — share the host kernel</text>

  <g>
    <rect x="436" y="120" width="100" height="90" rx="6" fill="#6ee7b7"/>
    <rect x="444" y="128" width="84" height="30" rx="3" fill="#059669"/><text x="486" y="148" text-anchor="middle" class="app">App A</text>
    <rect x="444" y="162" width="84" height="40" rx="3" fill="#10b981"/><text x="486" y="186" text-anchor="middle" class="app">libs/bins</text>
  </g>
  <g>
    <rect x="544" y="120" width="100" height="90" rx="6" fill="#6ee7b7"/>
    <rect x="552" y="128" width="84" height="30" rx="3" fill="#059669"/><text x="594" y="148" text-anchor="middle" class="app">App B</text>
    <rect x="552" y="162" width="84" height="40" rx="3" fill="#10b981"/><text x="594" y="186" text-anchor="middle" class="app">libs/bins</text>
  </g>
  <g>
    <rect x="652" y="120" width="100" height="90" rx="6" fill="#6ee7b7"/>
    <rect x="660" y="128" width="84" height="30" rx="3" fill="#059669"/><text x="702" y="148" text-anchor="middle" class="app">App C</text>
    <rect x="660" y="162" width="84" height="40" rx="3" fill="#10b981"/><text x="702" y="186" text-anchor="middle" class="app">libs/bins</text>
  </g>

  <rect x="436" y="224" width="316" height="28" rx="4" fill="#065f46"/><text x="594" y="243" text-anchor="middle" class="app">Container runtime (containerd)</text>
  <rect x="436" y="258" width="316" height="26" rx="4" fill="#475569"/><text x="594" y="276" text-anchor="middle" class="app">Host OS (shared kernel)</text>
  <rect x="436" y="290" width="316" height="26" rx="4" fill="#334155"/><text x="594" y="308" text-anchor="middle" class="app">Physical hardware</text>

  <text x="436" y="336" class="note" fill="#065f46">No guest OS → MBs, start in milliseconds, high density.</text>

  <!-- footer -->
  <rect x="24" y="358" width="752" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="380" class="note"><tspan font-weight="700">Trade-off:</tspan> VMs isolate at the hardware level (separate kernels) → stronger isolation, heavier. Containers isolate at the process</text>
  <text x="40" y="398" class="note">level (shared kernel) → lighter &amp; faster, weaker isolation. They're often combined: containers running inside VMs in the cloud.</text>
</svg>
