<svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="840" height="360" fill="#ffffff"/>
  <text x="420" y="34" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Thread Lifecycle</text>

  <!-- New -->
  <rect x="30" y="80" width="120" height="56" rx="10" fill="#64748b"/>
  <text x="90" y="114" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">New</text>

  <!-- Runnable -->
  <rect x="230" y="80" width="150" height="56" rx="10" fill="#4f46e5"/>
  <text x="305" y="114" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Runnable</text>

  <!-- Running -->
  <rect x="470" y="80" width="150" height="56" rx="10" fill="#0d9488"/>
  <text x="545" y="114" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Running</text>

  <!-- Terminated -->
  <rect x="690" y="80" width="130" height="56" rx="10" fill="#1e293b"/>
  <text x="755" y="114" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Terminated</text>

  <!-- Blocked / Waiting -->
  <rect x="470" y="240" width="150" height="56" rx="10" fill="#dc2626"/>
  <text x="545" y="267" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Blocked /</text>
  <text x="545" y="285" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Waiting</text>

  <!-- New -> Runnable -->
  <line x1="150" y1="108" x2="224" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#la)"/>
  <text x="187" y="98" text-anchor="middle" fill="#64748b" font-size="11">start</text>

  <!-- Runnable -> Running (top) -->
  <line x1="380" y1="98" x2="464" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#la)"/>
  <text x="422" y="88" text-anchor="middle" fill="#64748b" font-size="11">dispatched</text>

  <!-- Running -> Runnable (bottom, preempted) -->
  <line x1="464" y1="122" x2="380" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#la)"/>
  <text x="422" y="138" text-anchor="middle" fill="#64748b" font-size="11">preempted</text>

  <!-- Running -> Terminated -->
  <line x1="620" y1="108" x2="684" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#la)"/>
  <text x="652" y="98" text-anchor="middle" fill="#64748b" font-size="11">exit</text>

  <!-- Running -> Blocked (down) -->
  <line x1="530" y1="136" x2="530" y2="234" stroke="#64748b" stroke-width="2" marker-end="url(#la)"/>
  <text x="418" y="190" text-anchor="middle" fill="#64748b" font-size="11">waits for I/O,</text>
  <text x="418" y="204" text-anchor="middle" fill="#64748b" font-size="11">lock, or sleep</text>

  <!-- Blocked -> Runnable (up-left) -->
  <path d="M 470 268 L 305 268 L 305 142" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#la)"/>
  <text x="360" y="288" text-anchor="middle" fill="#64748b" font-size="11">resource ready</text>

  <text x="420" y="336" text-anchor="middle" fill="#64748b" font-size="12">The OS scheduler moves threads between Runnable and Running; blocked threads wait, then rejoin the queue.</text>
</svg>
