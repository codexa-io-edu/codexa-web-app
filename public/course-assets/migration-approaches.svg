<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
    .lbl { font-size: 10px; font-weight: 700; fill: #1e293b; }
    .tick { font-size: 9px; fill: #94a3b8; }
  </style>

  <text x="24" y="30" class="title">Two ways to migrate — one of them usually fails</text>

  <!-- big bang -->
  <rect x="24" y="48" width="752" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="24" y="48" width="200" height="150" rx="10" fill="#dc2626"/>
  <text x="40" y="80" class="h">Big-bang rewrite</text>
  <text x="40" y="102" class="note" fill="#fee2e2">Build the whole new</text>
  <text x="40" y="116" class="note" fill="#fee2e2">system, then switch</text>
  <text x="40" y="130" class="note" fill="#fee2e2">everything at once.</text>
  <text x="40" y="158" class="note" fill="#fecaca">✗ high risk</text>
  <text x="40" y="174" class="note" fill="#fecaca">✗ no value for months</text>

  <!-- long bar -->
  <rect x="244" y="96" width="440" height="30" rx="4" fill="#f87171"/><text x="464" y="116" text-anchor="middle" class="h">rewrite everything (months / years)</text>
  <polygon points="690,86 720,111 690,136" fill="#7f1d1d"/><text x="700" y="155" text-anchor="middle" class="note" fill="#991b1b">risky</text><text x="700" y="169" text-anchor="middle" class="note" fill="#991b1b">cutover</text>
  <text x="244" y="150" class="note" fill="#991b1b">Value delivered only at the end — if it ever arrives. Requirements drift, the old system keeps changing, and the</text>
  <text x="244" y="166" class="note" fill="#991b1b">"second-system effect" bloats scope. Most large rewrites overrun or fail outright.</text>

  <!-- incremental -->
  <rect x="24" y="216" width="752" height="168" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="24" y="216" width="200" height="168" rx="10" fill="#059669"/>
  <text x="40" y="248" class="h">Incremental</text>
  <text x="40" y="266" class="h">(strangler fig)</text>
  <text x="40" y="290" class="note" fill="#dcfce7">Extract one capability</text>
  <text x="40" y="304" class="note" fill="#dcfce7">at a time; ship each,</text>
  <text x="40" y="318" class="note" fill="#dcfce7">keep running throughout.</text>
  <text x="40" y="346" class="note" fill="#bbf7d0">✓ low risk per step</text>
  <text x="40" y="362" class="note" fill="#bbf7d0">✓ value all along</text>
  <text x="40" y="378" class="note" fill="#bbf7d0">✓ reversible</text>

  <!-- small steps -->
  <rect x="244" y="264" width="90" height="26" rx="4" fill="#34d399"/><text x="289" y="282" text-anchor="middle" class="lbl" fill="#065f46">extract A</text>
  <rect x="344" y="264" width="90" height="26" rx="4" fill="#34d399"/><text x="389" y="282" text-anchor="middle" class="lbl" fill="#065f46">extract B</text>
  <rect x="444" y="264" width="90" height="26" rx="4" fill="#34d399"/><text x="489" y="282" text-anchor="middle" class="lbl" fill="#065f46">extract C</text>
  <rect x="544" y="264" width="90" height="26" rx="4" fill="#34d399"/><text x="589" y="282" text-anchor="middle" class="lbl" fill="#065f46">extract D</text>
  <rect x="644" y="264" width="110" height="26" rx="4" fill="#10b981"/><text x="699" y="282" text-anchor="middle" class="lbl" fill="#fff">retire monolith</text>
  <line x1="334" y1="277" x2="343" y2="277" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <line x1="434" y1="277" x2="443" y2="277" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <line x1="534" y1="277" x2="543" y2="277" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <line x1="634" y1="277" x2="643" y2="277" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>

  <text x="244" y="318" class="note" fill="#065f46">Each step is small, independently shippable, and reversible. The system stays live and keeps delivering features the</text>
  <text x="244" y="334" class="note" fill="#065f46">whole time. You can pause, re-prioritize, or stop early — and you learn as you go. This is the recommended path.</text>
  <text x="244" y="360" class="note" fill="#065f46" font-weight="700">Rule of thumb: never stop shipping business features during the migration.</text>

  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker></defs>
</svg>
