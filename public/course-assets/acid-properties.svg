<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .card-t { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .letter { font-size: 30px; font-weight: 800; fill: #ffffff; opacity: 0.35; }
    .h { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .c { font-size: 11px; fill: #334155; }
    .note { font-size: 11px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="title">ACID: the four guarantees of a transaction</text>
  <text x="24" y="50" class="note">Threaded through one example — transfer ₹500 from account A to account B (debit A, credit B).</text>

  <!-- Atomicity -->
  <rect x="24" y="66" width="366" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="66" width="366" height="34" rx="10" fill="#2563eb"/>
  <rect x="24" y="84" width="366" height="16" fill="#2563eb"/>
  <text x="40" y="89" class="card-t">A — Atomicity</text>
  <text x="330" y="94" class="letter">A</text>
  <text x="40" y="124" class="h">All or nothing</text>
  <text x="40" y="146" class="c">Both the debit and the credit happen, or</text>
  <text x="40" y="162" class="c">neither does. If the credit fails, the debit is</text>
  <text x="40" y="178" class="c">rolled back — money never half-moves.</text>
  <rect x="40" y="196" width="150" height="34" rx="5" fill="#dcfce7" stroke="#059669"/>
  <text x="52" y="217" class="c">✓ commit: A−500, B+500</text>
  <rect x="205" y="196" width="165" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="217" y="217" class="c">✗ fail: rollback, no change</text>

  <!-- Consistency -->
  <rect x="410" y="66" width="366" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="410" y="66" width="366" height="34" rx="10" fill="#059669"/>
  <rect x="410" y="84" width="366" height="16" fill="#059669"/>
  <text x="426" y="89" class="card-t">C — Consistency</text>
  <text x="716" y="94" class="letter">C</text>
  <text x="426" y="124" class="h">Rules stay valid</text>
  <text x="426" y="146" class="c">The transaction moves the DB from one</text>
  <text x="426" y="162" class="c">valid state to another: total money is</text>
  <text x="426" y="178" class="c">unchanged, no balance goes negative,</text>
  <text x="426" y="194" class="c">all constraints/foreign keys still hold.</text>
  <rect x="426" y="206" width="334" height="28" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="438" y="224" class="note">≠ distributed consistency (that's the Consistency Models topic)</text>

  <!-- Isolation -->
  <rect x="24" y="258" width="366" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="258" width="366" height="34" rx="10" fill="#d97706"/>
  <rect x="24" y="276" width="366" height="16" fill="#d97706"/>
  <text x="40" y="281" class="card-t">I — Isolation</text>
  <text x="330" y="286" class="letter">I</text>
  <text x="40" y="316" class="h">Concurrent transactions don't interfere</text>
  <text x="40" y="338" class="c">If two transfers touch account A at the</text>
  <text x="40" y="354" class="c">same time, each behaves as if it ran alone —</text>
  <text x="40" y="370" class="c">no seeing each other's half-finished work.</text>
  <rect x="40" y="388" width="330" height="34" rx="5" fill="#fffbeb" stroke="#d97706"/>
  <text x="52" y="409" class="note">tunable via Isolation Levels → see that subtopic</text>

  <!-- Durability -->
  <rect x="410" y="258" width="366" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="410" y="258" width="366" height="34" rx="10" fill="#7c3aed"/>
  <rect x="410" y="276" width="366" height="16" fill="#7c3aed"/>
  <text x="426" y="281" class="card-t">D — Durability</text>
  <text x="716" y="286" class="letter">D</text>
  <text x="426" y="316" class="h">Survives crashes</text>
  <text x="426" y="338" class="c">Once "transfer complete" is returned, the</text>
  <text x="426" y="354" class="c">result is permanent — even if the server</text>
  <text x="426" y="370" class="c">loses power the next instant.</text>
  <rect x="426" y="388" width="334" height="34" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="438" y="409" class="note">achieved by writing to a durable log before acknowledging</text>
</svg>
