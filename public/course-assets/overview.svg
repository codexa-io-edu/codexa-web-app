<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Request &amp; Response Modeling</text>
  <text x="410" y="63" text-anchor="middle" font-size="13" fill="#64748b">The three layers between an HTTP call and your domain: shape, guard, and fail gracefully</text>
  <defs><marker id="ov_a" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs>
  <rect x="40" y="96" width="740" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="56" y="112" width="190" height="56" rx="8" fill="#2563eb"/>
  <text x="151" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1 · DTOs</text>
  <text x="151" y="157" text-anchor="middle" font-size="11" fill="#bfdbfe">Data Transfer Objects</text>
  <text x="262" y="130" font-size="12.5" font-weight="700" fill="#1d4ed8">Shape the data crossing the API boundary.</text>
  <text x="262" y="151" font-size="11" fill="#334155">Why domain entities must not be exposed directly; separate request/response DTOs;</text>
  <text x="262" y="169" font-size="11" fill="#334155">serialization, null-safety, and the mapper layer.</text>
  <line x1="410" y1="184" x2="410" y2="202" stroke="#94a3b8" stroke-width="2" marker-end="url(#ov_a)"/>
  <rect x="40" y="204" width="740" height="88" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="56" y="220" width="190" height="56" rx="8" fill="#059669"/>
  <text x="151" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2 · Validation</text>
  <text x="151" y="265" text-anchor="middle" font-size="11" fill="#bbf7d0">Input Validation</text>
  <text x="262" y="238" font-size="12.5" font-weight="700" fill="#047857">Guard the boundary before bad data enters the domain.</text>
  <text x="262" y="259" font-size="11" fill="#334155">Syntactic vs semantic; Bean Validation annotations; where to validate;</text>
  <text x="262" y="277" font-size="11" fill="#334155">layered defense; custom constraints; validation groups.</text>
  <line x1="410" y1="292" x2="410" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#ov_a)"/>
  <rect x="40" y="312" width="740" height="88" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="56" y="328" width="190" height="56" rx="8" fill="#dc2626"/>
  <text x="151" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3 · Error Handling</text>
  <text x="151" y="373" text-anchor="middle" font-size="11" fill="#fecaca">Structured Error Responses</text>
  <text x="262" y="346" font-size="12.5" font-weight="700" fill="#b91c1c">Fail gracefully with precise, consistent, non-leaking error responses.</text>
  <text x="262" y="367" font-size="11" fill="#334155">Exception hierarchy; mapping to status codes; global handlers;</text>
  <text x="262" y="385" font-size="11" fill="#334155">RFC 9457 Problem Details; what never to expose to clients.</text>
</svg>
