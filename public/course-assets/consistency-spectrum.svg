<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #1e293b; }
    .desc { font-size: 11px; fill: #475569; }
    .note { font-size: 11px; fill: #64748b; }
    .end { font-size: 13px; font-weight: 700; fill: #ffffff; }
  </style>

  <text x="24" y="30" class="title">The consistency spectrum</text>
  <text x="24" y="50" class="note">Consistency is a dial, not a switch. Stronger = more correct &amp; intuitive but slower/less available; weaker = faster &amp; more available but reads may be stale.</text>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect x="24" y="66" width="732" height="30" rx="15" fill="url(#grad)"/>
  <text x="44" y="86" class="end">STRONG</text>
  <text x="648" y="86" class="end">EVENTUAL</text>

  <text x="24" y="118" class="note">← every read sees the latest write</text>
  <text x="560" y="118" class="note">replicas converge over time →</text>

  <!-- stops -->
  <line x1="80" y1="96" x2="80" y2="140" stroke="#94a3b8"/>
  <rect x="34" y="146" width="150" height="86" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="46" y="168" class="lbl" fill="#2563eb">Strong</text>
  <text x="46" y="188" class="desc">Behaves as one copy;</text>
  <text x="46" y="203" class="desc">no stale reads. Needs</text>
  <text x="46" y="218" class="desc">coordination → slower.</text>

  <line x1="390" y1="96" x2="390" y2="140" stroke="#94a3b8"/>
  <rect x="220" y="146" width="330" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="232" y="168" class="lbl">Consistency levels (the tunable middle)</text>
  <text x="232" y="188" class="desc">Quorums (R + W &gt; N) and session guarantees like</text>
  <text x="232" y="203" class="desc">read-your-writes, monotonic reads, and causal order —</text>
  <text x="232" y="218" class="desc">choose the strength you need per operation.</text>

  <line x1="700" y1="96" x2="700" y2="140" stroke="#94a3b8"/>
  <rect x="586" y="146" width="170" height="86" rx="8" fill="#f0fdf4" stroke="#059669"/>
  <text x="598" y="168" class="lbl" fill="#059669">Eventual</text>
  <text x="598" y="188" class="desc">Reads may be stale,</text>
  <text x="598" y="203" class="desc">but all replicas</text>
  <text x="598" y="218" class="desc">converge eventually.</text>

  <!-- what it's NOT -->
  <rect x="24" y="252" width="732" height="92" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="40" y="276" class="lbl" fill="#92400e">Don't confuse these three "consistencies"</text>
  <text x="40" y="298" class="note">• <tspan font-weight="700">Distributed consistency</tspan> (this topic) — do replicas agree on what a read returns?</text>
  <text x="40" y="316" class="note">• <tspan font-weight="700">ACID "C"</tspan> — does a transaction keep the database's rules valid? (Transaction Management topic)</text>
  <text x="40" y="334" class="note">• The <tspan font-weight="700">C in CAP</tspan> — the availability trade-off under a network partition. (CAP Theorem topic)</text>
</svg>
