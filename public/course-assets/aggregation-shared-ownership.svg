<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="400" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Aggregation: Parts Are Independent &amp; Can Be Shared</text>
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#64748b">A Player can belong to more than one Team, and outlives any team.</text>

  <!-- two wholes -->
  <rect x="90" y="90" width="200" height="50" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="190" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Team: Club (League)</text>

  <rect x="490" y="90" width="200" height="50" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Team: Nation (Cup)</text>

  <!-- shared part -->
  <rect x="300" y="215" width="180" height="56" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/>
  <text x="390" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Player: "Mia"</text>
  <text x="390" y="260" text-anchor="middle" font-size="11" fill="#475569">one object, referenced twice</text>

  <!-- hollow diamond connectors from each whole -->
  <line x1="190" y1="140" x2="300" y2="230" stroke="#047857" stroke-width="1.8"/>
  <path d="M190,140 L182,147 L190,154 L198,147 Z" fill="#ffffff" stroke="#047857" stroke-width="1.8"/>
  <text x="215" y="180" font-size="11" fill="#059669">has &#9671;</text>

  <line x1="590" y1="140" x2="480" y2="230" stroke="#047857" stroke-width="1.8"/>
  <path d="M590,140 L582,147 L590,154 L598,147 Z" fill="#ffffff" stroke="#047857" stroke-width="1.8"/>
  <text x="540" y="180" font-size="11" fill="#059669">&#9671; has</text>

  <!-- key points -->
  <rect x="120" y="300" width="540" height="80" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Why this is aggregation, not composition</text>
  <text x="140" y="346" font-size="11.5" fill="#065f46">&#8226; Mia is created independently and handed to each team (not created by them).</text>
  <text x="140" y="366" font-size="11.5" fill="#065f46">&#8226; If either team dissolves, Mia keeps existing &#8212; a part is never owned exclusively.</text>
</svg>
