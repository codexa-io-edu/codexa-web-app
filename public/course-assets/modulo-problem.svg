<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .c { font-size: 12px; fill: #1e293b; font-family: 'Consolas','Courier New',monospace; }
    .note { font-size: 10.5px; fill: #64748b; }
    .moved { font-size: 11px; font-weight: 700; fill: #dc2626; }
    .same { font-size: 11px; font-weight: 700; fill: #059669; }
  </style>

  <text x="24" y="30" class="title">Why plain modulo hashing breaks when the server count changes</text>
  <text x="24" y="50" class="note">A distributed cache with 4 nodes uses <tspan font-family="'Consolas'">node = hash(key) % 4</tspan>. Add a 5th node → <tspan font-family="'Consolas'">% 5</tspan>, and almost every key moves.</text>

  <!-- header -->
  <rect x="60" y="66" width="120" height="30" fill="#1e293b"/><text x="90" y="86" class="h">key</text>
  <rect x="180" y="66" width="140" height="30" fill="#334155"/><text x="210" y="86" class="h">hash(key)</text>
  <rect x="320" y="66" width="160" height="30" fill="#2563eb"/><text x="345" y="86" class="h">% 4  (before)</text>
  <rect x="480" y="66" width="160" height="30" fill="#7c3aed"/><text x="505" y="86" class="h">% 5  (after)</text>
  <rect x="640" y="66" width="120" height="30" fill="#334155"/><text x="665" y="86" class="h">moved?</text>

  <!-- rows -->
  <g>
    <!-- helper: each row 28px -->
    <!-- k0 -->
    <rect x="60" y="96" width="700" height="28" fill="#fef2f2"/>
    <text x="72" y="115" class="c">k0</text><text x="200" y="115" class="c">10</text><text x="360" y="115" class="c">2</text><text x="520" y="115" class="c">0</text><text x="668" y="115" class="moved">moved</text>
    <!-- k1 -->
    <rect x="60" y="124" width="700" height="28" fill="#ffffff"/>
    <text x="72" y="143" class="c">k1</text><text x="200" y="143" class="c">11</text><text x="360" y="143" class="c">3</text><text x="520" y="143" class="c">1</text><text x="668" y="143" class="moved">moved</text>
    <!-- k2 -->
    <rect x="60" y="152" width="700" height="28" fill="#fef2f2"/>
    <text x="72" y="171" class="c">k2</text><text x="200" y="171" class="c">12</text><text x="360" y="171" class="c">0</text><text x="520" y="171" class="c">2</text><text x="668" y="171" class="moved">moved</text>
    <!-- k3 -->
    <rect x="60" y="180" width="700" height="28" fill="#ffffff"/>
    <text x="72" y="199" class="c">k3</text><text x="200" y="199" class="c">13</text><text x="360" y="199" class="c">1</text><text x="520" y="199" class="c">3</text><text x="668" y="199" class="moved">moved</text>
    <!-- k4 -->
    <rect x="60" y="208" width="700" height="28" fill="#fef2f2"/>
    <text x="72" y="227" class="c">k4</text><text x="200" y="227" class="c">14</text><text x="360" y="227" class="c">2</text><text x="520" y="227" class="c">4</text><text x="668" y="227" class="moved">moved</text>
    <!-- k5 -->
    <rect x="60" y="236" width="700" height="28" fill="#ffffff"/>
    <text x="72" y="255" class="c">k5</text><text x="200" y="255" class="c">15</text><text x="360" y="255" class="c">3</text><text x="520" y="255" class="c">0</text><text x="668" y="255" class="moved">moved</text>
    <!-- k6 -->
    <rect x="60" y="264" width="700" height="28" fill="#fef2f2"/>
    <text x="72" y="283" class="c">k6</text><text x="200" y="283" class="c">16</text><text x="360" y="283" class="c">0</text><text x="520" y="283" class="c">1</text><text x="668" y="283" class="moved">moved</text>
    <!-- k7 -->
    <rect x="60" y="292" width="700" height="28" fill="#f0fdf4"/>
    <text x="72" y="311" class="c">k7</text><text x="200" y="311" class="c">20</text><text x="360" y="311" class="c">0</text><text x="520" y="311" class="c">0</text><text x="668" y="311" class="same">same</text>
  </g>
  <rect x="60" y="96" width="700" height="224" fill="none" stroke="#e2e8f0"/>

  <!-- footer -->
  <rect x="24" y="338" width="752" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="362" class="note"><tspan font-weight="700" fill="#dc2626">7 of 8 keys moved to a different node</tspan> just by adding one server. In a cache, that means a flood of misses that all</text>
  <text x="40" y="382" class="note">hit the database at once (a stampede). In a sharded store, it means moving almost all your data. This is the problem</text>
  <text x="40" y="398" class="note">consistent hashing solves — it moves only about <tspan font-family="'Consolas'">K/N</tspan> keys when the pool changes, not nearly all of them.</text>
</svg>
