<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .step { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
    .note { font-size: 10.5px; fill: #64748b; }
    .bad { font-size: 11px; font-weight: 700; fill: #dc2626; }
  </style>

  <text x="24" y="30" class="title">At-least-once: process first, then acknowledge</text>

  <text x="60" y="72" class="step">Broker</text>
  <text x="600" y="72" class="step">Consumer</text>
  <line x1="90" y1="80" x2="90" y2="308" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="640" y1="80" x2="640" y2="308" stroke="#cbd5e1" stroke-width="2"/>

  <!-- deliver -->
  <line x1="90" y1="106" x2="640" y2="106" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <text x="150" y="98" class="step">1 · deliver message (id=abc)</text>

  <!-- process -->
  <rect x="540" y="120" width="180" height="26" rx="5" fill="#059669"/><text x="630" y="138" text-anchor="middle" class="box">2 · process (effect done ✓)</text>

  <!-- ack lost -->
  <line x1="640" y1="166" x2="300" y2="166" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="340" y="158" class="bad">3 · ack lost (or crash before ack)</text>
  <line x1="300" y1="156" x2="316" y2="176" stroke="#dc2626" stroke-width="2"/><line x1="316" y1="156" x2="300" y2="176" stroke="#dc2626" stroke-width="2"/>

  <!-- redeliver -->
  <line x1="90" y1="206" x2="640" y2="206" stroke="#d97706" stroke-width="2" marker-end="url(#o)"/>
  <text x="140" y="198" class="step">4 · broker redelivers (id=abc again)</text>

  <!-- process again -->
  <rect x="540" y="220" width="180" height="26" rx="5" fill="#dc2626"/><text x="630" y="238" text-anchor="middle" class="box">5 · process AGAIN → DUPLICATE</text>

  <line x1="640" y1="266" x2="90" y2="266" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <text x="230" y="258" class="step">6 · ack succeeds this time</text>

  <rect x="24" y="296" width="732" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="318" class="note">Because the ack happens after the work, nothing is lost — but a lost ack or a crash-before-ack causes redelivery, so the effect can happen twice.</text>
  <text x="40" y="336" class="note">The fix is <tspan font-weight="700">idempotent processing</tspan>: make handling id=abc twice equivalent to handling it once (next diagram).</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  </defs>
</svg>
