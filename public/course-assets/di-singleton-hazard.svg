<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">The DI Trap: One Shared Bean, Many Request Threads</text>

  <line x1="410" y1="56" x2="410" y2="410" stroke="#e2e8f0" stroke-width="2"/>

  <defs>
    <marker id="di_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- LEFT: broken -->
  <text x="205" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">&#10007; Singleton bean with mutable field</text>

  <rect x="60" y="96" width="80" height="42" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="100" y="122" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Thread 1</text>
  <rect x="165" y="96" width="80" height="42" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="205" y="122" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Thread 2</text>
  <rect x="270" y="96" width="80" height="42" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="310" y="122" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Thread 3</text>

  <rect x="90" y="210" width="230" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
  <text x="205" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">@Service OrderService</text>
  <text x="205" y="252" text-anchor="middle" font-size="10" fill="#991b1b">(one shared instance)</text>
  <line x1="108" y1="262" x2="302" y2="262" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="205" y="282" text-anchor="middle" font-size="11" fill="#991b1b" font-family="monospace">private Order current;</text>
  <text x="205" y="298" text-anchor="middle" font-size="9.5" fill="#dc2626">MUTABLE — shared by all threads!</text>

  <line x1="100" y1="138" x2="180" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#di_arr)"/>
  <line x1="205" y1="138" x2="205" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#di_arr)"/>
  <line x1="310" y1="138" x2="230" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#di_arr)"/>

  <rect x="70" y="330" width="270" height="66" rx="8" fill="#fff1f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="205" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Thread 2 overwrites 'current'</text>
  <text x="205" y="370" text-anchor="middle" font-size="10.5" fill="#991b1b">while Thread 1 is mid-request &#8594;</text>
  <text x="205" y="386" text-anchor="middle" font-size="10.5" fill="#991b1b">data corruption / wrong customer's order</text>

  <!-- RIGHT: fixed -->
  <text x="615" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">&#10003; Stateless singleton (state on the stack)</text>

  <rect x="470" y="96" width="80" height="42" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="510" y="122" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Thread 1</text>
  <rect x="575" y="96" width="80" height="42" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="615" y="122" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Thread 2</text>
  <rect x="680" y="96" width="80" height="42" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="720" y="122" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Thread 3</text>

  <rect x="500" y="210" width="230" height="96" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2.4"/>
  <text x="615" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">@Service OrderService</text>
  <text x="615" y="252" text-anchor="middle" font-size="10" fill="#065f46">(one shared instance)</text>
  <line x1="518" y1="262" x2="712" y2="262" stroke="#86efac" stroke-width="1.2"/>
  <text x="615" y="282" text-anchor="middle" font-size="10.5" fill="#065f46" font-family="monospace">process(Order o) { ... }</text>
  <text x="615" y="298" text-anchor="middle" font-size="9.5" fill="#047857">no mutable fields — order is a LOCAL</text>

  <line x1="510" y1="138" x2="590" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#di_arr)"/>
  <line x1="615" y1="138" x2="615" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#di_arr)"/>
  <line x1="720" y1="138" x2="640" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#di_arr)"/>

  <rect x="480" y="330" width="270" height="66" rx="8" fill="#f0fdf4" stroke="#34d399" stroke-width="1.3"/>
  <text x="615" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Each thread's data lives on its</text>
  <text x="615" y="370" text-anchor="middle" font-size="10.5" fill="#065f46">own stack (confined) — nothing shared,</text>
  <text x="615" y="386" text-anchor="middle" font-size="10.5" fill="#065f46">so the shared bean is safe by default.</text>
</svg>
