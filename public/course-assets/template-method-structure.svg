<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Template Method: Fixed Skeleton, Variable Steps</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748b">The base class owns the workflow order; subclasses fill in only the steps that differ</text>

  <!-- template method skeleton -->
  <rect x="60" y="86" width="290" height="260" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2.4"/>
  <text x="205" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">Beverage (abstract)</text>
  <text x="205" y="130" text-anchor="middle" font-size="10" fill="#0891b2">prepare()  ← the template method (final)</text>
  <line x1="78" y1="140" x2="332" y2="140" stroke="#67e8f9" stroke-width="1.2"/>

  <rect x="80" y="152" width="240" height="30" rx="6" fill="#cffafe"/><text x="200" y="172" text-anchor="middle" font-size="11" fill="#0e7490" font-family="monospace">1. boilWater()   (fixed)</text>
  <rect x="80" y="188" width="240" height="30" rx="6" fill="#fef9c3"/><text x="200" y="208" text-anchor="middle" font-size="11" fill="#854d0e" font-family="monospace">2. brew()        (abstract)</text>
  <rect x="80" y="224" width="240" height="30" rx="6" fill="#cffafe"/><text x="200" y="244" text-anchor="middle" font-size="11" fill="#0e7490" font-family="monospace">3. pourInCup()   (fixed)</text>
  <rect x="80" y="260" width="240" height="30" rx="6" fill="#fef9c3"/><text x="200" y="280" text-anchor="middle" font-size="11" fill="#854d0e" font-family="monospace">4. addCondiments() (abstract)</text>
  <rect x="80" y="296" width="240" height="30" rx="6" fill="#e0f2fe"/><text x="200" y="316" text-anchor="middle" font-size="10.5" fill="#0369a1" font-family="monospace">5. addSugar()?   (hook, optional)</text>

  <!-- legend -->
  <rect x="90" y="360" width="14" height="14" rx="3" fill="#cffafe"/><text x="112" y="372" font-size="10" fill="#334155">fixed step</text>
  <rect x="200" y="360" width="14" height="14" rx="3" fill="#fef9c3"/><text x="222" y="372" font-size="10" fill="#334155">subclass fills in</text>

  <defs>
    <marker id="tm_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- subclasses -->
  <rect x="470" y="130" width="280" height="90" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="610" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Tea extends Beverage</text>
  <text x="610" y="176" text-anchor="middle" font-size="10" fill="#7c2d12" font-family="monospace">brew() = steep tea bag</text>
  <text x="610" y="194" text-anchor="middle" font-size="10" fill="#7c2d12" font-family="monospace">addCondiments() = lemon</text>
  <text x="610" y="212" text-anchor="middle" font-size="9" fill="#7c2d12">(inherits the workflow order)</text>

  <rect x="470" y="240" width="280" height="90" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="610" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Coffee extends Beverage</text>
  <text x="610" y="286" text-anchor="middle" font-size="10" fill="#7c2d12" font-family="monospace">brew() = drip grounds</text>
  <text x="610" y="304" text-anchor="middle" font-size="10" fill="#7c2d12" font-family="monospace">addCondiments() = milk, sugar</text>
  <text x="610" y="322" text-anchor="middle" font-size="9" fill="#7c2d12">(inherits the workflow order)</text>

  <line x1="350" y1="200" x2="468" y2="175" stroke="#0891b2" stroke-width="1.6" marker-end="url(#tm_arr)"/>
  <line x1="350" y1="275" x2="468" y2="285" stroke="#0891b2" stroke-width="1.6" marker-end="url(#tm_arr)"/>
  <text x="400" y="235" text-anchor="middle" font-size="9.5" fill="#64748b">fill in the abstract steps</text>
</svg>
