<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Aggregation vs Composition: It's About Lifetime</text>

  <!-- divider -->
  <line x1="410" y1="60" x2="410" y2="400" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ LEFT: AGGREGATION ============ -->
  <text x="205" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#047857">AGGREGATION  (weak "has-a")</text>
  <text x="205" y="104" text-anchor="middle" font-size="12" fill="#059669">Team  &#9671;&#8212;  Players</text>

  <!-- whole -->
  <rect x="120" y="120" width="170" height="46" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="205" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Team "Falcons"</text>

  <!-- parts -->
  <rect x="60" y="196" width="130" height="40" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
  <text x="125" y="221" text-anchor="middle" font-size="12" fill="#065f46">Player: Ana</text>
  <rect x="220" y="196" width="130" height="40" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
  <text x="285" y="221" text-anchor="middle" font-size="12" fill="#065f46">Player: Ben</text>

  <!-- hollow diamond connectors -->
  <line x1="205" y1="166" x2="125" y2="196" stroke="#047857" stroke-width="1.6"/>
  <path d="M205,166 L197,172 L205,178 L213,172 Z" fill="#ffffff" stroke="#047857" stroke-width="1.6"/>
  <line x1="205" y1="166" x2="285" y2="196" stroke="#047857" stroke-width="1.6"/>

  <!-- outcome -->
  <rect x="55" y="272" width="300" height="110" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="205" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Team disbands &#10007;</text>
  <text x="70" y="322" font-size="11.5" fill="#065f46">&#8226; Players are created OUTSIDE and</text>
  <text x="82" y="338" font-size="11.5" fill="#065f46">passed in.</text>
  <text x="70" y="358" font-size="11.5" fill="#065f46">&#8226; Ana &amp; Ben still exist &#8212; they can</text>
  <text x="82" y="374" font-size="11.5" fill="#065f46">join another team. Parts OUTLIVE whole.</text>

  <!-- ============ RIGHT: COMPOSITION ============ -->
  <text x="615" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">COMPOSITION  (strong "owns-a")</text>
  <text x="615" y="104" text-anchor="middle" font-size="12" fill="#dc2626">House  &#9670;&#8212;  Rooms</text>

  <!-- whole -->
  <rect x="530" y="120" width="170" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="615" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">House #12</text>

  <!-- parts -->
  <rect x="470" y="196" width="130" height="40" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.8"/>
  <text x="535" y="221" text-anchor="middle" font-size="12" fill="#991b1b">Room: Kitchen</text>
  <rect x="630" y="196" width="130" height="40" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.8"/>
  <text x="695" y="221" text-anchor="middle" font-size="12" fill="#991b1b">Room: Bedroom</text>

  <!-- filled diamond connectors -->
  <line x1="615" y1="166" x2="535" y2="196" stroke="#b91c1c" stroke-width="1.6"/>
  <path d="M615,166 L607,172 L615,178 L623,172 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.6"/>
  <line x1="615" y1="166" x2="695" y2="196" stroke="#b91c1c" stroke-width="1.6"/>

  <!-- outcome -->
  <rect x="465" y="272" width="300" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="615" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">House demolished &#10007;</text>
  <text x="480" y="322" font-size="11.5" fill="#991b1b">&#8226; Rooms are created INSIDE the house</text>
  <text x="492" y="338" font-size="11.5" fill="#991b1b">and belong to it alone.</text>
  <text x="480" y="358" font-size="11.5" fill="#991b1b">&#8226; The kitchen &amp; bedroom cease to exist.</text>
  <text x="492" y="374" font-size="11.5" fill="#991b1b">Parts DIE WITH the whole.</text>
</svg>
