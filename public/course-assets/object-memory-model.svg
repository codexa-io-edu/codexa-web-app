<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Reference vs Object: Stack points to Heap</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#64748b">Car car1 = new Car("red");  &#8594; the variable is a handle, the object lives on the heap</text>

  <!-- Stack -->
  <rect x="60" y="90" width="250" height="270" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">STACK (variables / references)</text>

  <rect x="90" y="140" width="190" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="102" y="163" font-size="12.5" fill="#1e3a8a" font-family="monospace">car1</text>
  <text x="102" y="180" font-size="10.5" fill="#64748b" font-family="monospace">= 0x8A2  &#8594;</text>

  <rect x="90" y="200" width="190" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="102" y="223" font-size="12.5" fill="#1e3a8a" font-family="monospace">car2</text>
  <text x="102" y="240" font-size="10.5" fill="#64748b" font-family="monospace">= 0x8A2  &#8594;</text>

  <rect x="90" y="260" width="190" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="102" y="283" font-size="12.5" fill="#1e3a8a" font-family="monospace">car3</text>
  <text x="102" y="300" font-size="10.5" fill="#64748b" font-family="monospace">= null</text>

  <!-- Heap -->
  <rect x="450" y="90" width="250" height="270" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="575" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">HEAP (actual objects)</text>

  <rect x="480" y="150" width="190" height="120" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
  <text x="575" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Car @ 0x8A2</text>
  <line x1="495" y1="184" x2="655" y2="184" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="498" y="208" font-size="12" fill="#065f46" font-family="monospace">color = "red"</text>
  <text x="498" y="230" font-size="12" fill="#065f46" font-family="monospace">speed = 80</text>
  <text x="498" y="256" font-size="10.5" fill="#059669">(shared by car1 &amp; car2)</text>

  <!-- arrows -->
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <line x1="280" y1="163" x2="478" y2="185" stroke="#0f766e" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="280" y1="223" x2="478" y2="210" stroke="#0f766e" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- null note -->
  <text x="290" y="290" font-size="11" fill="#dc2626">car3 &#8594; nothing (null)</text>

  <text x="380" y="388" text-anchor="middle" font-size="11.5" fill="#64748b">Because car1 and car2 hold the same address, mutating through one is visible through the other (aliasing).</text>
</svg>
