<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .box { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    .mod { font-size: 10px; font-weight: 700; fill: #1e293b; }
    .note { font-size: 10px; fill: #64748b; }
    .db { font-size: 10px; font-weight: 700; fill: #ffffff; }
  </style>

  <text x="24" y="30" class="title">The two shapes of an application</text>

  <!-- MONOLITH -->
  <rect x="24" y="48" width="360" height="380" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="24" y="48" width="360" height="34" rx="10" fill="#2563eb"/>
  <text x="44" y="71" class="h">Monolith — one deployable unit</text>

  <!-- one big box -->
  <rect x="60" y="100" width="288" height="210" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="204" y="120" text-anchor="middle" class="note">single process / codebase</text>
  <rect x="76" y="132" width="256" height="26" rx="4" fill="#dbeafe"/><text x="204" y="150" text-anchor="middle" class="mod">UI / Presentation layer</text>
  <rect x="76" y="164" width="256" height="80" rx="4" fill="#dbeafe"/>
  <text x="204" y="182" text-anchor="middle" class="mod">Business logic (all modules together)</text>
  <rect x="88" y="192" width="55" height="24" rx="3" fill="#93c5fd"/><text x="115" y="208" text-anchor="middle" class="mod">Orders</text>
  <rect x="150" y="192" width="55" height="24" rx="3" fill="#93c5fd"/><text x="177" y="208" text-anchor="middle" class="mod">Users</text>
  <rect x="212" y="192" width="60" height="24" rx="3" fill="#93c5fd"/><text x="242" y="208" text-anchor="middle" class="mod">Payments</text>
  <rect x="278" y="192" width="45" height="24" rx="3" fill="#93c5fd"/><text x="300" y="208" text-anchor="middle" class="mod">Inv.</text>
  <rect x="76" y="250" width="256" height="26" rx="4" fill="#dbeafe"/><text x="204" y="268" text-anchor="middle" class="mod">Data access layer</text>

  <!-- one DB -->
  <rect x="140" y="330" width="128" height="44" rx="8" fill="#2563eb"/><text x="204" y="357" text-anchor="middle" class="db">One shared database</text>
  <line x1="204" y1="310" x2="204" y2="328" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <text x="60" y="398" class="note">Modules call each other <tspan font-weight="700">in-process</tspan>. Deploy &amp;</text>
  <text x="60" y="414" class="note">scale the whole thing as a single unit.</text>

  <!-- MICROSERVICES -->
  <rect x="416" y="48" width="360" height="380" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="416" y="48" width="360" height="34" rx="10" fill="#059669"/>
  <text x="436" y="71" class="h">Microservices — many independent services</text>

  <!-- gateway -->
  <rect x="536" y="96" width="120" height="30" rx="6" fill="#7c3aed"/><text x="596" y="116" text-anchor="middle" class="box">API Gateway</text>

  <!-- services with own DBs -->
  <rect x="436" y="152" width="150" height="34" rx="6" fill="#059669"/><text x="511" y="174" text-anchor="middle" class="box">Orders service</text>
  <rect x="606" y="152" width="150" height="34" rx="6" fill="#059669"/><text x="681" y="174" text-anchor="middle" class="box">Users service</text>
  <rect x="436" y="238" width="150" height="34" rx="6" fill="#059669"/><text x="511" y="260" text-anchor="middle" class="box">Payments service</text>
  <rect x="606" y="238" width="150" height="34" rx="6" fill="#059669"/><text x="681" y="260" text-anchor="middle" class="box">Inventory service</text>

  <rect x="452" y="196" width="118" height="24" rx="4" fill="#34d399"/><text x="511" y="213" text-anchor="middle" class="db">DB</text>
  <rect x="622" y="196" width="118" height="24" rx="4" fill="#34d399"/><text x="681" y="213" text-anchor="middle" class="db">DB</text>
  <rect x="452" y="282" width="118" height="24" rx="4" fill="#34d399"/><text x="511" y="299" text-anchor="middle" class="db">DB</text>
  <rect x="622" y="282" width="118" height="24" rx="4" fill="#34d399"/><text x="681" y="299" text-anchor="middle" class="db">DB</text>

  <line x1="570" y1="126" x2="511" y2="150" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="126" x2="681" y2="150" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="511" y1="186" x2="511" y2="194" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="681" y1="186" x2="681" y2="194" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="511" y1="272" x2="511" y2="280" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="681" y1="272" x2="681" y2="280" stroke="#94a3b8" stroke-width="1.4"/>

  <text x="436" y="340" class="note">Each service is <tspan font-weight="700">independently deployed</tspan>, owns its</text>
  <text x="436" y="356" class="note">own database, and talks to others <tspan font-weight="700">over the network</tspan></text>
  <text x="436" y="372" class="note">(HTTP/gRPC/messaging). No shared database.</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
