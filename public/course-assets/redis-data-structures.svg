<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .core { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .csub { font-size: 10.5px; fill: #fee2e2; }
    .ds { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .ex { font-size: 10px; fill: #334155; }
    .cap { font-size: 11px; font-weight: 700; fill: #1e293b; }
    .note { font-size: 11px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="title">Redis: not just a cache — a data-structure server</text>

  <!-- center -->
  <rect x="310" y="200" width="160" height="70" rx="12" fill="#dc2626"/>
  <text x="360" y="232" class="core">Redis</text>
  <text x="330" y="252" class="csub">in-memory · microsecond ops</text>

  <!-- data structure nodes around -->
  <!-- String -->
  <rect x="40" y="70" width="200" height="52" rx="8" fill="#2563eb"/>
  <text x="54" y="92" class="ds">String / Counter</text>
  <text x="54" y="110" class="ex" fill="#dbeafe">cached value, page views, INCR</text>
  <!-- Hash -->
  <rect x="290" y="70" width="200" height="52" rx="8" fill="#2563eb"/>
  <text x="304" y="92" class="ds">Hash</text>
  <text x="304" y="110" class="ex" fill="#dbeafe">a user/session as fields</text>
  <!-- List -->
  <rect x="540" y="70" width="200" height="52" rx="8" fill="#2563eb"/>
  <text x="554" y="92" class="ds">List</text>
  <text x="554" y="110" class="ex" fill="#dbeafe">queues, recent-activity feed</text>
  <!-- Set -->
  <rect x="540" y="200" width="200" height="52" rx="8" fill="#059669"/>
  <text x="554" y="222" class="ds">Set</text>
  <text x="554" y="240" class="ex" fill="#dcfce7">tags, unique visitors</text>
  <!-- Sorted Set -->
  <rect x="540" y="330" width="200" height="52" rx="8" fill="#059669"/>
  <text x="554" y="352" class="ds">Sorted Set</text>
  <text x="554" y="370" class="ex" fill="#dcfce7">leaderboards, ranking, rate limit</text>
  <!-- Stream -->
  <rect x="290" y="330" width="200" height="52" rx="8" fill="#059669"/>
  <text x="304" y="352" class="ds">Stream</text>
  <text x="304" y="370" class="ex" fill="#dcfce7">event logs, message pipelines</text>
  <!-- Bitmap/HLL -->
  <rect x="40" y="330" width="200" height="52" rx="8" fill="#059669"/>
  <text x="54" y="352" class="ds">Bitmap / HyperLogLog</text>
  <text x="54" y="370" class="ex" fill="#dcfce7">flags, approx unique counts</text>

  <!-- connectors -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="240" y1="96" x2="330" y2="200"/>
    <line x1="390" y1="122" x2="390" y2="200"/>
    <line x1="540" y1="96" x2="450" y2="205"/>
    <line x1="540" y1="226" x2="470" y2="232"/>
    <line x1="540" y1="352" x2="455" y2="262"/>
    <line x1="390" y1="330" x2="390" y2="270"/>
    <line x1="240" y1="352" x2="325" y2="262"/>
  </g>

  <!-- capabilities bar -->
  <rect x="24" y="404" width="732" height="58" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="40" y="426" class="cap">Plus, beyond a plain cache:</text>
  <text x="215" y="426" class="note">per-key <tspan font-weight="700">TTL</tspan> · <tspan font-weight="700">atomic</tspan> operations · <tspan font-weight="700">Pub/Sub</tspan> · <tspan font-weight="700">transactions</tspan> &amp; <tspan font-weight="700">Lua</tspan> scripting.</text>
  <text x="40" y="448" class="note">Optional <tspan font-weight="700">persistence</tspan>, <tspan font-weight="700">replication</tspan> &amp; <tspan font-weight="700">clustering</tspan> exist too (see the In-Memory Databases and Data Distribution topics); <tspan font-weight="700">eviction policies</tspan> → the Eviction topic.</text>
</svg>
