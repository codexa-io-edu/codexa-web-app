<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Match the Cure to the Race</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">There is no single fix — the right tool depends on what kind of race you have</text>

  <defs>
    <marker id="fx_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- column headers -->
  <rect x="40" y="78" width="300" height="30" rx="5" fill="#fee2e2" stroke="#dc2626"/><text x="190" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">The symptom</text>
  <rect x="480" y="78" width="300" height="30" rx="5" fill="#dcfce7" stroke="#059669"/><text x="630" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">The cure</text>

  <!-- row 1 -->
  <rect x="40" y="120" width="300" height="56" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="56" y="142" font-size="11.5" font-weight="700" fill="#b91c1c">Single-variable read-modify-write</text>
  <text x="56" y="162" font-size="10" fill="#991b1b">counter++, single flag / reference swap</text>
  <rect x="480" y="120" width="300" height="56" rx="8" fill="#f0fdf4" stroke="#34d399"/>
  <text x="496" y="142" font-size="11.5" font-weight="700" fill="#047857">Atomic type (CAS)</text>
  <text x="496" y="162" font-size="10" fill="#065f46">AtomicInteger / AtomicReference</text>
  <line x1="340" y1="148" x2="478" y2="148" stroke="#475569" stroke-width="1.6" marker-end="url(#fx_arr)"/>

  <!-- row 2 -->
  <rect x="40" y="184" width="300" height="56" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="56" y="206" font-size="11.5" font-weight="700" fill="#b91c1c">Multi-step / multi-field invariant</text>
  <text x="56" y="226" font-size="10" fill="#991b1b">transfer(), check-then-act, related fields</text>
  <rect x="480" y="184" width="300" height="56" rx="8" fill="#f0fdf4" stroke="#34d399"/>
  <text x="496" y="206" font-size="11.5" font-weight="700" fill="#047857">Lock the whole compound action</text>
  <text x="496" y="226" font-size="10" fill="#065f46">synchronized / ReentrantLock, one lock</text>
  <line x1="340" y1="212" x2="478" y2="212" stroke="#475569" stroke-width="1.6" marker-end="url(#fx_arr)"/>

  <!-- row 3 -->
  <rect x="40" y="248" width="300" height="56" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="56" y="270" font-size="11.5" font-weight="700" fill="#b91c1c">Stale value never seen (visibility)</text>
  <text x="56" y="290" font-size="10" fill="#991b1b">stop-flag loop never ends</text>
  <rect x="480" y="248" width="300" height="56" rx="8" fill="#f0fdf4" stroke="#34d399"/>
  <text x="496" y="270" font-size="11.5" font-weight="700" fill="#047857">volatile (or a lock)</text>
  <text x="496" y="290" font-size="10" fill="#065f46">establishes happens-before visibility</text>
  <line x1="340" y1="276" x2="478" y2="276" stroke="#475569" stroke-width="1.6" marker-end="url(#fx_arr)"/>

  <!-- row 4 -->
  <rect x="40" y="312" width="300" height="56" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="56" y="334" font-size="11.5" font-weight="700" fill="#b91c1c">Shared map / list / queue</text>
  <text x="56" y="354" font-size="10" fill="#991b1b">concurrent reads &amp; writes to a collection</text>
  <rect x="480" y="312" width="300" height="56" rx="8" fill="#f0fdf4" stroke="#34d399"/>
  <text x="496" y="334" font-size="11.5" font-weight="700" fill="#047857">Concurrent collection</text>
  <text x="496" y="354" font-size="10" fill="#065f46">ConcurrentHashMap, BlockingQueue</text>
  <line x1="340" y1="340" x2="478" y2="340" stroke="#475569" stroke-width="1.6" marker-end="url(#fx_arr)"/>

  <!-- row 5 - best -->
  <rect x="40" y="376" width="740" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">BEST OF ALL — remove the shared mutable state entirely</text>
  <text x="410" y="422" text-anchor="middle" font-size="11" fill="#334155">Immutability &amp; confinement mean there's no race to fix. Always try this first.</text>
</svg>
