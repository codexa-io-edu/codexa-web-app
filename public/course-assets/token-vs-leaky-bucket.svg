<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
    .lbl { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">Token bucket vs leaky bucket: allow bursts, or force a steady rate</text>

  <!-- TOKEN BUCKET -->
  <rect x="24" y="48" width="370" height="376" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="24" y="48" width="370" height="36" rx="10" fill="#2563eb"/>
  <text x="44" y="72" class="h">Token Bucket — bursts up to capacity</text>

  <!-- refill -->
  <text x="44" y="112" class="lbl">tokens added at rate r (e.g. 5/sec)</text>
  <line x1="120" y1="118" x2="120" y2="150" stroke="#059669" stroke-width="2.5" marker-end="url(#d)"/>

  <!-- bucket -->
  <rect x="90" y="150" width="140" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="145" text-anchor="middle" class="note">capacity b (e.g. 10)</text>
  <circle cx="115" cy="245" r="8" fill="#2563eb"/><circle cx="140" cy="245" r="8" fill="#2563eb"/><circle cx="165" cy="245" r="8" fill="#2563eb"/><circle cx="190" cy="245" r="8" fill="#2563eb"/>
  <circle cx="128" cy="220" r="8" fill="#2563eb"/><circle cx="153" cy="220" r="8" fill="#2563eb"/><circle cx="178" cy="220" r="8" fill="#2563eb"/>
  <text x="160" y="262" text-anchor="middle" class="note">tokens</text>

  <!-- request consumes -->
  <text x="260" y="200" class="lbl">each request</text>
  <text x="260" y="216" class="lbl">takes 1 token</text>
  <line x1="230" y1="230" x2="320" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <text x="44" y="308" class="note"><tspan font-weight="700">Empty bucket → reject</tspan> (or wait). A saved-up</text>
  <text x="44" y="324" class="note">full bucket lets a client fire a <tspan font-weight="700">burst</tspan> of b at once,</text>
  <text x="44" y="340" class="note">then settle to the steady rate r.</text>
  <text x="44" y="366" class="note"><tspan font-weight="700">Great for:</tspan> APIs that want to allow short bursts</text>
  <text x="44" y="382" class="note">but bound the sustained rate.</text>
  <text x="44" y="406" class="note">Used by Stripe, AWS API Gateway, many SDKs.</text>

  <!-- LEAKY BUCKET -->
  <rect x="406" y="48" width="370" height="376" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="406" y="48" width="370" height="36" rx="10" fill="#7c3aed"/>
  <text x="426" y="72" class="h">Leaky Bucket — smooths to a constant rate</text>

  <!-- bursty input -->
  <text x="426" y="112" class="lbl">bursty requests pour in</text>
  <circle cx="520" cy="106" r="6" fill="#7c3aed"/><circle cx="540" cy="100" r="6" fill="#7c3aed"/><circle cx="560" cy="108" r="6" fill="#7c3aed"/><circle cx="580" cy="102" r="6" fill="#7c3aed"/>
  <line x1="550" y1="118" x2="550" y2="148" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#d)"/>

  <!-- bucket (funnel) -->
  <path d="M 480 150 L 620 150 L 585 260 L 515 260 Z" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="550" y="200" text-anchor="middle" class="note">queue</text>
  <text x="550" y="216" text-anchor="middle" class="note">(fixed capacity)</text>

  <!-- overflow -->
  <text x="628" y="150" class="note" fill="#dc2626">overflow →</text>
  <text x="628" y="164" class="note" fill="#dc2626">dropped</text>

  <!-- steady leak out -->
  <line x1="550" y1="260" x2="550" y2="300" stroke="#059669" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="560" y="286" class="lbl">leaks at fixed rate</text>
  <circle cx="550" cy="315" r="6" fill="#059669"/>

  <text x="426" y="346" class="note"><tspan font-weight="700">Output is a smooth, constant stream</tspan> regardless of</text>
  <text x="426" y="362" class="note">how bursty the input is; excess overflows and is dropped.</text>
  <text x="426" y="388" class="note"><tspan font-weight="700">Great for:</tspan> shaping traffic to a steady downstream rate.</text>
  <text x="426" y="410" class="note">NGINX limit_req implements a leaky bucket.</text>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>
</svg>
