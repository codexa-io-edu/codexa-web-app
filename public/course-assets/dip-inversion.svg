<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">DIP: Both Sides Depend on the Abstraction</text>

  <line x1="410" y1="56" x2="410" y2="410" stroke="#e2e8f0" stroke-width="2"/>

  <defs>
    <marker id="da" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="ga" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#047857"/>
    </marker>
  </defs>

  <!-- LEFT: without DIP -->
  <text x="205" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">&#10007; Without DIP</text>

  <rect x="105" y="104" width="200" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">NotificationService</text>
  <text x="205" y="146" text-anchor="middle" font-size="10" fill="#64748b">high-level policy</text>

  <rect x="105" y="280" width="200" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="205" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">EmailSender</text>
  <text x="205" y="322" text-anchor="middle" font-size="10" fill="#64748b">low-level detail</text>

  <line x1="205" y1="160" x2="205" y2="278" stroke="#dc2626" stroke-width="2.5" marker-end="url(#da)"/>
  <text x="220" y="224" font-size="11.5" fill="#b91c1c">depends directly on</text>
  <text x="220" y="240" font-size="11.5" fill="#b91c1c">a concrete class</text>

  <rect x="60" y="356" width="290" height="46" rx="8" fill="#fff1f2" stroke="#f87171" stroke-width="1.4"/>
  <text x="205" y="374" text-anchor="middle" font-size="11" fill="#991b1b">Swap to SMS? Rewrite the service.</text>
  <text x="205" y="391" text-anchor="middle" font-size="11" fill="#991b1b">Test it? You can't avoid real email.</text>

  <!-- RIGHT: with DIP -->
  <text x="615" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">&#10003; With DIP</text>

  <rect x="515" y="104" width="200" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="615" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">NotificationService</text>
  <text x="615" y="146" text-anchor="middle" font-size="10" fill="#64748b">high-level policy</text>

  <rect x="515" y="196" width="200" height="46" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.4"/>
  <text x="615" y="218" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">&#171;interface&#187; MessageSender</text>
  <text x="615" y="234" text-anchor="middle" font-size="10" fill="#4f46e5" font-family="monospace">send(msg)</text>

  <rect x="470" y="290" width="130" height="50" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="535" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">EmailSender</text>
  <text x="535" y="330" text-anchor="middle" font-size="9.5" fill="#065f46">detail</text>

  <rect x="628" y="290" width="130" height="50" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="693" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">SmsSender</text>
  <text x="693" y="330" text-anchor="middle" font-size="9.5" fill="#065f46">detail</text>

  <!-- high-level depends DOWN on abstraction -->
  <line x1="615" y1="160" x2="615" y2="194" stroke="#047857" stroke-width="2.5" marker-end="url(#ga)"/>
  <!-- details depend UP on abstraction (inverted!) -->
  <line x1="535" y1="290" x2="590" y2="244" stroke="#047857" stroke-width="2.5" marker-end="url(#ga)"/>
  <line x1="693" y1="290" x2="640" y2="244" stroke="#047857" stroke-width="2.5" marker-end="url(#ga)"/>

  <text x="615" y="372" text-anchor="middle" font-size="11" fill="#065f46">The low-level arrows now point UP to the abstraction.</text>
  <text x="615" y="390" text-anchor="middle" font-size="11" fill="#065f46">Swap or fake the sender freely &#8212; the service never changes.</text>
</svg>
