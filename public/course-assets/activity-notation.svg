<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Activity Diagram Notation</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">A flowchart with formal support for decisions, parallelism, and merges</text>

  <!-- initial -->
  <circle cx="90" cy="100" r="12" fill="#334155"/>
  <text x="90" y="132" text-anchor="middle" font-size="9.5" fill="#334155">Initial node</text>
  <text x="90" y="145" text-anchor="middle" font-size="8" fill="#64748b">(start)</text>

  <!-- action -->
  <rect x="200" y="82" width="120" height="40" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="260" y="106" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Action / activity</text>
  <text x="260" y="140" text-anchor="middle" font-size="9.5" fill="#334155">Rounded rectangle</text>
  <text x="260" y="153" text-anchor="middle" font-size="8" fill="#64748b">(a step of work)</text>

  <!-- decision -->
  <path d="M470,80 L500,100 L470,120 L440,100 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="470" y="103" text-anchor="middle" font-size="9" fill="#b45309">?</text>
  <text x="470" y="140" text-anchor="middle" font-size="9.5" fill="#334155">Decision / merge</text>
  <text x="470" y="153" text-anchor="middle" font-size="8" fill="#64748b">(diamond, guards on exits)</text>

  <!-- final -->
  <circle cx="650" cy="100" r="13" fill="none" stroke="#334155" stroke-width="1.6"/>
  <circle cx="650" cy="100" r="6" fill="#334155"/>
  <text x="650" y="132" text-anchor="middle" font-size="9.5" fill="#334155">Final node</text>
  <text x="650" y="145" text-anchor="middle" font-size="8" fill="#64748b">(end)</text>

  <!-- fork/join -->
  <rect x="180" y="210" width="90" height="10" rx="2" fill="#334155"/>
  <text x="225" y="244" text-anchor="middle" font-size="9.5" fill="#334155">Fork / Join bar</text>
  <text x="225" y="257" text-anchor="middle" font-size="8" fill="#64748b">(split into / merge parallel flows)</text>

  <!-- flow arrow -->
  <defs><marker id="ac_a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
  <line x1="380" y1="215" x2="480" y2="215" stroke="#334155" stroke-width="1.6" marker-end="url(#ac_a)"/>
  <text x="430" y="240" text-anchor="middle" font-size="9.5" fill="#334155">Control flow (edge)</text>
  <text x="430" y="253" text-anchor="middle" font-size="8" fill="#64748b">(arrow = order of steps)</text>

  <!-- swimlane note -->
  <rect x="560" y="200" width="180" height="60" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.4"/>
  <text x="650" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">Swimlanes (partitions)</text>
  <text x="650" y="240" text-anchor="middle" font-size="8.5" fill="#334155">columns showing WHO does</text>
  <text x="650" y="252" text-anchor="middle" font-size="8.5" fill="#334155">each action (actor/system)</text>

  <rect x="90" y="300" width="640" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Decision vs Fork &#8212; the crucial distinction</text>
  <text x="410" y="344" text-anchor="middle" font-size="10" fill="#334155">Decision (diamond): ONE path taken based on a condition &#8212; branching (if/else)</text>
  <text x="410" y="364" text-anchor="middle" font-size="10" fill="#334155">Fork (bar): ALL paths taken at once &#8212; concurrency (do these in parallel)</text>
</svg>
