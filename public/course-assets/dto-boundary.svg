<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Why Not Expose the Domain Entity Directly?</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">A DTO creates a stable contract that shields the domain from the API layer's concerns</text>
  <line x1="410" y1="70" x2="410" y2="420" stroke="#e2e8f0" stroke-width="2"/>

  <!-- LEFT: bad -->
  <text x="205" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">✗ Exposing the entity</text>
  <rect x="50" y="106" width="310" height="190" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="60" y="126" font-size="10" font-weight="700" fill="#b91c1c">User (JPA entity)</text>
  <text x="60" y="146" font-size="9.5" fill="#334155" font-family="monospace">- id: Long</text>
  <text x="60" y="162" font-size="9.5" fill="#334155" font-family="monospace">- username: String</text>
  <text x="60" y="178" font-size="9.5" fill="#dc2626" font-family="monospace">- passwordHash: String  ← exposed!</text>
  <text x="60" y="194" font-size="9.5" fill="#dc2626" font-family="monospace">- internalRole: String  ← exposed!</text>
  <text x="60" y="210" font-size="9.5" fill="#334155" font-family="monospace">@Version version: int</text>
  <text x="60" y="226" font-size="9.5" fill="#334155" font-family="monospace">@OneToMany orders: List</text>
  <text x="60" y="260" font-size="9.5" fill="#991b1b">Problems: leaks secrets, triggers lazy-load</text>
  <text x="60" y="278" font-size="9.5" fill="#991b1b">N+1s, breaks when entity changes,</text>
  <text x="60" y="296" font-size="9.5" fill="#991b1b">couples API contract to DB schema.</text>

  <rect x="90" y="318" width="230" height="32" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="205" y="338" text-anchor="middle" font-size="10" fill="#b91c1c">return userRepository.findById(id);</text>

  <!-- RIGHT: good -->
  <text x="615" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">✓ Separate DTO</text>
  <rect x="430" y="106" width="180" height="140" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.8"/>
  <text x="440" y="126" font-size="10" font-weight="700" fill="#047857">UserResponse (DTO)</text>
  <text x="440" y="146" font-size="9.5" fill="#334155" font-family="monospace">+ id: Long</text>
  <text x="440" y="162" font-size="9.5" fill="#334155" font-family="monospace">+ username: String</text>
  <text x="440" y="178" font-size="9.5" fill="#334155" font-family="monospace">+ displayName: String</text>
  <text x="440" y="194" font-size="9.5" fill="#334155" font-family="monospace">+ joinedAt: String</text>
  <text x="440" y="234" font-size="9.5" fill="#047857">Only what the consumer needs.</text>

  <rect x="630" y="106" width="155" height="140" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="640" y="126" font-size="10" font-weight="700" fill="#1d4ed8">UserRequest (DTO)</text>
  <text x="640" y="146" font-size="9.5" fill="#334155" font-family="monospace">+ username: String</text>
  <text x="640" y="162" font-size="9.5" fill="#334155" font-family="monospace">+ password: String</text>
  <text x="640" y="178" font-size="9.5" fill="#334155" font-family="monospace">+ email: String</text>
  <text x="640" y="234" font-size="9.5" fill="#1d4ed8">Only what the client sends.</text>

  <rect x="430" y="278" width="355" height="70" rx="6" fill="#dcfce7" stroke="#059669"/>
  <text x="607" y="298" text-anchor="middle" font-size="9.5" font-weight="700" fill="#047857">Benefits:</text>
  <text x="607" y="316" text-anchor="middle" font-size="9" fill="#334155">✓ No secrets leaked  ✓ API contract stable independently</text>
  <text x="607" y="334" text-anchor="middle" font-size="9" fill="#334155">✓ No N+1 surprises  ✓ Shape request &amp; response separately</text>

  <defs><marker id="dt_a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs>
  <line x1="430" y1="370" x2="250" y2="390" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#dt_a)"/>
  <text x="340" y="418" text-anchor="middle" font-size="9" fill="#64748b">mapper converts entity ↔ DTO</text>
</svg>
