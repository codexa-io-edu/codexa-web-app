<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .lane { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .val { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 11px; fill: #64748b; }
    .stale { font-size: 11px; font-weight: 700; fill: #d97706; }
    .ok { font-size: 11px; font-weight: 700; fill: #059669; }
  </style>

  <text x="24" y="30" class="title">Eventual consistency: stale for a moment, then converges</text>
  <text x="24" y="50" class="note">The write is confirmed immediately on one replica and copied to others in the background, so some reads briefly see the old value.</text>

  <line x1="150" y1="78" x2="740" y2="78" stroke="#cbd5e1"/>
  <text x="700" y="70" class="note">time →</text>

  <!-- write event -->
  <line x1="230" y1="68" x2="230" y2="290" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="180" y="84" width="100" height="26" rx="5" fill="#059669"/>
  <text x="192" y="102" class="val">write X = 2</text>

  <!-- inconsistency window -->
  <rect x="230" y="150" width="230" height="110" fill="#fef3c7" opacity="0.55"/>
  <line x1="460" y1="68" x2="460" y2="290" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="252" y="140" class="stale">inconsistency window (replication lag)</text>

  <!-- Replica A -->
  <text x="24" y="180" class="lane">Replica A</text>
  <text x="24" y="196" class="note">(got the write)</text>
  <line x1="150" y1="176" x2="740" y2="176" stroke="#e2e8f0"/>
  <rect x="150" y="164" width="80" height="22" rx="3" fill="#94a3b8"/><text x="176" y="180" class="val">1</text>
  <rect x="230" y="164" width="510" height="22" rx="3" fill="#059669"/><text x="470" y="180" class="val">2</text>

  <!-- Replica B -->
  <text x="24" y="236" class="lane">Replica B</text>
  <text x="24" y="252" class="note">(lags behind)</text>
  <line x1="150" y1="232" x2="740" y2="232" stroke="#e2e8f0"/>
  <rect x="150" y="220" width="310" height="22" rx="3" fill="#d97706"/><text x="290" y="236" class="val">1  (still old)</text>
  <rect x="460" y="220" width="280" height="22" rx="3" fill="#059669"/><text x="580" y="236" class="val">2  (caught up)</text>

  <!-- reads -->
  <circle cx="360" cy="232" r="6" fill="#1e293b"/><text x="300" y="284" class="stale">read B → 1 (stale)</text>
  <circle cx="620" cy="232" r="6" fill="#1e293b"/><text x="590" y="284" class="ok">read B → 2 ✓</text>

  <text x="150" y="322" class="note">During the window, a read from the lagging replica returns the old value. Once replication catches up, <tspan font-weight="700" fill="#059669">all replicas converge.</tspan></text>
  <text x="150" y="342" class="note">Benefit: the write was fast and stayed available; the price is a brief staleness the application must tolerate.</text>
</svg>
