<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Capacity as Demand Grows</text>
  <line x1="90" y1="70" x2="90" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <line x1="90" y1="360" x2="660" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <text x="52" y="215" text-anchor="middle" fill="#475569" font-size="13" font-weight="600" transform="rotate(-90 52 215)">Capacity handled</text>
  <text x="375" y="398" text-anchor="middle" fill="#475569" font-size="13" font-weight="600">Demand / Traffic over time</text>
  <line x1="90" y1="140" x2="660" y2="140" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="98" y="126" text-anchor="start" fill="#dc2626" font-size="12" font-weight="600">Hardware ceiling — biggest single machine you can buy</text>
  <path d="M 90 360 C 200 250, 260 170, 340 145 C 400 130, 500 140, 660 140" fill="none" stroke="#4f46e5" stroke-width="4"/>
  <text x="655" y="178" text-anchor="end" fill="#4f46e5" font-size="14" font-weight="700">Vertical (Scale Up)</text>
  <text x="655" y="196" text-anchor="end" fill="#6366f1" font-size="11">hits a wall — can't grow further</text>
  <path d="M 90 360 L 660 80" fill="none" stroke="#0d9488" stroke-width="4"/>
  <text x="120" y="330" text-anchor="start" fill="#0d9488" font-size="14" font-weight="700">Horizontal (Scale Out)</text>
  <text x="120" y="348" text-anchor="start" fill="#14b8a6" font-size="11">keeps scaling by adding machines</text>
  <circle cx="300" cy="248" r="5" fill="#0d9488"/>
  <circle cx="420" cy="189" r="5" fill="#0d9488"/>
  <circle cx="540" cy="130" r="5" fill="#0d9488"/>
  <circle cx="640" cy="90" r="5" fill="#0d9488"/>
</svg>
