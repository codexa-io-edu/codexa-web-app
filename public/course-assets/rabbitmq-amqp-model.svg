<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .sub { font-size: 9px; fill: #e2e8f0; }
    .note { font-size: 10px; fill: #64748b; }
    .lbl { font-size: 10px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">The AMQP 0-9-1 model: connections, channels, and a virtual host</text>

  <!-- producer side -->
  <rect x="24" y="60" width="150" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="99" y="80" text-anchor="middle" class="lbl">Producer app</text>
  <rect x="40" y="92" width="118" height="24" rx="4" fill="#2563eb"/><text x="99" y="109" text-anchor="middle" class="box">TCP connection</text>
  <rect x="40" y="122" width="55" height="22" rx="3" fill="#60a5fa"/><text x="67" y="138" text-anchor="middle" class="sub">channel</text>
  <rect x="100" y="122" width="55" height="22" rx="3" fill="#60a5fa"/><text x="127" y="138" text-anchor="middle" class="sub">channel</text>
  <text x="40" y="164" class="note">many channels multiplex</text>
  <text x="40" y="176" class="note">over one connection</text>

  <!-- broker / vhost -->
  <rect x="220" y="52" width="360" height="250" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="236" y="72" class="lbl">Broker — virtual host "/app"</text>

  <rect x="250" y="120" width="90" height="44" rx="8" fill="#d97706"/><text x="295" y="140" text-anchor="middle" class="box">Exchange</text><text x="295" y="156" text-anchor="middle" class="sub">routes</text>
  <rect x="430" y="90" width="120" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="490" y="110" text-anchor="middle" class="lbl">queue A</text>
  <rect x="430" y="140" width="120" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="490" y="160" text-anchor="middle" class="lbl">queue B</text>

  <line x1="340" y1="132" x2="428" y2="105" stroke="#d97706" stroke-width="1.6" marker-end="url(#o)"/><text x="356" y="118" class="note">binding</text>
  <line x1="340" y1="145" x2="428" y2="155" stroke="#d97706" stroke-width="1.6" marker-end="url(#o)"/><text x="356" y="172" class="note">binding</text>

  <text x="236" y="210" class="note">A vhost is an isolated namespace — its own exchanges,</text>
  <text x="236" y="226" class="note">queues, users, and permissions (multi-tenancy).</text>
  <text x="236" y="250" class="note">Exchanges &amp; queues can be durable (survive restart);</text>
  <text x="236" y="266" class="note">messages can be persistent (delivery_mode=2).</text>

  <!-- consumer side -->
  <rect x="626" y="60" width="150" height="120" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="701" y="80" text-anchor="middle" class="lbl">Consumer app</text>
  <rect x="642" y="92" width="118" height="24" rx="4" fill="#059669"/><text x="701" y="109" text-anchor="middle" class="box">TCP connection</text>
  <rect x="642" y="122" width="55" height="22" rx="3" fill="#34d399"/><text x="669" y="138" text-anchor="middle" class="sub">channel</text>
  <rect x="702" y="122" width="55" height="22" rx="3" fill="#34d399"/><text x="729" y="138" text-anchor="middle" class="sub">channel</text>
  <text x="642" y="164" class="note">consumes &amp; acks</text>
  <text x="642" y="176" class="note">per channel</text>

  <line x1="174" y1="104" x2="248" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="180" y="98" class="note">publish</text>
  <line x1="550" y1="105" x2="640" y2="104" stroke="#059669" stroke-width="1.8" marker-end="url(#g)"/><text x="560" y="98" class="note">deliver</text>

  <!-- footer -->
  <rect x="24" y="320" width="752" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="344" class="lbl">Key terms</text>
  <text x="40" y="366" class="note">• <tspan font-weight="700">Connection</tspan> — a single TCP connection to the broker (expensive; keep long-lived).</text>
  <text x="420" y="366" class="note">• <tspan font-weight="700">Channel</tspan> — a lightweight virtual connection inside it.</text>
  <text x="40" y="386" class="note">• <tspan font-weight="700">Virtual host</tspan> — an isolated logical broker for multi-tenancy.</text>
  <text x="420" y="386" class="note">• <tspan font-weight="700">Publisher confirms</tspan> &amp; <tspan font-weight="700">consumer acks</tspan> ride on channels.</text>
  <text x="40" y="404" class="note">Rule of thumb: one connection per process, one channel per thread/consumer.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  </defs>
</svg>
