<svg viewBox="0 0 920 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="220" fill="#ffffff"/>

  <text x="60"  y="34" text-anchor="start" fill="#1e3a8a" font-size="16" font-weight="700">SERVERFUL</text>
  <text x="860" y="34" text-anchor="end"   fill="#115e59" font-size="16" font-weight="700">SERVERLESS</text>

  <!-- gradient bar -->
  <rect x="40" y="52" width="840" height="58" rx="10" fill="url(#grad)"/>

  <!-- dividers -->
  <line x1="180" y1="52" x2="180" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="320" y1="52" x2="320" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="460" y1="52" x2="460" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="52" x2="600" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="740" y1="52" x2="740" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- segment labels -->
  <text x="110" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Bare</text>
  <text x="110" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Metal</text>

  <text x="250" y="86" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">VMs</text>

  <text x="390" y="86" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Containers</text>

  <text x="530" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Managed</text>
  <text x="530" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Containers</text>

  <text x="670" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Serverless</text>
  <text x="670" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Containers</text>

  <text x="810" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">FaaS +</text>
  <text x="810" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">BaaS</text>

  <!-- bottom arrows -->
  <line x1="430" y1="150" x2="40"  y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="235" y="172" text-anchor="middle" fill="#475569" font-size="13">You manage more · more control</text>

  <line x1="490" y1="150" x2="880" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="685" y="172" text-anchor="middle" fill="#475569" font-size="13">Provider manages more · pay per use</text>
</svg>
