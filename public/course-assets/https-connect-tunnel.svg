<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .mono { font-size: 10px; font-family: 'Consolas','Courier New',monospace; fill: #1e293b; }
    .note { font-size: 10px; fill: #64748b; }
    .good { font-size: 10px; font-weight: 700; fill: #059669; }
    .warn { font-size: 10px; font-weight: 700; fill: #dc2626; }
  </style>

  <text x="24" y="30" class="title">Forward proxies and HTTPS: tunnel vs. inspect</text>
  <text x="24" y="50" class="note">A proxy can't read HTTPS by default — the traffic is encrypted end to end. It has two options:</text>

  <!-- A: CONNECT tunnel -->
  <rect x="24" y="66" width="370" height="310" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="24" y="66" width="370" height="36" rx="10" fill="#059669"/>
  <text x="44" y="90" class="h">A · CONNECT tunnel (blind relay)</text>

  <rect x="44" y="120" width="70" height="34" rx="6" fill="#64748b"/><text x="79" y="142" text-anchor="middle" class="box">client</text>
  <rect x="180" y="120" width="70" height="34" rx="6" fill="#2563eb"/><text x="215" y="142" text-anchor="middle" class="box">proxy</text>
  <rect x="316" y="120" width="60" height="34" rx="6" fill="#059669"/><text x="346" y="142" text-anchor="middle" class="box">origin</text>

  <text x="44" y="180" class="mono">1. CONNECT site.com:443</text>
  <text x="44" y="198" class="mono">2. proxy opens TCP to origin</text>
  <text x="44" y="216" class="mono">3. 200 Connection Established</text>
  <text x="44" y="234" class="mono">4. TLS is set up client↔origin</text>
  <line x1="114" y1="270" x2="316" y2="270" stroke="#059669" stroke-width="3"/>
  <text x="120" y="262" class="note">encrypted bytes flow straight through</text>

  <text x="44" y="312" class="good">✓ Proxy relays bytes it cannot read</text>
  <text x="44" y="330" class="good">✓ True end-to-end encryption preserved</text>
  <text x="44" y="352" class="note">Proxy sees only the hostname + that a</text>
  <text x="44" y="368" class="note">connection happened — not the content.</text>

  <!-- B: TLS interception -->
  <rect x="406" y="66" width="370" height="310" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="406" y="66" width="370" height="36" rx="10" fill="#dc2626"/>
  <text x="426" y="90" class="h">B · TLS interception (MITM)</text>

  <rect x="426" y="120" width="70" height="34" rx="6" fill="#64748b"/><text x="461" y="142" text-anchor="middle" class="box">client</text>
  <rect x="562" y="120" width="70" height="34" rx="6" fill="#dc2626"/><text x="597" y="142" text-anchor="middle" class="box">proxy</text>
  <rect x="698" y="120" width="60" height="34" rx="6" fill="#059669"/><text x="728" y="142" text-anchor="middle" class="box">origin</text>

  <line x1="496" y1="137" x2="560" y2="137" stroke="#dc2626" stroke-width="2.5"/><text x="500" y="172" class="note">TLS #1</text><text x="500" y="186" class="note">proxy's cert</text>
  <line x1="632" y1="137" x2="696" y2="137" stroke="#059669" stroke-width="2.5"/><text x="636" y="172" class="note">TLS #2</text><text x="636" y="186" class="note">real cert</text>

  <text x="426" y="228" class="note">Proxy presents its OWN certificate, signed by</text>
  <text x="426" y="244" class="note">a corporate root CA pre-installed on the client.</text>
  <text x="426" y="260" class="note">It decrypts, inspects, then re-encrypts to origin.</text>

  <text x="426" y="298" class="warn">⚠ Proxy can read &amp; modify everything</text>
  <text x="426" y="320" class="note">Used for corporate DLP / malware scanning.</text>
  <text x="426" y="342" class="note">Only works because the client is configured</text>
  <text x="426" y="358" class="note">to trust the proxy's root CA — otherwise the</text>
  <text x="426" y="374" class="note">browser shows a certificate error.</text>
</svg>
