<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Encapsulation: Private State Behind a Public API</text>

  <!-- outer capsule -->
  <rect x="230" y="80" width="300" height="270" rx="140" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="380" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">BankAccount</text>

  <!-- private core -->
  <rect x="285" y="130" width="190" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">private (hidden)</text>
  <text x="380" y="176" text-anchor="middle" font-size="12" fill="#991b1b" font-family="monospace">balance = 500</text>
  <text x="380" y="196" text-anchor="middle" font-size="12" fill="#991b1b" font-family="monospace">pin = 1234</text>

  <!-- public methods band -->
  <rect x="285" y="240" width="190" height="90" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="380" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">public (the gate)</text>
  <text x="380" y="286" text-anchor="middle" font-size="12" fill="#065f46" font-family="monospace">deposit(amt)</text>
  <text x="380" y="306" text-anchor="middle" font-size="12" fill="#065f46" font-family="monospace">withdraw(amt)</text>

  <defs>
    <marker id="ok" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="no" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- allowed access -->
  <line x1="120" y1="285" x2="283" y2="285" stroke="#059669" stroke-width="2.5" marker-end="url(#ok)"/>
  <text x="60" y="270" font-size="13" font-weight="700" fill="#047857">Outside code</text>
  <text x="60" y="290" font-size="11.5" fill="#065f46">calls methods &#10003;</text>

  <!-- blocked access -->
  <line x1="120" y1="175" x2="283" y2="175" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#no)"/>
  <text x="60" y="150" font-size="11.5" fill="#b91c1c">Direct field</text>
  <text x="60" y="168" font-size="11.5" fill="#b91c1c">access blocked &#10007;</text>

  <!-- right note -->
  <rect x="560" y="130" width="180" height="200" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="650" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Why it matters</text>
  <text x="574" y="182" font-size="11" fill="#7c2d12">withdraw() can enforce:</text>
  <text x="582" y="204" font-size="11" fill="#7c2d12">&#8226; amt &gt; 0</text>
  <text x="582" y="224" font-size="11" fill="#7c2d12">&#8226; balance &#8805; amt</text>
  <text x="582" y="244" font-size="11" fill="#7c2d12">&#8226; log the txn</text>
  <text x="574" y="272" font-size="11" fill="#7c2d12">The invariant</text>
  <text x="574" y="290" font-size="11" fill="#7c2d12">(balance never</text>
  <text x="574" y="308" font-size="11" fill="#7c2d12">negative) is safe.</text>
</svg>
