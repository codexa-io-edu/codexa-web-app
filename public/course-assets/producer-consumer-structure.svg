<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Producer-Consumer: A Buffer Decouples the Two Sides</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">Producers add work; consumers take it. Neither waits on the other directly — the queue is the hand-off point</text>

  <defs>
    <marker id="pc_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- producers -->
  <text x="110" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Producers</text>
  <rect x="50" y="104" width="120" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="110" y="129" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Producer 1</text>
  <rect x="50" y="152" width="120" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="110" y="177" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Producer 2</text>
  <rect x="50" y="200" width="120" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="110" y="225" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Producer 3</text>
  <text x="110" y="266" text-anchor="middle" font-size="10" fill="#64748b">put() — blocks if full</text>

  <!-- buffer -->
  <rect x="300" y="120" width="220" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.4"/>
  <text x="410" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a16207">Bounded Buffer (queue)</text>
  <rect x="316" y="164" width="34" height="46" rx="4" fill="#fde68a" stroke="#ca8a04"/>
  <rect x="354" y="164" width="34" height="46" rx="4" fill="#fde68a" stroke="#ca8a04"/>
  <rect x="392" y="164" width="34" height="46" rx="4" fill="#fde68a" stroke="#ca8a04"/>
  <rect x="430" y="164" width="34" height="46" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-dasharray="3 2"/>
  <rect x="468" y="164" width="34" height="46" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-dasharray="3 2"/>
  <text x="410" y="230" text-anchor="middle" font-size="9.5" fill="#a16207">capacity-limited: full items + free slots</text>

  <!-- consumers -->
  <text x="710" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Consumers</text>
  <rect x="650" y="104" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="710" y="129" text-anchor="middle" font-size="11.5" fill="#047857">Consumer 1</text>
  <rect x="650" y="152" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="710" y="177" text-anchor="middle" font-size="11.5" fill="#047857">Consumer 2</text>
  <rect x="650" y="200" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="710" y="225" text-anchor="middle" font-size="11.5" fill="#047857">Consumer 3</text>
  <text x="710" y="266" text-anchor="middle" font-size="10" fill="#64748b">take() — blocks if empty</text>

  <!-- arrows -->
  <line x1="170" y1="124" x2="298" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#pc_arr)"/>
  <line x1="170" y1="172" x2="298" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#pc_arr)"/>
  <line x1="170" y1="220" x2="298" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#pc_arr)"/>
  <line x1="522" y1="160" x2="648" y2="124" stroke="#059669" stroke-width="2" marker-end="url(#pc_arr)"/>
  <line x1="522" y1="180" x2="648" y2="172" stroke="#059669" stroke-width="2" marker-end="url(#pc_arr)"/>
  <line x1="522" y1="200" x2="648" y2="220" stroke="#059669" stroke-width="2" marker-end="url(#pc_arr)"/>

  <rect x="120" y="300" width="580" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">What the buffer buys you</text>
  <text x="410" y="348" text-anchor="middle" font-size="11" fill="#334155">&#8226; Decoupling: producers and consumers don't know or wait on each other directly</text>
  <text x="410" y="368" text-anchor="middle" font-size="11" fill="#334155">&#8226; Rate smoothing: absorbs bursts; sides can run at different, varying speeds</text>
  <text x="410" y="388" text-anchor="middle" font-size="11" fill="#334155">&#8226; Backpressure: a full buffer makes producers wait, so fast producers can't overwhelm slow consumers</text>
</svg>
