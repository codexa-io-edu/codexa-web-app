<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .sub { font-size: 9px; fill: #e2e8f0; }
    .note { font-size: 10px; fill: #64748b; }
    .lbl { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
    .part { font-size: 9.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <text x="24" y="30" class="title">Kafka: a topic split into partitions across brokers</text>

  <!-- producer -->
  <rect x="30" y="90" width="100" height="40" rx="6" fill="#2563eb"/><text x="80" y="115" text-anchor="middle" class="box">Producer</text>
  <text x="30" y="150" class="note">partition =</text>
  <text x="30" y="164" class="note">hash(key) % N</text>

  <!-- brokers with partitions -->
  <text x="200" y="72" class="lbl">Topic "orders" — 3 partitions, replicated across 3 brokers</text>

  <!-- Broker 1 -->
  <rect x="200" y="86" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="210" y="104" class="note">Broker 1</text>
  <rect x="210" y="112" width="160" height="24" rx="4" fill="#059669"/><text x="290" y="129" text-anchor="middle" class="part">P0 leader  [o0 o1 o2 o3→]</text>
  <rect x="210" y="142" width="160" height="24" rx="4" fill="#94a3b8"/><text x="290" y="159" text-anchor="middle" class="part">P1 follower (replica)</text>

  <!-- Broker 2 -->
  <rect x="200" y="186" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="210" y="204" class="note">Broker 2</text>
  <rect x="210" y="212" width="160" height="24" rx="4" fill="#059669"/><text x="290" y="229" text-anchor="middle" class="part">P1 leader  [o0 o1 o2→]</text>
  <rect x="210" y="242" width="160" height="24" rx="4" fill="#94a3b8"/><text x="290" y="259" text-anchor="middle" class="part">P2 follower (replica)</text>

  <!-- Broker 3 -->
  <rect x="200" y="286" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="210" y="304" class="note">Broker 3</text>
  <rect x="210" y="312" width="160" height="24" rx="4" fill="#059669"/><text x="290" y="329" text-anchor="middle" class="part">P2 leader  [o0 o1 o2 o3→]</text>
  <rect x="210" y="342" width="160" height="24" rx="4" fill="#94a3b8"/><text x="290" y="359" text-anchor="middle" class="part">P0 follower (replica)</text>

  <line x1="130" y1="110" x2="198" y2="124" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="130" y1="115" x2="198" y2="224" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="130" y1="120" x2="198" y2="324" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- consumers -->
  <rect x="640" y="112" width="130" height="24" rx="4" fill="#d97706"/><text x="705" y="129" text-anchor="middle" class="part">consumer → P0</text>
  <rect x="640" y="212" width="130" height="24" rx="4" fill="#d97706"/><text x="705" y="229" text-anchor="middle" class="part">consumer → P1</text>
  <rect x="640" y="312" width="130" height="24" rx="4" fill="#d97706"/><text x="705" y="329" text-anchor="middle" class="part">consumer → P2</text>
  <line x1="380" y1="124" x2="638" y2="124" stroke="#d97706" stroke-width="1.6" marker-end="url(#o)"/>
  <line x1="380" y1="224" x2="638" y2="224" stroke="#d97706" stroke-width="1.6" marker-end="url(#o)"/>
  <line x1="380" y1="324" x2="638" y2="324" stroke="#d97706" stroke-width="1.6" marker-end="url(#o)"/>

  <!-- footer -->
  <rect x="24" y="388" width="752" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="404" class="note">Each partition is an ordered log with one <tspan font-weight="700">leader</tspan> (handles reads/writes) and <tspan font-weight="700">follower</tspan> replicas kept in sync (the ISR).</text>
  <text x="40" y="419" class="note">Messages with the same key land on the same partition, preserving their order. Partitions are the unit of parallelism &amp; replication.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
  </defs>
</svg>
