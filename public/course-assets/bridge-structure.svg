<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Bridge: Split Two Dimensions Instead of Multiplying Them</text>

  <line x1="410" y1="56" x2="410" y2="410" stroke="#e2e8f0" stroke-width="2"/>

  <!-- LEFT: explosion -->
  <text x="205" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">&#10007; One inheritance tree = N × M classes</text>
  <rect x="140" y="96" width="140" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="210" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Shape</text>

  <g font-size="10.5" fill="#991b1b">
    <rect x="40" y="176" width="150" height="34" rx="6" fill="#fff1f2" stroke="#f87171"/><text x="115" y="198" text-anchor="middle">RedCircle</text>
    <rect x="210" y="176" width="150" height="34" rx="6" fill="#fff1f2" stroke="#f87171"/><text x="285" y="198" text-anchor="middle">BlueCircle</text>
    <rect x="40" y="220" width="150" height="34" rx="6" fill="#fff1f2" stroke="#f87171"/><text x="115" y="242" text-anchor="middle">RedSquare</text>
    <rect x="210" y="220" width="150" height="34" rx="6" fill="#fff1f2" stroke="#f87171"/><text x="285" y="242" text-anchor="middle">BlueSquare</text>
    <rect x="40" y="264" width="150" height="34" rx="6" fill="#fff1f2" stroke="#f87171"/><text x="115" y="286" text-anchor="middle">RedTriangle</text>
    <rect x="210" y="264" width="150" height="34" rx="6" fill="#fff1f2" stroke="#f87171"/><text x="285" y="286" text-anchor="middle">BlueTriangle</text>
  </g>
  <text x="205" y="330" text-anchor="middle" font-size="11.5" fill="#dc2626" font-weight="700">Add a color OR a shape → many new classes</text>
  <text x="205" y="350" text-anchor="middle" font-size="11" fill="#991b1b">3 shapes × 2 colors = 6 (and it keeps multiplying)</text>

  <!-- RIGHT: bridge -->
  <text x="612" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">&#10003; Two trees joined by a bridge = N + M</text>

  <defs>
    <marker id="br_tri" markerWidth="13" markerHeight="13" refX="6.5" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
    </marker>
    <marker id="br_diamond" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,6 L8,1 L16,6 L8,11 Z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- abstraction side -->
  <rect x="450" y="110" width="150" height="44" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="525" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Shape</text>
  <text x="525" y="147" text-anchor="middle" font-size="9" fill="#065f46">has-a Color</text>

  <rect x="440" y="200" width="80" height="34" rx="6" fill="#f0fdf4" stroke="#059669"/><text x="480" y="222" text-anchor="middle" font-size="10.5" fill="#047857">Circle</text>
  <rect x="530" y="200" width="80" height="34" rx="6" fill="#f0fdf4" stroke="#059669"/><text x="570" y="222" text-anchor="middle" font-size="10.5" fill="#047857">Square</text>
  <line x1="480" y1="200" x2="515" y2="156" stroke="#475569" stroke-width="1.3" marker-end="url(#br_tri)"/>
  <line x1="570" y1="200" x2="535" y2="156" stroke="#475569" stroke-width="1.3" marker-end="url(#br_tri)"/>

  <!-- implementation side -->
  <rect x="650" y="110" width="130" height="44" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
  <text x="715" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">«interface»</text>
  <text x="715" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Color</text>

  <rect x="640" y="200" width="70" height="34" rx="6" fill="#fff7ed" stroke="#d97706"/><text x="675" y="222" text-anchor="middle" font-size="10" fill="#b45309">Red</text>
  <rect x="720" y="200" width="70" height="34" rx="6" fill="#fff7ed" stroke="#d97706"/><text x="755" y="222" text-anchor="middle" font-size="10" fill="#b45309">Blue</text>
  <line x1="675" y1="200" x2="705" y2="156" stroke="#475569" stroke-width="1.3" marker-end="url(#br_tri)"/>
  <line x1="755" y1="200" x2="725" y2="156" stroke="#475569" stroke-width="1.3" marker-end="url(#br_tri)"/>

  <!-- the bridge -->
  <line x1="602" y1="132" x2="648" y2="132" stroke="#475569" stroke-width="2" marker-start="url(#br_diamond)"/>
  <text x="625" y="122" text-anchor="middle" font-size="10" fill="#334155">bridge</text>

  <text x="612" y="330" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">Add a color OR a shape → ONE new class</text>
  <text x="612" y="350" text-anchor="middle" font-size="11" fill="#065f46">3 shapes + 2 colors = 5, combined at runtime</text>
</svg>
