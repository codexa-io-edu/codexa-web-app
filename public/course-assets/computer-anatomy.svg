<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .big { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .unit { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .usub { font-size: 10px; fill: #475569; }
    .note { font-size: 11px; fill: #64748b; }
    .bus { font-size: 11px; font-weight: 700; fill: #7c3aed; }
    .flow { font-size: 10.5px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="title">The anatomy of a computer (the von Neumann model)</text>
  <text x="24" y="50" class="note">Three parts — the CPU, memory, and I/O — connected by buses. Both programs and data live in the same memory.</text>

  <!-- CPU -->
  <rect x="40" y="78" width="300" height="230" rx="12" fill="#2563eb"/>
  <text x="60" y="104" class="big">CPU (Central Processing Unit)</text>
  <text x="60" y="122" class="usub" fill="#dbeafe">"the brain" — executes instructions</text>

  <!-- control unit -->
  <rect x="60" y="136" width="120" height="70" rx="8" fill="#ffffff"/>
  <text x="72" y="158" class="unit">Control Unit</text>
  <text x="72" y="176" class="usub">directs the flow:</text>
  <text x="72" y="190" class="usub">fetch → decode →</text>
  <text x="72" y="202" class="usub">execute</text>

  <!-- ALU -->
  <rect x="200" y="136" width="120" height="70" rx="8" fill="#ffffff"/>
  <text x="212" y="158" class="unit">ALU</text>
  <text x="212" y="176" class="usub">does the math &amp;</text>
  <text x="212" y="190" class="usub">logic (add, compare,</text>
  <text x="212" y="202" class="usub">AND/OR …)</text>

  <!-- registers -->
  <rect x="60" y="220" width="260" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="72" y="242" class="unit">Registers + on-chip cache (L1/L2/L3)</text>
  <text x="72" y="262" class="usub">tiny, ultra-fast scratch space the CPU works in —</text>
  <text x="72" y="278" class="usub">holds the data &amp; instructions being used right now</text>

  <!-- MEMORY -->
  <rect x="470" y="78" width="290" height="110" rx="12" fill="#059669"/>
  <text x="490" y="104" class="big">Main Memory (RAM)</text>
  <text x="490" y="124" class="usub" fill="#d1fae5">holds the running program + its data</text>
  <g fill="#34d399" stroke="#a7f3d0">
    <rect x="490" y="136" width="250" height="14" rx="2"/>
    <rect x="490" y="156" width="250" height="14" rx="2"/>
  </g>
  <text x="490" y="184" class="usub" fill="#d1fae5">volatile — lost on power off</text>

  <!-- I/O -->
  <rect x="470" y="210" width="290" height="98" rx="12" fill="#64748b"/>
  <text x="490" y="236" class="big">Input / Output (I/O)</text>
  <text x="490" y="256" class="usub" fill="#f1f5f9">storage (SSD/HDD), network, keyboard,</text>
  <text x="490" y="272" class="usub" fill="#f1f5f9">screen — the outside world</text>
  <text x="490" y="294" class="usub" fill="#f1f5f9">storage is non-volatile (survives power off)</text>

  <!-- BUS -->
  <rect x="40" y="340" width="720" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="330" y="365" class="bus">SYSTEM BUS  (address · data · control)</text>

  <!-- connectors to bus -->
  <line x1="190" y1="308" x2="190" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="560" y1="188" x2="560" y2="210" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="615" y1="308" x2="615" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="560" y1="308" x2="560" y2="340" stroke="#7c3aed" stroke-width="2"/>

  <text x="40" y="405" class="flow">The bus is the shared highway the parts talk over. Its width and speed cap how fast data moves between CPU, memory, and I/O.</text>
  <text x="40" y="426" class="flow">Program execution loop: CPU <tspan font-weight="700">fetches</tspan> an instruction from RAM → <tspan font-weight="700">decodes</tspan> it → <tspan font-weight="700">executes</tspan> it in the ALU → repeats, billions of times a second.</text>
  <text x="40" y="447" class="note">(The OS abstraction layer on top of this hardware — processes, threads, virtual memory — is covered in OS Fundamentals.)</text>
</svg>
