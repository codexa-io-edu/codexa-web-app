<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .lab { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10.5px; fill: #64748b; }
    .small { font-size: 9px; font-weight: 700; fill: #ffffff; }
  </style>

  <text x="24" y="30" class="title">Virtual nodes: each server takes many small slots, not one big arc</text>

  <!-- WITHOUT vnodes -->
  <text x="40" y="78" class="h">Without virtual nodes — 3 servers, 3 arcs (uneven)</text>
  <rect x="40" y="88" width="120" height="40" fill="#2563eb"/><text x="100" y="113" text-anchor="middle" class="lab">A</text>
  <rect x="160" y="88" width="440" height="40" fill="#059669"/><text x="380" y="113" text-anchor="middle" class="lab">B  (huge share)</text>
  <rect x="600" y="88" width="160" height="40" fill="#7c3aed"/><text x="680" y="113" text-anchor="middle" class="lab">C</text>
  <text x="40" y="150" class="note">Random placement makes arcs unequal — B is overloaded. And if B dies, <tspan font-weight="700" fill="#dc2626">all</tspan> of B's keys dump onto C alone.</text>

  <!-- WITH vnodes -->
  <text x="40" y="200" class="h">With virtual nodes — each server hashed to many points, interleaved</text>
  <!-- interleaved small segments A B C A C B ... width 40 each, 18 segments = 720 -->
  <g>
    <rect x="40"  y="210" width="40" height="40" fill="#2563eb"/><text x="60"  y="235" text-anchor="middle" class="small">A</text>
    <rect x="80"  y="210" width="40" height="40" fill="#059669"/><text x="100" y="235" text-anchor="middle" class="small">B</text>
    <rect x="120" y="210" width="40" height="40" fill="#7c3aed"/><text x="140" y="235" text-anchor="middle" class="small">C</text>
    <rect x="160" y="210" width="40" height="40" fill="#059669"/><text x="180" y="235" text-anchor="middle" class="small">B</text>
    <rect x="200" y="210" width="40" height="40" fill="#2563eb"/><text x="220" y="235" text-anchor="middle" class="small">A</text>
    <rect x="240" y="210" width="40" height="40" fill="#7c3aed"/><text x="260" y="235" text-anchor="middle" class="small">C</text>
    <rect x="280" y="210" width="40" height="40" fill="#2563eb"/><text x="300" y="235" text-anchor="middle" class="small">A</text>
    <rect x="320" y="210" width="40" height="40" fill="#059669"/><text x="340" y="235" text-anchor="middle" class="small">B</text>
    <rect x="360" y="210" width="40" height="40" fill="#7c3aed"/><text x="380" y="235" text-anchor="middle" class="small">C</text>
    <rect x="400" y="210" width="40" height="40" fill="#2563eb"/><text x="420" y="235" text-anchor="middle" class="small">A</text>
    <rect x="440" y="210" width="40" height="40" fill="#7c3aed"/><text x="460" y="235" text-anchor="middle" class="small">C</text>
    <rect x="480" y="210" width="40" height="40" fill="#059669"/><text x="500" y="235" text-anchor="middle" class="small">B</text>
    <rect x="520" y="210" width="40" height="40" fill="#7c3aed"/><text x="540" y="235" text-anchor="middle" class="small">C</text>
    <rect x="560" y="210" width="40" height="40" fill="#2563eb"/><text x="580" y="235" text-anchor="middle" class="small">A</text>
    <rect x="600" y="210" width="40" height="40" fill="#059669"/><text x="620" y="235" text-anchor="middle" class="small">B</text>
    <rect x="640" y="210" width="40" height="40" fill="#2563eb"/><text x="660" y="235" text-anchor="middle" class="small">A</text>
    <rect x="680" y="210" width="40" height="40" fill="#7c3aed"/><text x="700" y="235" text-anchor="middle" class="small">C</text>
    <rect x="720" y="210" width="40" height="40" fill="#059669"/><text x="740" y="235" text-anchor="middle" class="small">B</text>
  </g>
  <text x="40" y="272" class="note">Each server owns many scattered slots that sum to a roughly <tspan font-weight="700">equal</tspan> share.</text>

  <!-- footer -->
  <rect x="24" y="300" width="752" height="106" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="324" class="h">Why virtual nodes matter</text>
  <text x="40" y="346" class="note">• <tspan font-weight="700">Even load</tspan> — many random slots per server average out; no one gets a giant arc.</text>
  <text x="40" y="366" class="note">• <tspan font-weight="700">Graceful failure</tspan> — when a server dies, its many slots are absorbed by <tspan font-weight="700">many</tspan> neighbors, not one.</text>
  <text x="40" y="386" class="note">• <tspan font-weight="700">Weighting</tspan> — give a bigger server more virtual nodes and it takes proportionally more traffic. (Cassandra defaults to 256 per node.)</text>
</svg>
