<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">A Monitor = Mutex + Condition (Wait / Signal)</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">A thread can not only lock, but also WAIT for a condition and be woken when another thread SIGNALS it</text>

  <defs>
    <marker id="mo_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- monitor box -->
  <rect x="230" y="80" width="360" height="300" rx="14" fill="#f0fdf4" stroke="#059669" stroke-width="2.4"/>
  <text x="410" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Monitor (the object's intrinsic lock)</text>

  <!-- entry set -->
  <rect x="250" y="122" width="150" height="90" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="325" y="142" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">Entry Set</text>
  <text x="325" y="160" text-anchor="middle" font-size="9" fill="#065f46">threads blocked trying</text>
  <text x="325" y="173" text-anchor="middle" font-size="9" fill="#065f46">to ACQUIRE the lock</text>
  <rect x="266" y="182" width="30" height="20" rx="3" fill="#86efac"/>
  <rect x="302" y="182" width="30" height="20" rx="3" fill="#86efac"/>
  <rect x="338" y="182" width="30" height="20" rx="3" fill="#86efac"/>

  <!-- owner -->
  <rect x="420" y="122" width="150" height="90" rx="8" fill="#bbf7d0" stroke="#047857" stroke-width="2"/>
  <text x="495" y="146" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">Lock Owner</text>
  <text x="495" y="166" text-anchor="middle" font-size="9.5" fill="#065f46">exactly ONE thread</text>
  <text x="495" y="184" text-anchor="middle" font-size="9.5" fill="#065f46">runs the critical section</text>

  <!-- wait set -->
  <rect x="250" y="230" width="320" height="130" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="410" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Wait Set</text>
  <text x="410" y="270" text-anchor="middle" font-size="9.5" fill="#7c2d12">threads that called wait() — they RELEASED the lock</text>
  <text x="410" y="284" text-anchor="middle" font-size="9.5" fill="#7c2d12">and sleep here until signalled</text>
  <rect x="290" y="296" width="34" height="22" rx="3" fill="#fdba74"/>
  <rect x="334" y="296" width="34" height="22" rx="3" fill="#fdba74"/>
  <rect x="378" y="296" width="34" height="22" rx="3" fill="#fdba74"/>
  <text x="410" y="342" text-anchor="middle" font-size="9.5" fill="#b45309">notify() / notifyAll() moves them back to the Entry Set to re-acquire</text>

  <!-- transitions -->
  <line x1="400" y1="167" x2="418" y2="167" stroke="#475569" stroke-width="1.8" marker-end="url(#mo_arr)"/>
  <line x1="495" y1="212" x2="460" y2="228" stroke="#d97706" stroke-width="1.8" marker-end="url(#mo_arr)"/>
  <text x="530" y="224" text-anchor="middle" font-size="8.5" fill="#b45309">wait()</text>
  <line x1="360" y1="230" x2="340" y2="212" stroke="#059669" stroke-width="1.8" marker-end="url(#mo_arr)"/>
  <text x="300" y="224" text-anchor="middle" font-size="8.5" fill="#047857">notify()</text>

  <!-- captions -->
  <text x="70" y="150" font-size="11" fill="#334155">Want the lock?</text>
  <text x="70" y="166" font-size="11" fill="#334155">Queue in the</text>
  <text x="70" y="182" font-size="11" fill="#334155">Entry Set.</text>

  <text x="620" y="270" font-size="11" fill="#334155">Condition not met?</text>
  <text x="620" y="286" font-size="11" fill="#334155">wait() — release the</text>
  <text x="620" y="302" font-size="11" fill="#334155">lock and sleep until</text>
  <text x="620" y="318" font-size="11" fill="#334155">someone signals.</text>

  <text x="410" y="410" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">This is what lets threads COORDINATE, not just exclude — the basis of producer/consumer, bounded buffers, etc.</text>
  <text x="410" y="430" text-anchor="middle" font-size="10.5" fill="#64748b">In Java: synchronized + wait()/notify(), or Lock + Condition.await()/signal().</text>
</svg>
