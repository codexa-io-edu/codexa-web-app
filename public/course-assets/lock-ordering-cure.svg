<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">The Cure: Consistent Lock Ordering</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">If every thread acquires locks in the SAME global order, a cycle can never form</text>

  <line x1="410" y1="76" x2="410" y2="392" stroke="#e2e8f0" stroke-width="2"/>

  <defs>
    <marker id="lo_a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <!-- LEFT: broken -->
  <text x="205" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">&#10007; Inconsistent order &#8594; deadlock</text>

  <rect x="60" y="118" width="130" height="44" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="125" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">Thread 1</text><text x="125" y="155" text-anchor="middle" font-size="9" fill="#334155">lock A, then B</text>
  <rect x="220" y="118" width="130" height="44" rx="7" fill="#fff7ed" stroke="#d97706"/><text x="285" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Thread 2</text><text x="285" y="155" text-anchor="middle" font-size="9" fill="#334155">lock B, then A</text>

  <rect x="60" y="180" width="290" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="205" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">Opposite orders</text>
  <text x="75" y="226" font-size="9.5" fill="#334155">T1: holds A &#9202; wants B</text>
  <text x="75" y="248" font-size="9.5" fill="#334155">T2: holds B &#9202; wants A</text>
  <text x="75" y="272" font-size="9.5" fill="#991b1b">&#8594; cycle forms</text>
  <text x="75" y="290" font-size="9.5" fill="#991b1b">&#8594; frozen forever</text>

  <text x="205" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">The cycle: A&#8594;B and B&#8594;A</text>

  <!-- RIGHT: fixed -->
  <text x="615" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">&#10003; Same order &#8594; safe</text>

  <rect x="470" y="118" width="130" height="44" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="535" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">Thread 1</text><text x="535" y="155" text-anchor="middle" font-size="9" fill="#334155">lock A, then B</text>
  <rect x="630" y="118" width="130" height="44" rx="7" fill="#fff7ed" stroke="#d97706"/><text x="695" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Thread 2</text><text x="695" y="155" text-anchor="middle" font-size="9" fill="#334155">lock A, then B</text>

  <rect x="470" y="180" width="290" height="120" rx="8" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text x="615" y="202" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">Both want A first</text>
  <text x="485" y="226" font-size="9.5" fill="#334155">Whoever gets A proceeds to B</text>
  <text x="485" y="248" font-size="9.5" fill="#334155">The other simply WAITS for A</text>
  <text x="485" y="272" font-size="9.5" fill="#047857">&#8594; no one holds A while</text>
  <text x="485" y="290" font-size="9.5" fill="#047857">wanting B behind the other</text>

  <text x="615" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">No cycle possible &#8594; no deadlock</text>

  <rect x="120" y="360" width="580" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="410" y="378" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">Rule: define a global order (e.g. by account id / hash) and ALWAYS acquire in that order.</text>
  <text x="410" y="394" text-anchor="middle" font-size="9.5" fill="#065f46">first = min(A,B); second = max(A,B); lock(first); lock(second);</text>
</svg>
