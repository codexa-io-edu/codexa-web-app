<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- divider -->
  <line x1="480" y1="40" x2="480" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ================= LEFT: SERVERFUL ================= -->
  <text x="240" y="34" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="700">SERVERFUL</text>

  <line x1="240" y1="94"  x2="240" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="180" x2="240" y2="204" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="264" x2="240" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="160" y="54" width="160" height="40" rx="8" fill="#1e293b"/>
  <text x="240" y="79" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Client</text>

  <rect x="140" y="132" width="200" height="42" rx="8" fill="#2563eb"/>
  <text x="240" y="159" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Load Balancer</text>

  <rect x="52"  y="206" width="112" height="52" rx="8" fill="#3b82f6"/>
  <text x="108" y="230" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Server 1</text>
  <text x="108" y="248" text-anchor="middle" fill="#dbeafe" font-size="11">always on</text>

  <rect x="184" y="206" width="112" height="52" rx="8" fill="#3b82f6"/>
  <text x="240" y="230" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Server 2</text>
  <text x="240" y="248" text-anchor="middle" fill="#dbeafe" font-size="11">always on</text>

  <rect x="316" y="206" width="112" height="52" rx="8" fill="#3b82f6"/>
  <text x="372" y="230" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Server N</text>
  <text x="372" y="248" text-anchor="middle" fill="#dbeafe" font-size="11">always on</text>

  <rect x="150" y="294" width="180" height="50" rx="8" fill="#1e40af"/>
  <text x="240" y="324" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Database</text>

  <text x="240" y="380" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Always-on fleet you provision</text>
  <text x="240" y="400" text-anchor="middle" fill="#64748b" font-size="12">You manage it · pay for idle · predictable latency</text>

  <!-- ================= RIGHT: SERVERLESS ================= -->
  <text x="720" y="34" text-anchor="middle" fill="#115e59" font-size="20" font-weight="700">SERVERLESS</text>

  <line x1="720" y1="94"  x2="720" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="180" x2="720" y2="204" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="264" x2="720" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="620" y="54" width="200" height="40" rx="8" fill="#1e293b"/>
  <text x="720" y="79" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Client / Event</text>

  <rect x="600" y="132" width="240" height="42" rx="8" fill="#0891b2"/>
  <text x="720" y="159" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">API Gateway (managed)</text>

  <rect x="536" y="206" width="112" height="52" rx="8" fill="#14b8a6" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="592" y="230" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Function</text>
  <text x="592" y="248" text-anchor="middle" fill="#ccfbf1" font-size="11">on demand</text>

  <rect x="664" y="206" width="112" height="52" rx="8" fill="#14b8a6" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="720" y="230" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Function</text>
  <text x="720" y="248" text-anchor="middle" fill="#ccfbf1" font-size="11">on demand</text>

  <rect x="792" y="206" width="112" height="52" rx="8" fill="#14b8a6" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="848" y="230" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Function</text>
  <text x="848" y="248" text-anchor="middle" fill="#ccfbf1" font-size="11">on demand</text>

  <rect x="610" y="294" width="220" height="50" rx="8" fill="#0d9488"/>
  <text x="720" y="317" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Managed DB / Storage</text>
  <text x="720" y="335" text-anchor="middle" fill="#ccfbf1" font-size="11">(BaaS)</text>

  <text x="720" y="380" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Compute summoned per event</text>
  <text x="720" y="400" text-anchor="middle" fill="#64748b" font-size="12">Provider manages it · pay per use · scales to zero</text>
</svg>
