<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .bsub { font-size: 10px; fill: #e2e8f0; }
    .lbl { font-size: 11px; font-weight: 700; fill: #1e293b; }
    .note { font-size: 11px; fill: #64748b; }
    .hit { font-size: 11px; font-weight: 700; fill: #059669; }
    .miss { font-size: 11px; font-weight: 700; fill: #d97706; }
  </style>

  <text x="24" y="30" class="title">Cache hit vs. cache miss</text>

  <!-- App -->
  <rect x="40" y="150" width="130" height="60" rx="8" fill="#1e293b"/>
  <text x="66" y="176" class="box">Application</text>
  <text x="58" y="196" class="bsub">needs data for key K</text>

  <!-- Cache -->
  <rect x="320" y="90" width="170" height="70" rx="8" fill="#2563eb"/>
  <text x="346" y="118" class="box">Cache (fast)</text>
  <text x="336" y="138" class="bsub">RAM · microseconds</text>
  <text x="336" y="152" class="bsub">holds a subset of data</text>

  <!-- DB -->
  <rect x="320" y="230" width="170" height="70" rx="8" fill="#64748b"/>
  <text x="346" y="258" class="box">Database (slow)</text>
  <text x="336" y="278" class="bsub">disk · milliseconds</text>
  <text x="336" y="292" class="bsub">the full source of truth</text>

  <!-- app -> cache -->
  <path d="M 170 168 C 240 168, 260 130, 318 125" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="314,120 324,125 314,131" fill="#2563eb"/>
  <text x="180" y="135" class="lbl">1 · check cache</text>

  <!-- HIT return -->
  <path d="M 320 145 C 250 175, 230 185, 172 188" fill="none" stroke="#059669" stroke-width="2.5"/>
  <polygon points="176,183 166,189 177,194" fill="#059669"/>
  <text x="200" y="212" class="hit">HIT → return instantly ✓</text>

  <!-- MISS to DB -->
  <path d="M 405 160 L 405 228" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5,4"/>
  <polygon points="400,224 405,234 410,224" fill="#d97706"/>
  <text x="415" y="200" class="miss">MISS ↓ go to DB</text>

  <!-- DB back + populate -->
  <path d="M 490 250 C 590 250, 600 150, 492 130" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="496,135 488,125 502,124" fill="#64748b"/>
  <text x="560" y="200" class="note">populate</text>
  <text x="560" y="215" class="note">cache, then</text>
  <text x="560" y="230" class="note">return</text>

  <!-- footer -->
  <rect x="24" y="330" width="752" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="354" class="lbl">Hit ratio = hits ÷ total lookups</text>
  <text x="240" y="354" class="note">— the headline metric. A 95% hit ratio means only 1 in 20 requests pays the slow database cost.</text>
  <text x="40" y="376" class="note">Caching works because a small slice of data serves most requests (locality) — so a small, fast cache absorbs the bulk of the load.</text>
</svg>
