<svg viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">The Five Structural Patterns</text>
  <text x="410" y="63" text-anchor="middle" font-size="13" fill="#64748b">All of them assemble objects into larger structures — but each solves a different composition problem</text>

  <!-- Adapter -->
  <rect x="40" y="92" width="740" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="52" y="104" width="180" height="52" rx="8" fill="#2563eb"/>
  <text x="142" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Adapter</text>
  <text x="248" y="126" font-size="13" font-weight="700" fill="#1d4ed8">Makes two incompatible interfaces work together.</text>
  <text x="248" y="150" font-size="12" fill="#334155">Use when: you must fit an existing/3rd-party class into an interface your code expects.</text>

  <!-- Bridge -->
  <rect x="40" y="180" width="740" height="76" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="52" y="192" width="180" height="52" rx="8" fill="#059669"/>
  <text x="142" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Bridge</text>
  <text x="248" y="214" font-size="13" font-weight="700" fill="#047857">Splits an abstraction from its implementation so both vary independently.</text>
  <text x="248" y="238" font-size="12" fill="#334155">Use when: a class explodes along two dimensions (e.g. shape type × rendering API).</text>

  <!-- Decorator -->
  <rect x="40" y="268" width="740" height="76" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="52" y="280" width="180" height="52" rx="8" fill="#d97706"/>
  <text x="142" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Decorator</text>
  <text x="248" y="302" font-size="13" font-weight="700" fill="#b45309">Adds responsibilities to an object dynamically by wrapping it.</text>
  <text x="248" y="326" font-size="12" fill="#334155">Use when: you want to layer optional behavior without a subclass explosion.</text>

  <!-- Facade -->
  <rect x="40" y="356" width="740" height="76" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="52" y="368" width="180" height="52" rx="8" fill="#7c3aed"/>
  <text x="142" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Facade</text>
  <text x="248" y="390" font-size="13" font-weight="700" fill="#6d28d9">Puts one simple interface over a complex subsystem.</text>
  <text x="248" y="414" font-size="12" fill="#334155">Use when: callers should not have to know a tangle of classes to get a job done.</text>

  <!-- Proxy -->
  <rect x="40" y="444" width="740" height="76" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="52" y="456" width="180" height="52" rx="8" fill="#0891b2"/>
  <text x="142" y="488" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Proxy</text>
  <text x="248" y="478" font-size="13" font-weight="700" fill="#0e7490">A stand-in that controls access to another object.</text>
  <text x="248" y="502" font-size="12" fill="#334155">Use when: you need lazy-loading, caching, access control, or remote access around an object.</text>
</svg>
