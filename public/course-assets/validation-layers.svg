<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Validation Layers: Where Each Kind Lives</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Catch malformed input at the boundary; enforce business rules in the domain</text>
  <defs><marker id="vl_a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs>

  <!-- HTTP Request box -->
  <rect x="30" y="90" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="95" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">HTTP Request</text>
  <text x="95" y="136" text-anchor="middle" font-size="9" fill="#334155">JSON body / params</text>
  <line x1="160" y1="120" x2="202" y2="120" stroke="#475569" stroke-width="1.8" marker-end="url(#vl_a)"/>

  <!-- Layer 1: Controller / DTO -->
  <rect x="204" y="72" width="170" height="98" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="289" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">Controller / DTO</text>
  <text x="289" y="114" text-anchor="middle" font-size="9.5" fill="#334155">Syntactic validation</text>
  <text x="289" y="130" text-anchor="middle" font-size="9" fill="#5b21b6">@NotNull, @Size, @Email</text>
  <text x="289" y="148" text-anchor="middle" font-size="9" fill="#5b21b6">@Pattern, @Min/@Max</text>
  <text x="289" y="162" text-anchor="middle" font-size="8.5" fill="#64748b">→ 400 Bad Request</text>
  <line x1="374" y1="120" x2="414" y2="120" stroke="#475569" stroke-width="1.8" marker-end="url(#vl_a)"/>

  <!-- Layer 2: Service -->
  <rect x="416" y="72" width="170" height="98" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="501" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Service / Domain</text>
  <text x="501" y="114" text-anchor="middle" font-size="9.5" fill="#334155">Semantic validation</text>
  <text x="501" y="130" text-anchor="middle" font-size="9" fill="#065f46">"user already exists"</text>
  <text x="501" y="148" text-anchor="middle" font-size="9" fill="#065f46">"insufficient balance"</text>
  <text x="501" y="162" text-anchor="middle" font-size="8.5" fill="#64748b">→ 409 / 422 / 403</text>
  <line x1="586" y1="120" x2="626" y2="120" stroke="#475569" stroke-width="1.8" marker-end="url(#vl_a)"/>

  <!-- Layer 3: DB -->
  <rect x="628" y="72" width="160" height="98" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="708" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Database</text>
  <text x="708" y="114" text-anchor="middle" font-size="9.5" fill="#334155">Integrity safety net</text>
  <text x="708" y="130" text-anchor="middle" font-size="9" fill="#92400e">NOT NULL, UNIQUE</text>
  <text x="708" y="148" text-anchor="middle" font-size="9" fill="#92400e">FK constraints</text>
  <text x="708" y="162" text-anchor="middle" font-size="8.5" fill="#64748b">→ 409 (last resort)</text>

  <!-- Rules box -->
  <rect x="40" y="220" width="740" height="160" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="410" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">The two kinds of validation — why they live in different layers</text>
  <rect x="60" y="260" width="330" height="104" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="225" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">Syntactic (structural)</text>
  <text x="70" y="300" font-size="9.5" fill="#334155">Is the input well-formed? Format, type, length,</text>
  <text x="70" y="316" font-size="9.5" fill="#334155">required fields. No DB or domain knowledge needed.</text>
  <text x="70" y="336" font-size="9.5" fill="#334155">Bean Validation @NotNull / @Email / @Size at the DTO.</text>
  <text x="70" y="356" font-size="9.5" font-weight="700" fill="#b91c1c">Fail fast → 400 before touching the domain.</text>
  <rect x="420" y="260" width="340" height="104" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.4"/>
  <text x="590" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Semantic (business)</text>
  <text x="430" y="300" font-size="9.5" fill="#334155">Does the input make business sense? Uniqueness,</text>
  <text x="430" y="316" font-size="9.5" fill="#334155">state transitions, balance checks, referential rules.</text>
  <text x="430" y="336" font-size="9.5" fill="#334155">Requires domain knowledge and possibly DB queries.</text>
  <text x="430" y="356" font-size="9.5" font-weight="700" fill="#b91c1c">Belongs in the service/domain layer → 409 / 422.</text>
</svg>
