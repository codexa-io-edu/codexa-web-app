<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Inheritance Hierarchy (the IS-A relationship)</text>

  <defs>
    <marker id="tri" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- base -->
  <rect x="300" y="70" width="160" height="66" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="380" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Animal</text>
  <text x="380" y="118" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="monospace">eat()  sleep()</text>

  <!-- level 2 -->
  <rect x="120" y="210" width="160" height="66" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="200" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Dog</text>
  <text x="200" y="258" text-anchor="middle" font-size="11" fill="#065f46" font-family="monospace">bark()</text>

  <rect x="300" y="210" width="160" height="66" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="380" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Cat</text>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#065f46" font-family="monospace">meow()</text>

  <rect x="480" y="210" width="160" height="66" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="560" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Bird</text>
  <text x="560" y="258" text-anchor="middle" font-size="11" fill="#065f46" font-family="monospace">fly()</text>

  <!-- level 3 -->
  <rect x="480" y="320" width="160" height="60" rx="10" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Penguin</text>
  <text x="560" y="366" text-anchor="middle" font-size="10.5" fill="#7c2d12">overrides fly()!</text>

  <!-- inheritance lines with hollow triangle pointing to parent -->
  <line x1="200" y1="210" x2="340" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#tri)"/>
  <line x1="380" y1="210" x2="380" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#tri)"/>
  <line x1="560" y1="210" x2="420" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#tri)"/>
  <line x1="560" y1="320" x2="560" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#tri)"/>

  <!-- labels -->
  <text x="235" y="180" font-size="11" fill="#64748b" transform="rotate(-27 235 180)">is-a</text>
  <text x="392" y="180" font-size="11" fill="#64748b">is-a</text>
  <text x="505" y="180" font-size="11" fill="#64748b" transform="rotate(27 505 180)">is-a</text>

  <text x="380" y="398" text-anchor="middle" font-size="11.5" fill="#64748b">Children inherit eat()/sleep() and add or override behavior. The hollow triangle points to the parent.</text>
</svg>
