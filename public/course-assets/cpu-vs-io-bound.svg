<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">CPU-Bound vs I/O-Bound: How Many Threads?</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">The bottleneck decides the right thread count — this is the most practical concurrency question</text>

  <!-- CPU-bound -->
  <text x="60" y="100" font-size="14" font-weight="700" fill="#b45309">CPU-bound task (e.g. image processing, hashing)</text>
  <rect x="60" y="112" width="680" height="34" rx="4" fill="#fdba74" stroke="#d97706"/>
  <text x="400" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">CPU busy computing — almost no waiting</text>
  <rect x="60" y="152" width="680" height="46" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.4"/>
  <text x="400" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">More threads than cores does NOT help — they just fight over the CPU.</text>
  <text x="400" y="190" text-anchor="middle" font-size="11" fill="#7c2d12">Rule of thumb: threads &#8776; number of CPU cores.</text>

  <!-- I/O-bound -->
  <text x="60" y="248" font-size="14" font-weight="700" fill="#1d4ed8">I/O-bound task (e.g. DB query, API call, disk read)</text>
  <!-- mostly waiting with small cpu bursts -->
  <rect x="60" y="260" width="40" height="34" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="100" y="260" width="230" height="34" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="330" y="260" width="40" height="34" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="370" y="260" width="230" height="34" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="600" y="260" width="40" height="34" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="640" y="260" width="100" height="34" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="215" y="282" text-anchor="middle" font-size="10" fill="#475569">waiting on I/O (CPU idle)</text>
  <text x="485" y="282" text-anchor="middle" font-size="10" fill="#475569">waiting on I/O (CPU idle)</text>

  <rect x="60" y="304" width="680" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="400" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">MANY more threads than cores helps — while one waits, others use the idle CPU.</text>
  <text x="400" y="342" text-anchor="middle" font-size="11" fill="#334155">Rule of thumb: many threads (or async I/O / virtual threads) to keep the CPU busy during waits.</text>

  <rect x="60" y="366" width="16" height="14" fill="#93c5fd" stroke="#2563eb"/><text x="84" y="378" font-size="10.5" fill="#334155">CPU active</text>
  <rect x="180" y="366" width="16" height="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="204" y="378" font-size="10.5" fill="#334155">blocked / waiting</text>
</svg>
