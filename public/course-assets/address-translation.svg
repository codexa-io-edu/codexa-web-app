<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="860" height="480" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Address Translation</text>

  <!-- Virtual address -->
  <text x="180" y="72" text-anchor="middle" fill="#475569" font-size="13" font-weight="600">Virtual Address</text>
  <rect x="60" y="80" width="150" height="48" rx="0" fill="#4f46e5"/>
  <text x="135" y="102" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Page Number</text>
  <text x="135" y="118" text-anchor="middle" fill="#c7d2fe" font-size="11">(VPN)</text>
  <rect x="210" y="80" width="90" height="48" rx="0" fill="#94a3b8"/>
  <text x="255" y="108" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Offset</text>

  <!-- VPN down to TLB -->
  <line x1="135" y1="128" x2="135" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#tm)"/>

  <!-- TLB -->
  <rect x="40" y="170" width="230" height="60" rx="10" fill="#0891b2"/>
  <text x="155" y="196" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">TLB</text>
  <text x="155" y="216" text-anchor="middle" fill="#cffafe" font-size="11">cache of recent translations</text>

  <!-- TLB hit path (down) -->
  <line x1="155" y1="230" x2="155" y2="360" stroke="#16a34a" stroke-width="2.4" marker-end="url(#tm)"/>
  <text x="120" y="300" text-anchor="end" fill="#16a34a" font-size="12" font-weight="700">HIT</text>
  <text x="120" y="316" text-anchor="end" fill="#16a34a" font-size="11">(fast)</text>

  <!-- TLB miss path (right to page table) -->
  <line x1="270" y1="200" x2="360" y2="200" stroke="#dc2626" stroke-width="2.4" marker-end="url(#tm)"/>
  <text x="315" y="190" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="700">MISS</text>

  <!-- Page table -->
  <rect x="360" y="168" width="230" height="64" rx="10" fill="#4f46e5"/>
  <text x="475" y="194" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Page Table</text>
  <text x="475" y="214" text-anchor="middle" fill="#c7d2fe" font-size="11">walked in memory (multi-level)</text>

  <!-- page table -> frame result (down) -->
  <line x1="475" y1="232" x2="475" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#tm)"/>
  <!-- page table updates TLB (dashed back) -->
  <path d="M 360 216 C 300 250, 250 250, 200 232" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tm)"/>
  <text x="300" y="264" text-anchor="middle" fill="#94a3b8" font-size="11">fills the TLB for next time</text>

  <!-- frame number box (from either path) -->
  <rect x="400" y="302" width="150" height="44" rx="8" fill="#0d9488"/>
  <text x="475" y="329" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Frame Number</text>
  <line x1="475" y1="346" x2="240" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#tm)"/>

  <!-- Physical address -->
  <text x="200" y="368" text-anchor="middle" fill="#475569" font-size="13" font-weight="600">Physical Address</text>
  <rect x="80" y="376" width="160" height="48" fill="#0d9488"/>
  <text x="160" y="404" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Frame Number</text>
  <rect x="240" y="376" width="90" height="48" fill="#94a3b8"/>
  <text x="285" y="404" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Offset</text>

  <!-- offset note -->
  <text x="470" y="404" text-anchor="start" fill="#94a3b8" font-size="11">offset (unchanged)</text>
  <text x="600" y="290" text-anchor="start" fill="#64748b" font-size="12">The offset is copied</text>
  <text x="600" y="308" text-anchor="start" fill="#64748b" font-size="12">straight through —</text>
  <text x="600" y="326" text-anchor="start" fill="#64748b" font-size="12">only the page number</text>
  <text x="600" y="344" text-anchor="start" fill="#64748b" font-size="12">is translated.</text>

  <text x="430" y="456" text-anchor="middle" fill="#334155" font-size="13">Only the page number is translated; TLB first (fast), page table on a miss. The offset never changes.</text>
</svg>
