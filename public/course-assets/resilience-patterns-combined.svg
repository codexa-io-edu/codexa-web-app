<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .desc { font-size: 9.5px; fill: #64748b; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <text x="24" y="30" class="title">Layered defense: the patterns work together on one call</text>
  <text x="24" y="50" class="desc">A single outbound call to a dependency, wrapped in successive protections — from the caller (left) to the dependency (right).</text>

  <!-- caller -->
  <rect x="24" y="180" width="90" height="60" rx="8" fill="#2563eb"/><text x="69" y="215" text-anchor="middle" class="box">Caller</text>

  <!-- layers as nested/sequential guards -->
  <rect x="140" y="80" width="120" height="260" rx="8" fill="#0ea5e9"/>
  <circle cx="200" cy="104" r="12" fill="#075985"/><text x="200" y="108" text-anchor="middle" class="num">1</text>
  <text x="200" y="134" text-anchor="middle" class="box">Timeout</text>
  <text x="200" y="160" text-anchor="middle" class="desc" fill="#f0f9ff">bound the wait —</text>
  <text x="200" y="174" text-anchor="middle" class="desc" fill="#f0f9ff">never block forever</text>
  <text x="200" y="196" text-anchor="middle" class="desc" fill="#f0f9ff">(+ deadline</text>
  <text x="200" y="210" text-anchor="middle" class="desc" fill="#f0f9ff">propagation)</text>

  <rect x="270" y="80" width="120" height="260" rx="8" fill="#059669"/>
  <circle cx="330" cy="104" r="12" fill="#065f46"/><text x="330" y="108" text-anchor="middle" class="num">2</text>
  <text x="330" y="134" text-anchor="middle" class="box">Retry</text>
  <text x="330" y="160" text-anchor="middle" class="desc" fill="#f0fdf4">exponential backoff</text>
  <text x="330" y="174" text-anchor="middle" class="desc" fill="#f0fdf4">+ jitter, retry</text>
  <text x="330" y="188" text-anchor="middle" class="desc" fill="#f0fdf4">budget; only if</text>
  <text x="330" y="202" text-anchor="middle" class="desc" fill="#f0fdf4">idempotent</text>

  <rect x="400" y="80" width="120" height="260" rx="8" fill="#d97706"/>
  <circle cx="460" cy="104" r="12" fill="#92400e"/><text x="460" y="108" text-anchor="middle" class="num">3</text>
  <text x="460" y="134" text-anchor="middle" class="box">Circuit breaker</text>
  <text x="460" y="160" text-anchor="middle" class="desc" fill="#fff7ed">trip open on repeated</text>
  <text x="460" y="174" text-anchor="middle" class="desc" fill="#fff7ed">failure → fail fast,</text>
  <text x="460" y="188" text-anchor="middle" class="desc" fill="#fff7ed">stop hammering</text>

  <rect x="530" y="80" width="120" height="260" rx="8" fill="#7c3aed"/>
  <circle cx="590" cy="104" r="12" fill="#4c1d95"/><text x="590" y="108" text-anchor="middle" class="num">4</text>
  <text x="590" y="134" text-anchor="middle" class="box">Bulkhead</text>
  <text x="590" y="160" text-anchor="middle" class="desc" fill="#faf5ff">isolated pool for this</text>
  <text x="590" y="174" text-anchor="middle" class="desc" fill="#faf5ff">dependency — cap its</text>
  <text x="590" y="188" text-anchor="middle" class="desc" fill="#faf5ff">blast radius</text>

  <!-- dependency -->
  <rect x="686" y="180" width="90" height="60" rx="8" fill="#64748b"/><text x="731" y="208" text-anchor="middle" class="box">Depend-</text><text x="731" y="224" text-anchor="middle" class="box">ency</text>

  <!-- flow arrows -->
  <line x1="114" y1="210" x2="138" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="210" x2="684" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- fallback -->
  <rect x="270" y="356" width="380" height="30" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="460" y="376" text-anchor="middle" class="desc" fill="#991b1b" font-weight="700">5 · If it still fails → FALLBACK: cached value, default, or graceful degradation (never a hard crash)</text>
  <line x1="590" y1="340" x2="500" y2="354" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3"/>

  <text x="24" y="410" class="desc">Plus system-wide guards from other topics: <tspan font-weight="700">load shedding &amp; rate limiting</tspan> (Traffic Management), <tspan font-weight="700">health checks &amp; failover</tspan> (Load Balancing), <tspan font-weight="700">idempotency</tspan> (Delivery Guarantees).</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
