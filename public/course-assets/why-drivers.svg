<svg viewBox="0 0 800 410" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
    .gate { font-size: 10px; font-weight: 700; fill: #92400e; }
  </style>

  <text x="24" y="30" class="title">Why adopt microservices — and the gate you must pass first</text>

  <!-- drivers -->
  <text x="40" y="66" class="h">The real drivers (benefits you're buying)</text>
  <rect x="24" y="76" width="230" height="44" rx="6" fill="#2563eb"/><text x="139" y="98" text-anchor="middle" class="box">Scale the ORGANIZATION</text><text x="139" y="113" text-anchor="middle" class="note" fill="#dbeafe">many teams ship independently</text>
  <rect x="270" y="76" width="230" height="44" rx="6" fill="#059669"/><text x="385" y="98" text-anchor="middle" class="box">Independent deployment</text><text x="385" y="113" text-anchor="middle" class="note" fill="#dcfce7">faster, safer, small blast radius</text>
  <rect x="516" y="76" width="260" height="44" rx="6" fill="#7c3aed"/><text x="646" y="98" text-anchor="middle" class="box">Targeted scaling</text><text x="646" y="113" text-anchor="middle" class="note" fill="#ede9fe">scale only the hot services</text>

  <rect x="24" y="128" width="230" height="44" rx="6" fill="#0ea5e9"/><text x="139" y="150" text-anchor="middle" class="box">Technology heterogeneity</text><text x="139" y="165" text-anchor="middle" class="note" fill="#e0f2fe">best tech per service; adopt new</text>
  <rect x="270" y="128" width="230" height="44" rx="6" fill="#d97706"/><text x="385" y="150" text-anchor="middle" class="box">Fault isolation</text><text x="385" y="165" text-anchor="middle" class="note" fill="#fff7ed">one service failing ≠ all down</text>
  <rect x="516" y="128" width="260" height="44" rx="6" fill="#64748b"/><text x="646" y="150" text-anchor="middle" class="box">Replaceability / evolvability</text><text x="646" y="165" text-anchor="middle" class="note" fill="#f1f5f9">rewrite/replace a service safely</text>

  <!-- gate -->
  <rect x="120" y="200" width="560" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="224" text-anchor="middle" class="gate">⚠ PREREQUISITE GATE — the benefits only materialize if you have:</text>
  <text x="400" y="246" text-anchor="middle" class="note">mature CI/CD &amp; automation · rapid provisioning · monitoring/observability · DevOps culture · a clear-enough domain</text>

  <!-- arrow down -->
  <line x1="400" y1="260" x2="400" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- outcomes -->
  <rect x="120" y="296" width="270" height="44" rx="8" fill="#dcfce7" stroke="#059669"/><text x="255" y="318" text-anchor="middle" class="h" fill="#065f46">Prerequisites met →</text><text x="255" y="334" text-anchor="middle" class="note" fill="#065f46">microservices pay off</text>
  <rect x="410" y="296" width="270" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="545" y="318" text-anchor="middle" class="h" fill="#991b1b">Prerequisites missing →</text><text x="545" y="334" text-anchor="middle" class="note" fill="#991b1b">complexity with no payoff — stay a monolith</text>

  <rect x="24" y="360" width="752" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="382" class="note">The number-one real driver is usually <tspan font-weight="700">organizational</tspan> — letting many autonomous teams deliver in parallel — not raw performance.</text>
  <text x="40" y="397" class="note">Amazon's "two-pizza teams" and the reverse-Conway maneuver are about org scaling as much as technology.</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
