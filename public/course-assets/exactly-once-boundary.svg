<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
    .lbl { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
    .warn { font-size: 10px; font-weight: 700; fill: #dc2626; }
  </style>

  <text x="24" y="30" class="title">Exactly-once in practice = at-least-once + dedup/atomicity, within a boundary</text>

  <!-- Kafka EOS transaction -->
  <rect x="24" y="52" width="752" height="150" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="40" y="76" class="lbl">Kafka exactly-once semantics (EOS): the read-process-write loop is one atomic transaction</text>

  <rect x="44" y="96" width="110" height="40" rx="6" fill="#7c3aed"/><text x="99" y="121" text-anchor="middle" class="box">topic A</text>
  <rect x="220" y="96" width="130" height="40" rx="6" fill="#059669"/><text x="285" y="121" text-anchor="middle" class="box">process</text>
  <rect x="420" y="96" width="110" height="40" rx="6" fill="#7c3aed"/><text x="475" y="121" text-anchor="middle" class="box">topic B</text>
  <rect x="580" y="96" width="170" height="40" rx="6" fill="#64748b"/><text x="665" y="116" text-anchor="middle" class="box">commit offset(A)</text><text x="665" y="130" text-anchor="middle" class="box">+ produce(B) atomically</text>

  <line x1="154" y1="116" x2="218" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="350" y1="116" x2="418" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="530" y1="116" x2="578" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>

  <text x="44" y="164" class="note">• <tspan font-weight="700">Idempotent producer</tspan> (PID + sequence numbers) removes duplicate writes from retries.</text>
  <text x="44" y="182" class="note">• <tspan font-weight="700">Transactions</tspan> make "produce to B" and "commit offset on A" all-or-nothing; consumers with <tspan font-family="'Consolas','Courier New',monospace">isolation.level=read_committed</tspan> never see aborted output.</text>

  <!-- boundary caveat -->
  <rect x="24" y="222" width="752" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="246" class="lbl">The boundary caveat — external side effects</text>
  <rect x="44" y="262" width="130" height="40" rx="6" fill="#059669"/><text x="109" y="287" text-anchor="middle" class="box">consumer</text>
  <rect x="260" y="262" width="160" height="40" rx="6" fill="#d97706"/><text x="340" y="282" text-anchor="middle" class="box">send email /</text><text x="340" y="296" text-anchor="middle" class="box">charge card</text>
  <line x1="174" y1="282" x2="258" y2="282" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>

  <text x="440" y="278" class="warn">You can't "un-send" an email or</text>
  <text x="440" y="294" class="warn">reliably roll back a charge.</text>

  <text x="44" y="330" class="note">Kafka's EOS holds only <tspan font-weight="700">within Kafka</tspan> (Kafka→Kafka). The moment you touch a non-transactional external system, you're back to</text>
  <text x="44" y="348" class="note">at-least-once at that edge — so guard it with an <tspan font-weight="700">idempotency key</tspan> at the external service (e.g. Stripe idempotency keys dedup the charge).</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
