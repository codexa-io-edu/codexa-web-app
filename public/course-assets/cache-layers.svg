<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .layer { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .lsub { font-size: 10.5px; fill: #f1f5f9; }
    .note { font-size: 11px; fill: #64748b; }
    .side { font-size: 11px; font-weight: 700; fill: #475569; }
  </style>

  <text x="24" y="30" class="title">Where caches live: layers between the user and the database</text>
  <text x="24" y="50" class="note">Each layer answers what it can, so fewer requests travel further. The closer the cache is to the user, the faster the response.</text>

  <!-- layers -->
  <rect x="120" y="70" width="540" height="46" rx="8" fill="#1e293b"/>
  <text x="140" y="92" class="layer">1 · Browser / client cache</text>
  <text x="140" y="108" class="lsub">on the user's device — the fastest possible; no network at all</text>

  <rect x="150" y="126" width="480" height="46" rx="8" fill="#2563eb"/>
  <text x="170" y="148" class="layer">2 · CDN / edge cache</text>
  <text x="170" y="164" class="lsub">geographically close to the user — serves static &amp; cacheable content (own topic)</text>

  <rect x="180" y="182" width="420" height="46" rx="8" fill="#3b82f6"/>
  <text x="200" y="204" class="layer">3 · Application in-process cache</text>
  <text x="200" y="220" class="lsub">local memory inside each server — fastest server-side, but per-instance</text>

  <rect x="210" y="238" width="360" height="46" rx="8" fill="#059669"/>
  <text x="230" y="260" class="layer">4 · Distributed cache</text>
  <text x="230" y="276" class="lsub">shared across all servers — Redis / Memcached (this topic)</text>

  <rect x="240" y="294" width="300" height="46" rx="8" fill="#64748b"/>
  <text x="260" y="316" class="layer">5 · Database cache</text>
  <text x="260" y="332" class="lsub">the DB's own buffer pool in RAM</text>

  <rect x="270" y="350" width="240" height="40" rx="8" fill="#94a3b8"/>
  <text x="290" y="375" class="layer">Database (disk)</text>

  <!-- side arrows -->
  <text x="690" y="96" class="side">fastest</text>
  <text x="690" y="120" class="note">↑ closer</text>
  <text x="690" y="360" class="note">↓ farther</text>
  <text x="690" y="384" class="side">slowest</text>

  <text x="24" y="410" class="note">A request only falls to the next layer on a miss. Good caching keeps the vast majority of traffic in layers 1–4, so the database stays lightly loaded.</text>
</svg>
