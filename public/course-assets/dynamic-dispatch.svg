<svg viewBox="0 0 780 410" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="410" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Runtime Polymorphism: Dynamic Method Dispatch</text>
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#64748b">The variable's declared type decides what you can call; the object's real type decides what runs.</text>

  <!-- call site -->
  <rect x="40" y="90" width="230" height="90" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="155" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Call site</text>
  <text x="52" y="138" font-size="11.5" fill="#065f46" font-family="monospace">Shape s = getShape();</text>
  <text x="52" y="158" font-size="11.5" fill="#065f46" font-family="monospace">s.area();</text>
  <text x="52" y="174" font-size="10" fill="#059669" font-family="monospace">// declared type: Shape</text>

  <defs>
    <marker id="dd" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="272" y1="135" x2="330" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#dd)"/>

  <!-- vtable lookup -->
  <rect x="335" y="88" width="220" height="235" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="445" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">At runtime: look up the</text>
  <text x="445" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">object's actual type</text>
  <line x1="355" y1="142" x2="535" y2="142" stroke="#a5b4fc" stroke-width="1.2"/>

  <rect x="355" y="156" width="180" height="44" rx="6" fill="#ffffff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="365" y="174" font-size="11" fill="#3730a3" font-family="monospace">if real type = Circle</text>
  <text x="365" y="192" font-size="10.5" fill="#4f46e5" font-family="monospace">&#8594; Circle.area()</text>

  <rect x="355" y="210" width="180" height="44" rx="6" fill="#ffffff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="365" y="228" font-size="11" fill="#3730a3" font-family="monospace">if real type = Square</text>
  <text x="365" y="246" font-size="10.5" fill="#4f46e5" font-family="monospace">&#8594; Square.area()</text>

  <rect x="355" y="264" width="180" height="44" rx="6" fill="#ffffff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="365" y="282" font-size="11" fill="#3730a3" font-family="monospace">if real type = Triangle</text>
  <text x="365" y="300" font-size="10.5" fill="#4f46e5" font-family="monospace">&#8594; Triangle.area()</text>

  <line x1="557" y1="135" x2="615" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#dd)"/>
  <line x1="557" y1="232" x2="615" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#dd)"/>
  <line x1="557" y1="286" x2="615" y2="286" stroke="#475569" stroke-width="2" marker-end="url(#dd)"/>

  <!-- outputs -->
  <rect x="620" y="112" width="140" height="46" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="1.8"/>
  <text x="690" y="140" text-anchor="middle" font-size="12" fill="#b45309" font-family="monospace">&#960; r&#178;</text>
  <rect x="620" y="209" width="140" height="46" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="1.8"/>
  <text x="690" y="237" text-anchor="middle" font-size="12" fill="#b45309" font-family="monospace">s &#215; s</text>
  <rect x="620" y="263" width="140" height="46" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="1.8"/>
  <text x="690" y="291" text-anchor="middle" font-size="12" fill="#b45309" font-family="monospace">&#189; b &#215; h</text>

  <text x="390" y="358" text-anchor="middle" font-size="12" fill="#334155">The caller writes ONE line — <tspan font-family="monospace" fill="#065f46">s.area()</tspan> — and the correct implementation is chosen automatically.</text>
  <text x="390" y="380" text-anchor="middle" font-size="11.5" fill="#64748b">Add a new Shape later and this call site never changes. That is the power of polymorphism.</text>
</svg>
