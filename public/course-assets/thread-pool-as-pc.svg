<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="380" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">A Thread Pool IS Producer-Consumer</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">You submit tasks (produce); worker threads pull and run them (consume) — the queue is a BlockingQueue</text>

  <defs>
    <marker id="tp2_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- submitters (producers) -->
  <text x="105" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Callers (producers)</text>
  <rect x="45" y="104" width="120" height="36" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="105" y="127" text-anchor="middle" font-size="10.5" fill="#1d4ed8">submit(task)</text>
  <rect x="45" y="148" width="120" height="36" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="105" y="171" text-anchor="middle" font-size="10.5" fill="#1d4ed8">submit(task)</text>
  <rect x="45" y="192" width="120" height="36" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="105" y="215" text-anchor="middle" font-size="10.5" fill="#1d4ed8">submit(task)</text>

  <!-- queue -->
  <rect x="290" y="112" width="150" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
  <text x="365" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a16207">Work Queue</text>
  <text x="365" y="130" text-anchor="middle" font-size="9" fill="#a16207">(BlockingQueue)</text>
  <rect x="306" y="142" width="118" height="22" rx="4" fill="#fde68a"/><text x="365" y="158" text-anchor="middle" font-size="9.5" fill="#a16207">task</text>
  <rect x="306" y="168" width="118" height="22" rx="4" fill="#fde68a"/><text x="365" y="184" text-anchor="middle" font-size="9.5" fill="#a16207">task</text>
  <rect x="306" y="194" width="118" height="22" rx="4" fill="#fde68a"/><text x="365" y="210" text-anchor="middle" font-size="9.5" fill="#a16207">task</text>

  <!-- workers (consumers) -->
  <text x="620" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Worker threads (consumers)</text>
  <rect x="540" y="104" width="150" height="36" rx="7" fill="#f0fdf4" stroke="#059669"/><text x="615" y="127" text-anchor="middle" font-size="10.5" fill="#047857">Worker 1 — take() + run</text>
  <rect x="540" y="148" width="150" height="36" rx="7" fill="#f0fdf4" stroke="#059669"/><text x="615" y="171" text-anchor="middle" font-size="10.5" fill="#047857">Worker 2 — take() + run</text>
  <rect x="540" y="192" width="150" height="36" rx="7" fill="#f0fdf4" stroke="#059669"/><text x="615" y="215" text-anchor="middle" font-size="10.5" fill="#047857">Worker 3 — take() + run</text>

  <line x1="165" y1="122" x2="288" y2="150" stroke="#2563eb" stroke-width="1.8" marker-end="url(#tp2_arr)"/>
  <line x1="165" y1="166" x2="288" y2="172" stroke="#2563eb" stroke-width="1.8" marker-end="url(#tp2_arr)"/>
  <line x1="165" y1="210" x2="288" y2="196" stroke="#2563eb" stroke-width="1.8" marker-end="url(#tp2_arr)"/>
  <line x1="440" y1="150" x2="538" y2="122" stroke="#059669" stroke-width="1.8" marker-end="url(#tp2_arr)"/>
  <line x1="440" y1="172" x2="538" y2="166" stroke="#059669" stroke-width="1.8" marker-end="url(#tp2_arr)"/>
  <line x1="440" y1="196" x2="538" y2="210" stroke="#059669" stroke-width="1.8" marker-end="url(#tp2_arr)"/>

  <rect x="120" y="266" width="580" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Map the roles:</text>
  <text x="410" y="312" text-anchor="middle" font-size="11" fill="#334155">ExecutorService.submit()  =  producer  &#8226;  the internal work queue  =  bounded buffer</text>
  <text x="410" y="332" text-anchor="middle" font-size="11" fill="#334155">pool worker threads  =  consumers  &#8226;  a bounded queue + rejection policy  =  backpressure</text>
  <text x="410" y="352" text-anchor="middle" font-size="10.5" fill="#64748b">So when you use a thread pool, you're already using producer-consumer — you just don't hand-code the queue.</text>
</svg>
