<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .box { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
    .lbl { font-size: 10px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">Bulkheads: isolate resource pools so one failure can't sink all</text>

  <!-- shared pool -->
  <rect x="24" y="48" width="360" height="300" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="24" y="48" width="360" height="34" rx="10" fill="#dc2626"/>
  <text x="44" y="71" class="h">✗ One shared pool</text>

  <rect x="90" y="104" width="228" height="60" rx="8" fill="#94a3b8"/>
  <text x="204" y="130" text-anchor="middle" class="box">Shared thread / connection pool</text>
  <text x="204" y="148" text-anchor="middle" class="box">(all 20 workers)</text>

  <rect x="60" y="200" width="90" height="40" rx="6" fill="#059669"/><text x="105" y="224" text-anchor="middle" class="box">calls to A</text>
  <rect x="170" y="200" width="90" height="40" rx="6" fill="#059669"/><text x="215" y="224" text-anchor="middle" class="box">calls to B</text>
  <rect x="280" y="200" width="90" height="40" rx="6" fill="#dc2626"/><text x="325" y="224" text-anchor="middle" class="box">calls to C ✗</text>
  <line x1="105" y1="198" x2="150" y2="166" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="215" y1="198" x2="204" y2="166" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="325" y1="198" x2="258" y2="166" stroke="#dc2626" stroke-width="1.6"/>

  <text x="44" y="272" class="note" fill="#991b1b">Slow dependency C consumes ALL 20 workers</text>
  <text x="44" y="288" class="note" fill="#991b1b">from the shared pool → calls to healthy A and B</text>
  <text x="44" y="304" class="note" fill="#991b1b">also starve. One bad dependency = total outage.</text>
  <text x="44" y="332" class="note" fill="#991b1b">(This is how cascading failure spreads.)</text>

  <!-- isolated pools -->
  <rect x="416" y="48" width="360" height="300" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="416" y="48" width="360" height="34" rx="10" fill="#059669"/>
  <text x="436" y="71" class="h">✓ Isolated pools per dependency</text>

  <rect x="440" y="104" width="100" height="90" rx="8" fill="#34d399"/><text x="490" y="124" text-anchor="middle" class="box">pool A</text><text x="490" y="140" text-anchor="middle" class="note" fill="#065f46">7 workers</text>
  <rect x="550" y="104" width="100" height="90" rx="8" fill="#34d399"/><text x="600" y="124" text-anchor="middle" class="box">pool B</text><text x="600" y="140" text-anchor="middle" class="note" fill="#065f46">7 workers</text>
  <rect x="660" y="104" width="100" height="90" rx="8" fill="#fca5a5"/><text x="710" y="124" text-anchor="middle" class="box">pool C ✗</text><text x="710" y="140" text-anchor="middle" class="note" fill="#7f1d1d">6 workers</text>

  <rect x="440" y="210" width="100" height="30" rx="5" fill="#059669"/><text x="490" y="230" text-anchor="middle" class="box">A ✓ healthy</text>
  <rect x="550" y="210" width="100" height="30" rx="5" fill="#059669"/><text x="600" y="230" text-anchor="middle" class="box">B ✓ healthy</text>
  <rect x="660" y="210" width="100" height="30" rx="5" fill="#dc2626"/><text x="710" y="230" text-anchor="middle" class="box">C ✗ down</text>
  <line x1="490" y1="194" x2="490" y2="208" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="600" y1="194" x2="600" y2="208" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="710" y1="194" x2="710" y2="208" stroke="#dc2626" stroke-width="1.4"/>

  <text x="436" y="272" class="note" fill="#065f46">C can only exhaust ITS own pool. A and B keep</text>
  <text x="436" y="288" class="note" fill="#065f46">their workers and stay healthy — the failure is</text>
  <text x="436" y="304" class="note" fill="#065f46">contained. Named after a ship's watertight</text>
  <text x="436" y="320" class="note" fill="#065f46">compartments: a breach floods one, not the hull.</text>
</svg>
