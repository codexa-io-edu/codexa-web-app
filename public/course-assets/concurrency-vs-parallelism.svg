<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#ffffff"/>
  <line x1="470" y1="30" x2="470" y2="330" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ===== LEFT: CONCURRENCY ===== -->
  <text x="235" y="34" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">CONCURRENCY</text>
  <text x="235" y="54" text-anchor="middle" fill="#64748b" font-size="13">one core — takes turns (time-slicing)</text>

  <text x="40" y="118" fill="#475569" font-size="13" font-weight="600">Core 1</text>

  <rect x="90"  y="96" width="58" height="40" fill="#4f46e5"/>
  <text x="119" y="121" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">T1</text>
  <rect x="150" y="96" width="58" height="40" fill="#0d9488"/>
  <text x="179" y="121" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">T2</text>
  <rect x="210" y="96" width="58" height="40" fill="#f59e0b"/>
  <text x="239" y="121" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">T3</text>
  <rect x="270" y="96" width="58" height="40" fill="#4f46e5"/>
  <text x="299" y="121" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">T1</text>
  <rect x="330" y="96" width="58" height="40" fill="#0d9488"/>
  <text x="359" y="121" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">T2</text>
  <rect x="390" y="96" width="50" height="40" fill="#f59e0b"/>
  <text x="415" y="121" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">T3</text>

  <text x="235" y="176" text-anchor="middle" fill="#94a3b8" font-size="11">each block = one short time slice on the core</text>
  <line x1="90" y1="200" x2="440" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#tarr)"/>
  <text x="90" y="220" fill="#64748b" font-size="12">time →</text>

  <text x="235" y="266" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Threads make progress by taking turns</text>
  <text x="235" y="286" text-anchor="middle" fill="#64748b" font-size="12">Only one runs at any instant — the illusion of "at once"</text>

  <!-- ===== RIGHT: PARALLELISM ===== -->
  <text x="705" y="34" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">PARALLELISM</text>
  <text x="705" y="54" text-anchor="middle" fill="#64748b" font-size="13">multiple cores — truly at the same time</text>

  <text x="520" y="106" fill="#475569" font-size="13" font-weight="600">Core 1</text>
  <rect x="580" y="88" width="300" height="34" fill="#4f46e5"/>
  <text x="730" y="110" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Thread 1</text>

  <text x="520" y="152" fill="#475569" font-size="13" font-weight="600">Core 2</text>
  <rect x="580" y="134" width="300" height="34" fill="#0d9488"/>
  <text x="730" y="156" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Thread 2</text>

  <text x="520" y="198" fill="#475569" font-size="13" font-weight="600">Core 3</text>
  <rect x="580" y="180" width="300" height="34" fill="#f59e0b"/>
  <text x="730" y="202" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Thread 3</text>

  <line x1="580" y1="238" x2="880" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#tarr)"/>
  <text x="580" y="258" fill="#64748b" font-size="12">time →</text>

  <text x="705" y="290" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Threads run genuinely simultaneously</text>
  <text x="705" y="310" text-anchor="middle" fill="#64748b" font-size="12">Needs more than one CPU core</text>

  <!-- legend -->
  <rect x="330" y="352" width="16" height="16" fill="#4f46e5"/>
  <text x="352" y="365" fill="#475569" font-size="12">Thread 1</text>
  <rect x="430" y="352" width="16" height="16" fill="#0d9488"/>
  <text x="452" y="365" fill="#475569" font-size="12">Thread 2</text>
  <rect x="530" y="352" width="16" height="16" fill="#f59e0b"/>
  <text x="552" y="365" fill="#475569" font-size="12">Thread 3</text>
</svg>
