<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">OCP: Extend Without Editing Existing Code</text>

  <line x1="410" y1="56" x2="410" y2="410" stroke="#e2e8f0" stroke-width="2"/>

  <!-- LEFT: violation -->
  <text x="205" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">&#10007; Switch on type</text>
  <rect x="40" y="96" width="330" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="58" y="120" font-size="12" fill="#991b1b" font-family="monospace">double area(Shape s) {</text>
  <text x="70" y="140" font-size="12" fill="#991b1b" font-family="monospace">if (s.type == CIRCLE) ...</text>
  <text x="70" y="160" font-size="12" fill="#991b1b" font-family="monospace">else if (s.type == SQUARE) ...</text>
  <text x="70" y="180" font-size="12" fill="#991b1b" font-family="monospace">else if (s.type == TRIANGLE) ...</text>
  <text x="70" y="204" font-size="12" fill="#dc2626" font-family="monospace" font-weight="700">// + edit here for EVERY</text>
  <text x="70" y="222" font-size="12" fill="#dc2626" font-family="monospace" font-weight="700">//   new shape</text>
  <text x="58" y="240" font-size="12" fill="#991b1b" font-family="monospace">}</text>

  <rect x="40" y="264" width="330" height="120" rx="10" fill="#fff1f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="205" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Adding "Hexagon" means:</text>
  <text x="60" y="312" font-size="11.5" fill="#991b1b">&#8226; reopen &amp; edit this tested method</text>
  <text x="60" y="333" font-size="11.5" fill="#991b1b">&#8226; risk breaking the other shapes</text>
  <text x="60" y="354" font-size="11.5" fill="#991b1b">&#8226; repeat in every type-switch</text>
  <text x="60" y="375" font-size="11.5" fill="#991b1b">&#8226; re-test everything</text>

  <!-- RIGHT: OCP -->
  <text x="615" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">&#10003; Polymorphic extension</text>

  <rect x="530" y="96" width="170" height="46" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.2"/>
  <text x="615" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">&#171;interface&#187; Shape</text>
  <text x="615" y="135" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="monospace">area()</text>

  <defs>
    <marker id="tri" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="450" y="196" width="100" height="40" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="500" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Circle</text>
  <rect x="565" y="196" width="100" height="40" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="615" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Square</text>
  <rect x="680" y="196" width="100" height="40" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="730" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Triangle</text>

  <line x1="500" y1="196" x2="600" y2="144" stroke="#475569" stroke-width="1.6" marker-end="url(#tri)"/>
  <line x1="615" y1="196" x2="615" y2="144" stroke="#475569" stroke-width="1.6" marker-end="url(#tri)"/>
  <line x1="730" y1="196" x2="630" y2="144" stroke="#475569" stroke-width="1.6" marker-end="url(#tri)"/>

  <!-- new shape plugs in -->
  <rect x="565" y="264" width="100" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="5 3"/>
  <text x="615" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">+ Hexagon</text>
  <line x1="615" y1="264" x2="615" y2="240" stroke="#16a34a" stroke-width="1.8" marker-end="url(#tri)"/>

  <rect x="500" y="322" width="230" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="615" y="346" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Adding "Hexagon" means:</text>
  <text x="516" y="368" font-size="11.5" fill="#065f46">&#8226; write ONE new class, implement area()</text>
  <text x="516" y="386" font-size="11.5" fill="#065f46">&#8226; existing code &amp; tests never change</text>
</svg>
