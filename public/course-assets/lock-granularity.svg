<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Why ConcurrentHashMap Is Fast: Granularity of Locking</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">One coarse lock serializes everyone; fine-grained locking lets independent operations run in parallel</text>

  <line x1="410" y1="76" x2="410" y2="410" stroke="#e2e8f0" stroke-width="2"/>

  <!-- LEFT: one big lock -->
  <text x="205" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">synchronizedMap: ONE lock</text>

  <rect x="70" y="120" width="270" height="130" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <circle cx="205" cy="150" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="205" y="155" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">LOCK</text>
  <rect x="90" y="178" width="230" height="24" rx="3" fill="#fde68a"/><text x="205" y="195" text-anchor="middle" font-size="9.5" fill="#a16207">entire map behind it</text>
  <rect x="90" y="206" width="230" height="24" rx="3" fill="#fde68a"/><text x="205" y="223" text-anchor="middle" font-size="9.5" fill="#a16207">every bucket, every key</text>

  <rect x="70" y="266" width="60" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="100" y="286" text-anchor="middle" font-size="9.5" fill="#1d4ed8">T1</text>
  <rect x="70" y="304" width="60" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="100" y="324" text-anchor="middle" font-size="9" fill="#64748b">T2 wait</text>
  <rect x="70" y="342" width="60" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="100" y="362" text-anchor="middle" font-size="9" fill="#64748b">T3 wait</text>
  <text x="240" y="290" font-size="10.5" fill="#7c2d12">Even if T1, T2, T3 touch</text>
  <text x="240" y="308" font-size="10.5" fill="#7c2d12">totally different keys,</text>
  <text x="240" y="326" font-size="10.5" fill="#7c2d12">they queue for the</text>
  <text x="240" y="344" font-size="10.5" fill="#7c2d12">single lock.</text>
  <text x="205" y="396" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Throughput ceiling: 1 op at a time</text>

  <!-- RIGHT: fine-grained -->
  <text x="615" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">ConcurrentHashMap: per-bin</text>

  <rect x="480" y="120" width="270" height="130" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <g>
    <rect x="496" y="140" width="52" height="90" rx="5" fill="#dcfce7" stroke="#059669"/><circle cx="522" cy="154" r="9" fill="#bbf7d0" stroke="#047857"/><text x="522" y="158" text-anchor="middle" font-size="6.5" fill="#065f46">bin0</text>
    <rect x="556" y="140" width="52" height="90" rx="5" fill="#dcfce7" stroke="#059669"/><circle cx="582" cy="154" r="9" fill="#bbf7d0" stroke="#047857"/><text x="582" y="158" text-anchor="middle" font-size="6.5" fill="#065f46">bin1</text>
    <rect x="616" y="140" width="52" height="90" rx="5" fill="#dcfce7" stroke="#059669"/><circle cx="642" cy="154" r="9" fill="#bbf7d0" stroke="#047857"/><text x="642" y="158" text-anchor="middle" font-size="6.5" fill="#065f46">bin2</text>
    <rect x="676" y="140" width="52" height="90" rx="5" fill="#dcfce7" stroke="#059669"/><circle cx="702" cy="154" r="9" fill="#bbf7d0" stroke="#047857"/><text x="702" y="158" text-anchor="middle" font-size="6.5" fill="#065f46">bin3</text>
  </g>
  <text x="615" y="246" text-anchor="middle" font-size="9" fill="#065f46">each bin locked independently (or CAS)</text>

  <rect x="490" y="266" width="60" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="520" y="286" text-anchor="middle" font-size="9.5" fill="#1d4ed8">T1&#8594;bin0</text>
  <rect x="560" y="266" width="60" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="590" y="286" text-anchor="middle" font-size="9.5" fill="#1d4ed8">T2&#8594;bin1</text>
  <rect x="630" y="266" width="60" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="660" y="286" text-anchor="middle" font-size="9.5" fill="#1d4ed8">T3&#8594;bin2</text>
  <text x="615" y="322" font-size="10.5" fill="#065f46" text-anchor="middle">Different bins &#8594; no contention &#8594; run in parallel</text>
  <text x="615" y="344" font-size="10.5" fill="#065f46" text-anchor="middle">Reads usually need no lock at all</text>
  <text x="615" y="396" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Throughput scales with cores</text>
</svg>
