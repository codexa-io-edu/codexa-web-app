<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .actor { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .mono { font-size: 11px; font-family: 'Consolas','Courier New',monospace; fill: #1e293b; }
    .msg { font-size: 11px; font-weight: 700; fill: #1e293b; }
    .note { font-size: 10.5px; fill: #64748b; }
    .phase { font-size: 12px; font-weight: 700; fill: #2563eb; }
  </style>

  <text x="24" y="30" class="title">WebSocket: upgrade from HTTP, then talk freely both ways</text>

  <text x="120" y="64" class="actor">Client</text>
  <text x="600" y="64" class="actor">Server</text>
  <line x1="140" y1="72" x2="140" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="620" y1="72" x2="620" y2="340" stroke="#cbd5e1" stroke-width="2"/>

  <!-- handshake -->
  <text x="24" y="94" class="phase">1 · The handshake — starts as ordinary HTTP</text>
  <line x1="140" y1="108" x2="620" y2="120" stroke="#2563eb" stroke-width="2"/><polygon points="614,114 624,121 612,125" fill="#2563eb"/>
  <text x="160" y="104" class="mono">GET /chat  Upgrade: websocket</text>
  <line x1="620" y1="140" x2="140" y2="152" stroke="#059669" stroke-width="2"/><polygon points="146,146 136,153 148,157" fill="#059669"/>
  <text x="180" y="136" class="mono">101 Switching Protocols</text>
  <text x="150" y="176" class="note">The HTTP connection is "upgraded" — from here it's no longer HTTP, but a persistent WebSocket channel.</text>

  <!-- persistent channel -->
  <text x="24" y="212" class="phase">2 · Full-duplex channel (one connection, both directions, anytime)</text>
  <rect x="140" y="224" width="480" height="8" rx="4" fill="#2563eb" opacity="0.25"/>
  <line x1="140" y1="252" x2="620" y2="252" stroke="#2563eb" stroke-width="2"/><polygon points="614,247 624,252 614,257" fill="#2563eb"/>
  <text x="230" y="246" class="msg">client → "hello"  (a small frame)</text>
  <line x1="620" y1="282" x2="140" y2="282" stroke="#7c3aed" stroke-width="2"/><polygon points="146,277 136,282 146,287" fill="#7c3aed"/>
  <text x="230" y="276" class="msg">server → "new message from Priya"</text>
  <line x1="620" y1="312" x2="140" y2="312" stroke="#7c3aed" stroke-width="2"/><polygon points="146,307 136,312 146,317" fill="#7c3aed"/>
  <text x="250" y="306" class="msg">server → "Priya is typing…"</text>
  <text x="150" y="334" class="note">Either side sends whenever it wants; frames are tiny (no per-message HTTP headers). WSS = the same over TLS.</text>

  <!-- vs polling -->
  <rect x="24" y="352" width="752" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="374" class="phase">vs. HTTP polling</text>
  <text x="40" y="396" class="note">Polling reopens a request (with full headers) again and again just to ask "anything new?" — wasteful and laggy.</text>
  <text x="40" y="416" class="note">WebSocket pays the handshake <tspan font-weight="700">once</tspan>, then pushes instantly in both directions with minimal overhead — ideal for chat, collaboration, and live dashboards.</text>
</svg>
