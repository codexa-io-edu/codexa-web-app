<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Tight vs Loose Coupling</text>
  <text x="410" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">Direct instantiation welds classes together; dependency injection through interfaces decouples them</text>

  <line x1="410" y1="64" x2="410" y2="420" stroke="#e2e8f0" stroke-width="2"/>

  <defs>
    <marker id="tc_a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="lc_a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>

  <!-- TIGHT -->
  <text x="205" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">✗ Tight Coupling</text>
  <rect x="30" y="92" width="360" height="130" rx="8" fill="#0f172a"/>
  <text x="40" y="112" font-size="9.5" fill="#94a3b8" font-family="monospace">class OrderService {</text>
  <text x="40" y="130" font-size="9.5" fill="#fca5a5" font-family="monospace">  // direct instantiation — hard dependency</text>
  <text x="40" y="148" font-size="9.5" fill="#f87171" font-family="monospace">  EmailSender emailer = new SmtpEmailSender();</text>
  <text x="40" y="166" font-size="9.5" fill="#f87171" font-family="monospace">  PaymentGateway gw   = new StripeGateway();</text>
  <text x="40" y="184" font-size="9.5" fill="#e2e8f0" font-family="monospace">  void placeOrder(Order o) {</text>
  <text x="40" y="202" font-size="9.5" fill="#e2e8f0" font-family="monospace">    gw.charge(o); emailer.send(o);</text>
  <text x="40" y="214" font-size="9.5" fill="#94a3b8" font-family="monospace">} }</text>

  <rect x="30" y="236" width="360" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="40" y="256" font-size="9.5" fill="#b91c1c">&#10007; Cannot swap to SendGrid without editing OrderService</text>
  <text x="40" y="274" font-size="9.5" fill="#b91c1c">&#10007; Cannot test without real SMTP and Stripe</text>
  <text x="40" y="292" font-size="9.5" fill="#b91c1c">&#10007; Change in SmtpEmailSender forces recompile of OrderService</text>

  <!-- LOOSE -->
  <text x="615" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">✓ Loose Coupling (DI + Interface)</text>
  <rect x="430" y="92" width="360" height="130" rx="8" fill="#0f172a"/>
  <text x="440" y="112" font-size="9.5" fill="#94a3b8" font-family="monospace">class OrderService {</text>
  <text x="440" y="130" font-size="9.5" fill="#86efac" font-family="monospace">  // depends on abstractions, injected</text>
  <text x="440" y="148" font-size="9.5" fill="#4ade80" font-family="monospace">  final EmailSender     emailer;</text>
  <text x="440" y="166" font-size="9.5" fill="#4ade80" font-family="monospace">  final PaymentGateway  gateway;</text>
  <text x="440" y="184" font-size="9.5" fill="#e2e8f0" font-family="monospace">  void placeOrder(Order o) {</text>
  <text x="440" y="202" font-size="9.5" fill="#e2e8f0" font-family="monospace">    gateway.charge(o); emailer.send(o);</text>
  <text x="440" y="214" font-size="9.5" fill="#94a3b8" font-family="monospace">} }</text>

  <rect x="430" y="236" width="360" height="78" rx="8" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text x="440" y="256" font-size="9.5" fill="#047857">&#10003; Swap SmtpEmailSender for SendGrid — OrderService unchanged</text>
  <text x="440" y="274" font-size="9.5" fill="#047857">&#10003; Inject a mock in tests — no real SMTP or Stripe needed</text>
  <text x="440" y="292" font-size="9.5" fill="#047857">&#10003; Open for extension; closed to modification</text>

  <!-- interface box -->
  <rect x="230" y="344" width="360" height="68" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="410" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">The interfaces that decouple them</text>
  <text x="410" y="384" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#334155">interface EmailSender  { void send(Order o); }</text>
  <text x="410" y="400" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#334155">interface PaymentGateway { void charge(Order o); }</text>
</svg>
