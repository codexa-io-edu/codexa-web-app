<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .lbl { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .item { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .cnt { font-size: 10px; fill: #dcfce7; }
    .note { font-size: 11px; fill: #64748b; }
    .bad { font-size: 11px; font-weight: 700; fill: #dc2626; }
  </style>

  <text x="24" y="30" class="title">LFU: evict the least-frequently-used — grouped by access count</text>

  <!-- frequency buckets -->
  <text x="40" y="70" class="lbl">Items grouped into frequency buckets; evict from the lowest bucket first.</text>

  <!-- freq 1 -->
  <rect x="40" y="86" width="120" height="30" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="52" y="106" class="lbl" fill="#b91c1c">freq = 1 ← evict here</text>
  <rect x="180" y="84" width="70" height="34" rx="5" fill="#94a3b8"/><text x="206" y="106" class="item">E</text>
  <rect x="260" y="84" width="70" height="34" rx="5" fill="#94a3b8"/><text x="286" y="106" class="item">F</text>
  <text x="345" y="106" class="note">accessed once — first to go</text>

  <!-- freq 3 -->
  <rect x="40" y="130" width="120" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="66" y="150" class="lbl">freq = 3</text>
  <rect x="180" y="128" width="70" height="34" rx="5" fill="#3b82f6"/><text x="206" y="150" class="item">B</text>

  <!-- freq 8 -->
  <rect x="40" y="174" width="120" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="66" y="194" class="lbl">freq = 8</text>
  <rect x="180" y="172" width="70" height="34" rx="5" fill="#2563eb"/><text x="206" y="194" class="item">A</text>
  <text x="270" y="194" class="note">hot &amp; genuinely popular — safe</text>

  <!-- aging problem -->
  <rect x="40" y="232" width="700" height="150" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="56" y="256" class="lbl" fill="#b91c1c">The aging problem (LFU's big weakness)</text>
  <rect x="56" y="272" width="90" height="34" rx="5" fill="#7f1d1d"/><text x="72" y="294" class="item">OLD</text>
  <text x="160" y="286" class="note">freq = 900 — went viral <tspan font-weight="700">last year</tspan>, nobody views it now,</text>
  <text x="160" y="302" class="bad">but its huge count means it's never evicted → dead weight in the cache.</text>
  <text x="56" y="332" class="note">Also: a brand-new item starts at freq = 1 and can be evicted immediately — before it gets a chance to prove itself.</text>
  <text x="56" y="356" class="note">Fix: <tspan font-weight="700">aging / decay</tspan> — periodically shrink counts (or use a sliding window) so stale popularity fades. This is what LFU variants add.</text>
  <text x="56" y="376" class="note">Cost vs LRU: LFU must track and sort by counts, so it carries more bookkeeping overhead.</text>
</svg>
