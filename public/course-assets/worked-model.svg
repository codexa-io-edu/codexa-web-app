<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Worked Model: Order Management Context</text>
  <text x="410" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">Entities, value objects, aggregate boundaries, and repository all visible in one diagram</text>

  <defs>
    <marker id="wm_a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="wm_d" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#334155" stroke-width="1.5"/></marker>
  </defs>

  <!-- AGGREGATE BOUNDARY -->
  <rect x="200" y="72" width="430" height="310" rx="14" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="10 5"/>
  <text x="414" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">&#171;Aggregate&#187; — Order</text>

  <!-- Order (root) -->
  <rect x="295" y="106" width="240" height="120" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="295" y="106" width="240" height="26" fill="#d97706" rx="8"/>
  <text x="295" y="106" font-size="0" fill="#d97706"/>
  <text x="415" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Order  «Aggregate Root»</text>
  <line x1="295" y1="132" x2="535" y2="132" stroke="#d97706" stroke-width="1.4"/>
  <text x="305" y="150" font-size="9" fill="#334155" font-family="monospace">- id: OrderId  // strong type</text>
  <text x="305" y="166" font-size="9" fill="#334155" font-family="monospace">- status: OrderStatus</text>
  <text x="305" y="182" font-size="9" fill="#334155" font-family="monospace">- total: Money  // VO</text>
  <text x="305" y="198" font-size="9" fill="#334155" font-family="monospace">- placedAt: Instant</text>
  <line x1="295" y1="204" x2="535" y2="204" stroke="#d97706" stroke-width="1"/>
  <text x="305" y="218" font-size="9" fill="#1d4ed8" font-family="monospace">+ confirm(), cancel(), addItem()</text>

  <!-- OrderItem (child entity) -->
  <rect x="215" y="268" width="190" height="96" rx="8" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="310" y="284" text-anchor="middle" font-size="10" font-weight="700" fill="#a16207">OrderItem  «Entity»</text>
  <line x1="215" y1="288" x2="405" y2="288" stroke="#ca8a04" stroke-width="1"/>
  <text x="225" y="306" font-size="8.5" fill="#334155" font-family="monospace">- lineId: UUID</text>
  <text x="225" y="322" font-size="8.5" fill="#334155" font-family="monospace">- productId: ProductId</text>
  <text x="225" y="338" font-size="8.5" fill="#334155" font-family="monospace">- qty: int</text>
  <text x="225" y="354" font-size="8.5" fill="#334155" font-family="monospace">- unitPrice: Money</text>

  <!-- Money VO -->
  <rect x="430" y="268" width="175" height="96" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
  <text x="517" y="284" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">Money  «Value Object»</text>
  <line x1="430" y1="288" x2="605" y2="288" stroke="#059669" stroke-width="1"/>
  <text x="440" y="306" font-size="8.5" fill="#334155" font-family="monospace">amount: BigDecimal</text>
  <text x="440" y="322" font-size="8.5" fill="#334155" font-family="monospace">currency: Currency</text>
  <text x="440" y="340" font-size="8.5" fill="#1d4ed8" font-family="monospace">+ add(Money): Money</text>
  <text x="440" y="356" font-size="8.5" fill="#1d4ed8" font-family="monospace">+ multiply(int): Money</text>

  <!-- composition arrows inside aggregate -->
  <path d="M415,226 L415,242 L310,242 L310,266" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#wm_a)"/>
  <text x="330" y="254" font-size="8" fill="#b45309">1..*</text>
  <path d="M415,226 L415,242 L517,242 L517,266" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#wm_a)"/>

  <!-- Customer entity outside -->
  <rect x="30" y="140" width="158" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="109" y="158" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">Customer «Entity»</text>
  <line x1="30" y1="162" x2="188" y2="162" stroke="#2563eb" stroke-width="1"/>
  <text x="40" y="178" font-size="8.5" fill="#334155" font-family="monospace">id: CustomerId</text>
  <text x="40" y="194" font-size="8.5" fill="#334155" font-family="monospace">email: EmailAddress</text>
  <text x="40" y="210" font-size="8.5" fill="#334155" font-family="monospace">name: String</text>
  <line x1="188" y1="172" x2="293" y2="172" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#wm_d)"/>
  <text x="240" y="162" text-anchor="middle" font-size="8" fill="#64748b">ref by id</text>

  <!-- Repository -->
  <rect x="640" y="140" width="158" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="719" y="158" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">«interface»</text>
  <text x="719" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">OrderRepository</text>
  <text x="650" y="190" font-size="8" fill="#334155" font-family="monospace">findById(OrderId)</text>
  <text x="650" y="204" font-size="8" fill="#334155" font-family="monospace">save(Order)</text>
  <line x1="638" y1="176" x2="536" y2="176" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#wm_d)"/>

  <rect x="180" y="396" width="460" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="410" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Invariant enforced by the aggregate root</text>
  <text x="410" y="436" text-anchor="middle" font-size="10" fill="#334155">Order.addItem() checks that status == PENDING before allowing changes.</text>
  <text x="410" y="452" text-anchor="middle" font-size="10" fill="#334155">No outside code can add an OrderItem directly — it must go through the root.</text>
</svg>
