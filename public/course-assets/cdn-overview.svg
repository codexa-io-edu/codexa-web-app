<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .panel { font-size: 14px; font-weight: 700; fill: #1e293b; }
    .node { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .u { font-size: 10px; font-weight: 700; fill: #1e293b; }
    .note { font-size: 10.5px; fill: #64748b; }
    .bad { font-size: 10.5px; font-weight: 700; fill: #dc2626; }
    .ok { font-size: 10.5px; font-weight: 700; fill: #059669; }
  </style>

  <text x="24" y="30" class="title">Why a CDN: serve users from nearby, not from one distant origin</text>

  <!-- WITHOUT -->
  <rect x="24" y="48" width="366" height="330" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="44" y="72" class="panel" fill="#b91c1c">Without a CDN</text>

  <!-- origin center -->
  <rect x="170" y="180" width="80" height="46" rx="8" fill="#1e293b"/><text x="182" y="203" class="node">Origin</text><text x="186" y="217" class="node" font-size="9">(one location)</text>

  <!-- users far -->
  <circle cx="60" cy="110" r="16" fill="#94a3b8"/><text x="48" y="114" class="u" fill="#fff">IN</text>
  <circle cx="340" cy="110" r="16" fill="#94a3b8"/><text x="330" y="114" class="u" fill="#fff">EU</text>
  <circle cx="60" cy="300" r="16" fill="#94a3b8"/><text x="46" y="304" class="u" fill="#fff">AU</text>
  <circle cx="340" cy="300" r="16" fill="#94a3b8"/><text x="330" y="304" class="u" fill="#fff">US</text>

  <line x1="74" y1="118" x2="168" y2="188" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="326" y1="118" x2="252" y2="188" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="74" y1="292" x2="168" y2="218" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="326" y1="292" x2="252" y2="218" stroke="#dc2626" stroke-width="1.5"/>

  <text x="44" y="340" class="bad">✗ far users wait (high latency, physics)</text>
  <text x="44" y="358" class="bad">✗ one origin bears all load &amp; is a single choke point</text>

  <!-- WITH -->
  <rect x="410" y="48" width="366" height="330" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="430" y="72" class="panel" fill="#059669">With a CDN</text>

  <!-- origin -->
  <rect x="556" y="188" width="74" height="42" rx="8" fill="#1e293b"/><text x="568" y="213" class="node">Origin</text>

  <!-- edges near each user -->
  <rect x="452" y="96" width="52" height="30" rx="5" fill="#2563eb"/><text x="466" y="116" class="node">edge</text>
  <rect x="684" y="96" width="52" height="30" rx="5" fill="#2563eb"/><text x="698" y="116" class="node">edge</text>
  <rect x="452" y="286" width="52" height="30" rx="5" fill="#2563eb"/><text x="466" y="306" class="node">edge</text>
  <rect x="684" y="286" width="52" height="30" rx="5" fill="#2563eb"/><text x="698" y="306" class="node">edge</text>

  <!-- users -->
  <circle cx="436" cy="82" r="13" fill="#94a3b8"/><text x="426" y="86" class="u" fill="#fff">IN</text>
  <circle cx="736" cy="82" r="13" fill="#94a3b8"/><text x="727" y="86" class="u" fill="#fff">EU</text>
  <circle cx="436" cy="330" r="13" fill="#94a3b8"/><text x="425" y="334" class="u" fill="#fff">AU</text>
  <circle cx="736" cy="330" r="13" fill="#94a3b8"/><text x="727" y="334" class="u" fill="#fff">US</text>

  <!-- user to nearest edge (short, green) -->
  <line x1="443" y1="93" x2="466" y2="96" stroke="#059669" stroke-width="2"/>
  <line x1="729" y1="93" x2="710" y2="96" stroke="#059669" stroke-width="2"/>
  <line x1="443" y1="319" x2="466" y2="316" stroke="#059669" stroke-width="2"/>
  <line x1="729" y1="319" x2="710" y2="316" stroke="#059669" stroke-width="2"/>

  <!-- edge to origin (dashed, only on miss) -->
  <line x1="504" y1="111" x2="556" y2="195" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="684" y1="111" x2="630" y2="195" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="504" y1="301" x2="556" y2="220" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="684" y1="301" x2="630" y2="220" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>

  <text x="430" y="352" class="ok">✓ users hit the nearest edge → low latency</text>
  <text x="430" y="370" class="note">edge → origin (dashed) only on a cache miss → origin offloaded</text>
</svg>
