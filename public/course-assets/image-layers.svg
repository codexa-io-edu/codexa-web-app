<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .layer { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
    .lbl { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">Images are stacked read-only layers; containers add a writable one</text>

  <!-- the image stack -->
  <text x="60" y="66" class="lbl">Image (read-only, shared)</text>
  <rect x="60" y="76" width="240" height="30" rx="4" fill="#7c3aed"/><text x="180" y="96" text-anchor="middle" class="layer">Layer 4: COPY app code</text>
  <rect x="60" y="110" width="240" height="30" rx="4" fill="#8b5cf6"/><text x="180" y="130" text-anchor="middle" class="layer">Layer 3: RUN install deps</text>
  <rect x="60" y="144" width="240" height="30" rx="4" fill="#a78bfa"/><text x="180" y="164" text-anchor="middle" class="layer">Layer 2: runtime (e.g. Node)</text>
  <rect x="60" y="178" width="240" height="30" rx="4" fill="#c4b5fd"/><text x="180" y="198" text-anchor="middle" class="layer" fill="#1e293b">Layer 1: base OS (FROM)</text>
  <text x="60" y="230" class="note">Each Dockerfile instruction = one layer.</text>
  <text x="60" y="246" class="note">Layers are content-addressed (digests) &amp; cached.</text>

  <!-- containers sharing -->
  <text x="420" y="66" class="lbl">Three containers from the SAME image</text>

  <g>
    <rect x="420" y="80" width="100" height="24" rx="3" fill="#059669"/><text x="470" y="97" text-anchor="middle" class="layer">C1 writable</text>
    <rect x="420" y="106" width="100" height="70" rx="3" fill="#ddd6fe" stroke="#a78bfa"/><text x="470" y="146" text-anchor="middle" class="note" fill="#5b21b6">shared RO</text><text x="470" y="160" text-anchor="middle" class="note" fill="#5b21b6">image layers</text>
  </g>
  <g>
    <rect x="540" y="80" width="100" height="24" rx="3" fill="#059669"/><text x="590" y="97" text-anchor="middle" class="layer">C2 writable</text>
    <rect x="540" y="106" width="100" height="70" rx="3" fill="#ddd6fe" stroke="#a78bfa"/><text x="590" y="146" text-anchor="middle" class="note" fill="#5b21b6">shared RO</text><text x="590" y="160" text-anchor="middle" class="note" fill="#5b21b6">image layers</text>
  </g>
  <g>
    <rect x="660" y="80" width="100" height="24" rx="3" fill="#059669"/><text x="710" y="97" text-anchor="middle" class="layer">C3 writable</text>
    <rect x="660" y="106" width="100" height="70" rx="3" fill="#ddd6fe" stroke="#a78bfa"/><text x="710" y="146" text-anchor="middle" class="note" fill="#5b21b6">shared RO</text><text x="710" y="160" text-anchor="middle" class="note" fill="#5b21b6">image layers</text>
  </g>

  <text x="420" y="200" class="note">Each container gets its own thin <tspan font-weight="700">writable layer</tspan> (green);</text>
  <text x="420" y="216" class="note">the read-only image layers are <tspan font-weight="700">shared</tspan>, saving disk &amp; RAM.</text>
  <text x="420" y="232" class="note">Writes use <tspan font-weight="700">copy-on-write</tspan>: modifying a file copies it up</text>
  <text x="420" y="248" class="note">into the writable layer, leaving the image untouched.</text>

  <!-- footer -->
  <rect x="24" y="280" width="752" height="104" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="302" class="lbl">Why layers matter</text>
  <text x="40" y="324" class="note">• <tspan font-weight="700">Caching &amp; fast builds</tspan> — unchanged layers are reused; only changed layers (and those above) rebuild.</text>
  <text x="40" y="344" class="note">• <tspan font-weight="700">Small transfers</tspan> — pulling/pushing an image only moves layers you don't already have.</text>
  <text x="40" y="364" class="note">• <tspan font-weight="700">Ephemerality</tspan> — the writable layer is discarded when the container is removed → persist real data in volumes, not in the container.</text>
</svg>
