<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .bsub { font-size: 10px; fill: #e2e8f0; }
    .step { font-size: 11px; font-weight: 700; fill: #1e293b; }
    .note { font-size: 11px; fill: #64748b; }
    .ok { font-size: 11px; font-weight: 700; fill: #059669; }
  </style>

  <text x="24" y="30" class="title">Write-Through: write to cache and DB together, then ack</text>

  <rect x="40" y="120" width="120" height="56" rx="8" fill="#1e293b"/><text x="72" y="146" class="box">App</text><text x="60" y="164" class="bsub">writes X = 2</text>
  <rect x="330" y="120" width="120" height="56" rx="8" fill="#2563eb"/><text x="356" y="146" class="box">Cache</text><text x="352" y="164" class="bsub">X = 2 ✓</text>
  <rect x="620" y="120" width="120" height="56" rx="8" fill="#64748b"/><text x="646" y="146" class="box">Database</text><text x="654" y="164" class="bsub">X = 2 ✓</text>

  <!-- 1 write cache -->
  <path d="M 160 140 L 328 140" stroke="#334155" stroke-width="2"/><polygon points="324,135 334,140 324,145" fill="#334155"/>
  <text x="185" y="132" class="step">1 · write to cache</text>
  <!-- 2 write db -->
  <path d="M 450 140 L 618 140" stroke="#334155" stroke-width="2"/><polygon points="614,135 624,140 614,145" fill="#334155"/>
  <text x="475" y="132" class="step">2 · write to DB (synchronously)</text>
  <!-- 3 ack back -->
  <path d="M 620 165 C 400 210, 250 210, 162 168" fill="none" stroke="#059669" stroke-width="2"/><polygon points="166,163 156,169 167,174" fill="#059669"/>
  <text x="330" y="205" class="ok">3 · both succeeded → acknowledge write</text>

  <rect x="24" y="240" width="712" height="86" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="40" y="264" class="step" fill="#2563eb">The point</text>
  <text x="40" y="286" class="note">The write isn't confirmed until <tspan font-weight="700">both</tspan> the cache and the DB have it, so they can never disagree. A read right</text>
  <text x="40" y="304" class="note">after the write is a guaranteed cache <tspan font-weight="700" fill="#059669">hit</tspan> with correct data. The cost: every write pays cache + DB latency.</text>
  <text x="40" y="320" class="note">Handle partial failure (one succeeds, one fails) so the two never drift — e.g. write the DB first, or use the cache's inline write.</text>
</svg>
