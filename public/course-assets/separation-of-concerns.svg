<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="460" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Separation of Concerns: Layers and Cross-Cutting Concerns</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Each layer handles one concern; cross-cutting concerns are handled once by infrastructure, not scattered</text>

  <defs><marker id="sc_a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs>

  <!-- Layers -->
  <text x="310" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Vertical Layers (each owns one concern)</text>

  <rect x="100" y="100" width="420" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="310" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Controller / Presentation Layer</text>
  <text x="310" y="145" text-anchor="middle" font-size="9.5" fill="#334155">HTTP handling · deserialisation · response shaping · routing</text>

  <line x1="310" y1="150" x2="310" y2="168" stroke="#475569" stroke-width="1.6" marker-end="url(#sc_a)"/>

  <rect x="100" y="170" width="420" height="50" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
  <text x="310" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Service / Application Layer</text>
  <text x="310" y="215" text-anchor="middle" font-size="9.5" fill="#334155">Business logic · orchestration · transaction boundaries · DTOs ↔ domain</text>

  <line x1="310" y1="220" x2="310" y2="238" stroke="#475569" stroke-width="1.6" marker-end="url(#sc_a)"/>

  <rect x="100" y="240" width="420" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="310" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Domain / Model Layer</text>
  <text x="310" y="285" text-anchor="middle" font-size="9.5" fill="#334155">Entities · value objects · domain rules · no framework dependency</text>

  <line x1="310" y1="290" x2="310" y2="308" stroke="#475569" stroke-width="1.6" marker-end="url(#sc_a)"/>

  <rect x="100" y="310" width="420" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="310" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Repository / Persistence Layer</text>
  <text x="310" y="355" text-anchor="middle" font-size="9.5" fill="#334155">Database access · queries · ORM mapping · caching</text>

  <!-- Cross-cutting -->
  <rect x="560" y="100" width="220" height="260" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="670" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207">Cross-Cutting</text>
  <text x="670" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207">Concerns</text>
  <text x="670" y="158" text-anchor="middle" font-size="9" fill="#7c2d12">Handled by infrastructure</text>
  <text x="670" y="172" text-anchor="middle" font-size="9" fill="#7c2d12">ONCE — not scattered</text>
  <text x="670" y="192" text-anchor="middle" font-size="9.5" fill="#334155">🔒 Security / Auth</text>
  <text x="670" y="212" text-anchor="middle" font-size="9.5" fill="#334155">📋 Logging / Tracing</text>
  <text x="670" y="232" text-anchor="middle" font-size="9.5" fill="#334155">🔄 Transactions</text>
  <text x="670" y="252" text-anchor="middle" font-size="9.5" fill="#334155">⚡ Caching</text>
  <text x="670" y="272" text-anchor="middle" font-size="9.5" fill="#334155">🔁 Retry / Circuit</text>
  <text x="670" y="292" text-anchor="middle" font-size="9.5" fill="#334155">   Breaker</text>
  <text x="670" y="316" text-anchor="middle" font-size="9" font-style="italic" fill="#7c2d12">AOP, filters, interceptors,</text>
  <text x="670" y="332" text-anchor="middle" font-size="9" font-style="italic" fill="#7c2d12">Spring annotations (@Tx,</text>
  <text x="670" y="348" text-anchor="middle" font-size="9" font-style="italic" fill="#7c2d12">@Cacheable, @PreAuthorize)</text>

  <!-- dashed cross-cut lines -->
  <line x1="558" y1="125" x2="522" y2="125" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="558" y1="195" x2="522" y2="195" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="558" y1="265" x2="522" y2="265" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="558" y1="335" x2="522" y2="335" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5 3"/>

  <rect x="100" y="378" width="680" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="440" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">The payoff of separation</text>
  <text x="440" y="420" text-anchor="middle" font-size="10.5" fill="#334155">Each layer can be changed, tested, and replaced independently. Business logic is testable without HTTP or a DB.</text>
  <text x="440" y="438" text-anchor="middle" font-size="10.5" fill="#334155">Cross-cutting behaviour is consistent — no logging or transaction code scattered through business methods.</text>
</svg>
