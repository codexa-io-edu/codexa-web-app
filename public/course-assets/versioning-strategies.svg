<svg viewBox="0 0 820 490" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="490" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Three Versioning Strategies: Tradeoffs</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">There is no universally "correct" choice — pick the one that matches your consumers and tooling</text>

  <!-- URI versioning -->
  <rect x="30" y="70" width="360" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">URI Versioning</text>
  <rect x="50" y="110" width="320" height="36" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="60" y="133" font-family="monospace" font-size="10.5" fill="#334155">GET /v1/orders/42</text>
  <text x="60" y="133" font-family="monospace" font-size="10.5" fill="#334155"/>
  <rect x="50" y="152" width="320" height="36" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="60" y="175" font-family="monospace" font-size="10.5" fill="#1d4ed8">GET /v2/orders/42</text>

  <text x="46" y="210" font-size="11" font-weight="700" fill="#1d4ed8">Pros</text>
  <text x="46" y="228" font-size="10" fill="#334155">&#10003; Visible in every URL — easy to see, test, bookmark</text>
  <text x="46" y="246" font-size="10" fill="#334155">&#10003; Simple to route at the load balancer / gateway level</text>
  <text x="46" y="264" font-size="10" fill="#334155">&#10003; Easy to document; Swagger/OpenAPI separates cleanly</text>
  <text x="46" y="282" font-size="10" fill="#334155">&#10003; Works everywhere: browsers, curl, any HTTP client</text>
  <text x="46" y="310" font-size="11" font-weight="700" fill="#b91c1c">Cons</text>
  <text x="46" y="328" font-size="10" fill="#334155">&#10007; Purists: URLs should identify resources, not versions</text>
  <text x="46" y="346" font-size="10" fill="#334155">&#10007; URL proliferation for large APIs (/v1, /v2, /v3...)</text>

  <rect x="46" y="358" width="310" height="26" rx="5" fill="#dbeafe"/>
  <text x="201" y="375" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">Most common. Use this as your default.</text>

  <!-- Header versioning -->
  <rect x="430" y="70" width="360" height="300" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="610" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Header Versioning</text>
  <rect x="450" y="110" width="320" height="50" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="460" y="130" font-family="monospace" font-size="10" fill="#334155">GET /orders/42</text>
  <text x="460" y="148" font-family="monospace" font-size="10" fill="#065f46">API-Version: 2</text>

  <rect x="450" y="168" width="320" height="50" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="460" y="188" font-family="monospace" font-size="10" fill="#334155">GET /orders/42</text>
  <text x="460" y="206" font-family="monospace" font-size="10" fill="#065f46">Accept: application/vnd.shop.v2+json</text>

  <text x="446" y="238" font-size="11" font-weight="700" fill="#047857">Pros</text>
  <text x="446" y="256" font-size="10" fill="#334155">&#10003; Clean URLs — no version clutter in the path</text>
  <text x="446" y="274" font-size="10" fill="#334155">&#10003; Semantically correct: URI identifies a resource</text>

  <text x="446" y="302" font-size="11" font-weight="700" fill="#b91c1c">Cons</text>
  <text x="446" y="320" font-size="10" fill="#334155">&#10007; Invisible — harder to test in a browser / curl</text>
  <text x="446" y="338" font-size="10" fill="#334155">&#10007; Harder to cache (cache keys don't include headers by default)</text>
  <text x="446" y="356" font-size="10" fill="#334155">&#10007; Harder to route at the infrastructure layer</text>

  <rect x="446" y="372" width="310" height="26" rx="5" fill="#dcfce7"/>
  <text x="601" y="389" text-anchor="middle" font-size="9.5" font-weight="700" fill="#047857">Good for internal/enterprise APIs.</text>

  <!-- Query param (bottom note) -->
  <rect x="200" y="388" width="420" height="86" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="410" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Query-Parameter Versioning</text>
  <text x="220" y="432" font-family="monospace" font-size="10" fill="#334155">GET /orders/42?version=2</text>
  <text x="410" y="452" text-anchor="middle" font-size="10" fill="#334155">Simple to implement. Mixes versioning with filtering. Cache-unfriendly.</text>
  <text x="410" y="468" text-anchor="middle" font-size="9.5" fill="#6d28d9">Use only in low-stakes internal scenarios — not recommended for public APIs.</text>
</svg>
