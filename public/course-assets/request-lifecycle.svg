<svg viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="620" fill="#ffffff"/>

  <!-- 1. Event -->
  <rect x="170" y="24" width="380" height="52" rx="10" fill="#1e293b"/>
  <text x="360" y="47" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Event arrives</text>
  <text x="360" y="66" text-anchor="middle" fill="#cbd5e1" font-size="12">HTTP request · file upload · timer · queue message</text>

  <line x1="360" y1="76" x2="360" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 2. Decision diamond -->
  <polygon points="360,112 500,172 360,232 220,172" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="168" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Warm environment</text>
  <text x="360" y="188" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">available?</text>

  <!-- Yes branch (left = warm) -->
  <line x1="220" y1="172" x2="140" y2="172" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="172" x2="140" y2="266" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="150" y="164" fill="#16a34a" font-size="13" font-weight="700">YES</text>

  <rect x="30" y="270" width="220" height="66" rx="10" fill="#16a34a"/>
  <text x="140" y="298" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Reuse warm env</text>
  <text x="140" y="318" text-anchor="middle" fill="#dcfce7" font-size="12">fast — no cold start</text>

  <!-- No branch (right = cold) -->
  <line x1="500" y1="172" x2="580" y2="172" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="172" x2="580" y2="266" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="540" y="164" fill="#dc2626" font-size="13" font-weight="700">NO</text>

  <rect x="470" y="270" width="220" height="66" rx="10" fill="#dc2626"/>
  <text x="580" y="292" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">COLD START</text>
  <text x="580" y="310" text-anchor="middle" fill="#fee2e2" font-size="11">create env → load code</text>
  <text x="580" y="326" text-anchor="middle" fill="#fee2e2" font-size="11">→ boot runtime → init</text>

  <!-- converge -->
  <line x1="140" y1="336" x2="140" y2="384" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="384" x2="352" y2="384" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="336" x2="580" y2="384" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="384" x2="368" y2="384" stroke="#64748b" stroke-width="2"/>
  <line x1="360" y1="384" x2="360" y2="412" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 3. Execute -->
  <rect x="190" y="416" width="340" height="56" rx="10" fill="#0891b2"/>
  <text x="360" y="440" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Execute handler</text>
  <text x="360" y="459" text-anchor="middle" fill="#cffafe" font-size="12">read / write external state (DB, storage)</text>

  <line x1="360" y1="472" x2="360" y2="500" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 4. Return -->
  <rect x="230" y="504" width="260" height="46" rx="10" fill="#0d9488"/>
  <text x="360" y="532" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Return result</text>

  <line x1="360" y1="550" x2="360" y2="574" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2)"/>

  <!-- 5. Recycle -->
  <rect x="170" y="578" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="600" text-anchor="middle" fill="#475569" font-size="12">Env kept warm briefly, then recycled when idle · billed for run time only</text>
</svg>
