<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="860" height="380" fill="#f8fafc"/>
  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The Object-Relationship Spectrum</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#64748b">Left = loose &amp; temporary connection &#8594; Right = tight ownership &amp; shared lifetime</text>

  <!-- strength arrow -->
  <defs>
    <marker id="sp" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="open" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#475569" stroke-width="1.6"/>
    </marker>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="33%" stop-color="#93c5fd"/>
      <stop offset="66%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>
  <rect x="30" y="300" width="780" height="10" rx="5" fill="url(#grad)"/>
  <line x1="30" y1="330" x2="812" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#sp)"/>
  <text x="34" y="352" font-size="12" fill="#334155">coupling / ownership increases</text>

  <!-- Card 1: Dependency -->
  <rect x="30" y="86" width="170" height="196" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Dependency</text>
  <text x="115" y="130" text-anchor="middle" font-size="11.5" fill="#64748b">"uses-a"</text>
  <!-- dashed arrow symbol -->
  <line x1="55" y1="158" x2="165" y2="158" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="115" y="188" text-anchor="middle" font-size="11" fill="#334155">A briefly uses B</text>
  <text x="115" y="206" text-anchor="middle" font-size="11" fill="#334155">(a method parameter,</text>
  <text x="115" y="222" text-anchor="middle" font-size="11" fill="#334155">a local variable)</text>
  <text x="115" y="250" text-anchor="middle" font-size="10.5" fill="#64748b">e.g. Car uses a</text>
  <text x="115" y="266" text-anchor="middle" font-size="10.5" fill="#64748b">GasStation to refuel</text>

  <!-- Card 2: Association -->
  <rect x="235" y="86" width="170" height="196" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Association</text>
  <text x="320" y="130" text-anchor="middle" font-size="11.5" fill="#2563eb">"knows-a"</text>
  <!-- solid line + open arrow -->
  <line x1="260" y1="158" x2="370" y2="158" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#open)"/>
  <text x="320" y="188" text-anchor="middle" font-size="11" fill="#1e3a8a">Two independent</text>
  <text x="320" y="204" text-anchor="middle" font-size="11" fill="#1e3a8a">objects linked;</text>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="#1e3a8a">neither owns the other</text>
  <text x="320" y="250" text-anchor="middle" font-size="10.5" fill="#3b82f6">e.g. Doctor treats</text>
  <text x="320" y="266" text-anchor="middle" font-size="10.5" fill="#3b82f6">many Patients</text>

  <!-- Card 3: Aggregation -->
  <rect x="440" y="86" width="170" height="196" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="525" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">Aggregation</text>
  <text x="525" y="130" text-anchor="middle" font-size="11.5" fill="#059669">"has-a" (weak)</text>
  <!-- solid line + hollow diamond -->
  <line x1="478" y1="158" x2="590" y2="158" stroke="#047857" stroke-width="1.8"/>
  <path d="M478,158 L466,152 L454,158 L466,164 Z" fill="#ffffff" stroke="#047857" stroke-width="1.8"/>
  <text x="525" y="188" text-anchor="middle" font-size="11" fill="#065f46">Whole has parts,</text>
  <text x="525" y="204" text-anchor="middle" font-size="11" fill="#065f46">but parts live on</text>
  <text x="525" y="220" text-anchor="middle" font-size="11" fill="#065f46">without the whole</text>
  <text x="525" y="250" text-anchor="middle" font-size="10.5" fill="#059669">e.g. Team has Players</text>
  <text x="525" y="266" text-anchor="middle" font-size="10.5" fill="#059669">(hollow diamond)</text>

  <!-- Card 4: Composition -->
  <rect x="645" y="86" width="170" height="196" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="730" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Composition</text>
  <text x="730" y="130" text-anchor="middle" font-size="11.5" fill="#dc2626">"owns-a" (strong)</text>
  <!-- solid line + filled diamond -->
  <line x1="683" y1="158" x2="795" y2="158" stroke="#b91c1c" stroke-width="1.8"/>
  <path d="M683,158 L671,152 L659,158 L671,164 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="730" y="188" text-anchor="middle" font-size="11" fill="#991b1b">Whole owns parts;</text>
  <text x="730" y="204" text-anchor="middle" font-size="11" fill="#991b1b">parts die when</text>
  <text x="730" y="220" text-anchor="middle" font-size="11" fill="#991b1b">the whole dies</text>
  <text x="730" y="250" text-anchor="middle" font-size="10.5" fill="#dc2626">e.g. House has Rooms</text>
  <text x="730" y="266" text-anchor="middle" font-size="10.5" fill="#dc2626">(filled diamond)</text>
</svg>
