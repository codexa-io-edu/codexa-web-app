<svg viewBox="0 0 800 410" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="410" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Proxy: A Stand-In That Controls Access</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748b">Same interface as the real object, so the client can't tell the difference</text>

  <defs>
    <marker id="px_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="px_tri" markerWidth="13" markerHeight="13" refX="6.5" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- shared interface -->
  <rect x="325" y="80" width="150" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">«interface» Image</text>
  <text x="400" y="116" text-anchor="middle" font-size="9.5" fill="#3730a3" font-family="monospace">display()</text>

  <!-- client -->
  <rect x="40" y="180" width="130" height="56" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Client</text>
  <text x="105" y="224" text-anchor="middle" font-size="9" fill="#1e3a8a">sees only Image</text>

  <!-- proxy -->
  <rect x="300" y="170" width="200" height="80" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2.4"/>
  <text x="400" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">ImageProxy</text>
  <text x="400" y="214" text-anchor="middle" font-size="9.5" fill="#0891b2">checks / defers / caches,</text>
  <text x="400" y="230" text-anchor="middle" font-size="9.5" fill="#0891b2">then delegates &#8594;</text>

  <!-- real subject -->
  <rect x="620" y="170" width="150" height="80" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="695" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">RealImage</text>
  <text x="695" y="214" text-anchor="middle" font-size="9" fill="#065f46">heavy: loads from disk</text>
  <text x="695" y="230" text-anchor="middle" font-size="9" fill="#065f46">the real work</text>

  <line x1="170" y1="208" x2="298" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#px_arr)"/>
  <line x1="500" y1="208" x2="618" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#px_arr)"/>
  <text x="559" y="199" text-anchor="middle" font-size="9" fill="#64748b">delegates</text>

  <!-- both implement interface -->
  <line x1="400" y1="170" x2="400" y2="126" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#px_tri)"/>
  <line x1="695" y1="170" x2="470" y2="126" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#px_tri)"/>

  <!-- variants -->
  <rect x="60" y="300" width="680" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="322" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Four common kinds of proxy</text>
  <text x="80" y="346" font-size="11" fill="#0e7490" font-weight="700">Virtual:</text><text x="150" y="346" font-size="11" fill="#334155">delay creating a heavy object until first use (lazy)</text>
  <text x="80" y="366" font-size="11" fill="#0e7490" font-weight="700">Protection:</text><text x="165" y="366" font-size="11" fill="#334155">allow the call only if the caller has permission</text>
  <text x="440" y="346" font-size="11" fill="#0e7490" font-weight="700">Remote:</text><text x="510" y="346" font-size="11" fill="#334155">stand in for an object in another process/host</text>
  <text x="440" y="366" font-size="11" fill="#0e7490" font-weight="700">Caching:</text><text x="512" y="366" font-size="11" fill="#334155">return stored results instead of recomputing</text>
</svg>
