<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Anatomy of a Sequence Diagram</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Participants across the top, time flowing DOWN, messages as arrows between lifelines</text>

  <defs>
    <marker id="sq_solid" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="sq_open" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#334155" stroke-width="1.5"/></marker>
  </defs>

  <!-- participants -->
  <rect x="60" y="72" width="90" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="105" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">:Client</text>
  <rect x="340" y="72" width="110" height="34" rx="4" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/><text x="395" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">:OrderService</text>
  <rect x="640" y="72" width="100" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="690" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">:Repository</text>

  <!-- lifelines -->
  <line x1="105" y1="106" x2="105" y2="450" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="395" y1="106" x2="395" y2="450" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="690" y1="106" x2="690" y2="450" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- activation bars -->
  <rect x="99" y="140" width="12" height="250" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="389" y="160" width="12" height="200" fill="#dcfce7" stroke="#059669" stroke-width="1.2"/>
  <rect x="684" y="210" width="12" height="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>

  <!-- msg 1: synchronous call -->
  <line x1="111" y1="160" x2="389" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#sq_solid)"/>
  <text x="250" y="153" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">placeOrder(cart)</text>

  <!-- msg 2: sync call to repo -->
  <line x1="401" y1="210" x2="684" y2="210" stroke="#334155" stroke-width="1.6" marker-end="url(#sq_solid)"/>
  <text x="543" y="203" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">save(order)</text>

  <!-- return from repo -->
  <line x1="684" y1="278" x2="401" y2="278" stroke="#334155" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#sq_open)"/>
  <text x="543" y="272" text-anchor="middle" font-size="9.5" fill="#64748b" font-family="monospace">orderId</text>

  <!-- self message -->
  <path d="M401,310 C440,310 440,335 403,335" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#sq_solid)"/>
  <text x="470" y="322" font-size="9.5" fill="#334155" font-family="monospace">sendConfirmation()</text>

  <!-- return to client -->
  <line x1="389" y1="388" x2="111" y2="388" stroke="#334155" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#sq_open)"/>
  <text x="250" y="382" text-anchor="middle" font-size="9.5" fill="#64748b" font-family="monospace">confirmation</text>

  <!-- labels -->
  <text x="120" y="128" font-size="9" font-weight="700" fill="#1d4ed8">activation bar</text>
  <line x1="118" y1="132" x2="108" y2="142" stroke="#1d4ed8" stroke-width="1"/>
  <text x="150" y="176" font-size="9" font-weight="700" fill="#dc2626">synchronous call (solid arrow, filled head)</text>
  <text x="150" y="294" font-size="9" font-weight="700" fill="#b45309">return (dashed, open head)</text>
  <text x="500" y="340" font-size="9" font-weight="700" fill="#047857">self-message</text>

  <rect x="60" y="410" width="700" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="430" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">The building blocks</text>
  <text x="410" y="450" text-anchor="middle" font-size="9.5" fill="#334155">Lifeline (dashed vertical line = an object over time) &#8226; Activation bar (rectangle = the object is doing work)</text>
  <text x="410" y="468" text-anchor="middle" font-size="9.5" fill="#334155">Solid arrow = call &#8226; Dashed arrow = return &#8226; Time always flows top &#8594; bottom</text>
</svg>
