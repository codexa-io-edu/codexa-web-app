<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #64748b; }
    .lbl { font-size: 10px; font-weight: 700; fill: #1e293b; }
    .tag { font-size: 9px; font-weight: 700; fill: #dc2626; }
  </style>

  <text x="24" y="30" class="title">Dead-lettering and the TTL-based retry pattern</text>

  <!-- main queue -->
  <rect x="40" y="80" width="140" height="44" rx="8" fill="#059669"/><text x="110" y="102" text-anchor="middle" class="box">main queue</text><text x="110" y="117" text-anchor="middle" class="note" fill="#dcfce7">consumer works here</text>

  <!-- consumer -->
  <rect x="40" y="160" width="140" height="34" rx="6" fill="#2563eb"/><text x="110" y="182" text-anchor="middle" class="box">consumer</text>
  <line x1="110" y1="124" x2="110" y2="158" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- reasons -->
  <text x="200" y="96" class="tag">a message is dead-lettered when:</text>
  <text x="210" y="112" class="note">• consumer sends basic.reject / basic.nack with requeue=false</text>
  <text x="210" y="128" class="note">• message TTL expires  • queue length limit exceeded</text>

  <!-- DLX -->
  <rect x="330" y="160" width="120" height="44" rx="8" fill="#d97706"/><text x="390" y="182" text-anchor="middle" class="box">Dead Letter</text><text x="390" y="197" text-anchor="middle" class="box">Exchange</text>
  <line x1="180" y1="178" x2="328" y2="180" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/><text x="210" y="172" class="tag">dead-letter</text>

  <!-- retry (delay) queue -->
  <rect x="330" y="250" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="405" y="272" text-anchor="middle" class="lbl">retry queue</text><text x="405" y="290" text-anchor="middle" class="note">message-ttl = 30s, then</text><text x="405" y="302" text-anchor="middle" class="note">dead-letters back to main</text>
  <line x1="390" y1="204" x2="400" y2="248" stroke="#d97706" stroke-width="1.6" marker-end="url(#o)"/>

  <!-- back to main -->
  <path d="M 330 278 C 220 278, 150 200, 110 126" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#g)"/>
  <text x="150" y="250" class="note">after the delay, retried</text>

  <!-- terminal DLQ -->
  <rect x="560" y="160" width="200" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/><text x="660" y="182" text-anchor="middle" class="lbl">dead-letter queue (parking)</text><text x="660" y="200" text-anchor="middle" class="note">give up after N retries →</text>
  <line x1="480" y1="182" x2="558" y2="184" stroke="#dc2626" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="490" y="176" class="tag">max retries</text>

  <!-- footer -->
  <rect x="24" y="330" width="752" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="352" class="note">RabbitMQ has no native "retry after delay". The idiom: dead-letter a failed message to a <tspan font-weight="700">retry queue</tspan> that has a TTL and no</text>
  <text x="40" y="370" class="note">consumer; when its TTL expires it dead-letters <tspan font-weight="700">back</tspan> to the main queue. Track an attempts header and park in a terminal DLQ after N tries.</text>
  <text x="40" y="386" class="note">(The Delayed Message Exchange plugin offers a direct alternative.)</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  </defs>
</svg>
