<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">The Design Pattern Landscape</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" fill="#64748b">Every classic pattern falls into one of three families by the kind of problem it solves</text>

  <!-- ===== Creational ===== -->
  <rect x="30" y="95" width="250" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="155" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Creational</text>
  <text x="155" y="146" text-anchor="middle" font-size="11.5" fill="#1e40af">How objects are</text>
  <text x="155" y="163" text-anchor="middle" font-size="11.5" fill="#1e40af">created &amp; instantiated</text>
  <line x1="50" y1="176" x2="260" y2="176" stroke="#93c5fd" stroke-width="1.5"/>
  <g font-size="12.5" fill="#1e3a8a">
    <rect x="45" y="190" width="220" height="27" rx="6" fill="#dbeafe"/><text x="155" y="208" text-anchor="middle">Singleton</text>
    <rect x="45" y="223" width="220" height="27" rx="6" fill="#dbeafe"/><text x="155" y="241" text-anchor="middle">Factory Method</text>
    <rect x="45" y="256" width="220" height="27" rx="6" fill="#dbeafe"/><text x="155" y="274" text-anchor="middle">Abstract Factory</text>
    <rect x="45" y="289" width="220" height="27" rx="6" fill="#dbeafe"/><text x="155" y="307" text-anchor="middle">Builder</text>
    <rect x="45" y="322" width="220" height="27" rx="6" fill="#dbeafe"/><text x="155" y="340" text-anchor="middle">Prototype</text>
  </g>

  <!-- ===== Structural ===== -->
  <rect x="305" y="95" width="250" height="330" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2.5"/>
  <text x="430" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#047857">Structural</text>
  <text x="430" y="146" text-anchor="middle" font-size="11.5" fill="#065f46">How objects are composed</text>
  <text x="430" y="163" text-anchor="middle" font-size="11.5" fill="#065f46">into larger structures</text>
  <line x1="325" y1="176" x2="535" y2="176" stroke="#86efac" stroke-width="1.5"/>
  <g font-size="12.5" fill="#065f46">
    <rect x="320" y="190" width="220" height="27" rx="6" fill="#dcfce7"/><text x="430" y="208" text-anchor="middle">Adapter</text>
    <rect x="320" y="223" width="220" height="27" rx="6" fill="#dcfce7"/><text x="430" y="241" text-anchor="middle">Bridge</text>
    <rect x="320" y="256" width="220" height="27" rx="6" fill="#dcfce7"/><text x="430" y="274" text-anchor="middle">Decorator</text>
    <rect x="320" y="289" width="220" height="27" rx="6" fill="#dcfce7"/><text x="430" y="307" text-anchor="middle">Facade</text>
    <rect x="320" y="322" width="220" height="27" rx="6" fill="#dcfce7"/><text x="430" y="340" text-anchor="middle">Proxy</text>
  </g>

  <!-- ===== Behavioral ===== -->
  <rect x="580" y="95" width="250" height="330" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
  <text x="705" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">Behavioral</text>
  <text x="705" y="146" text-anchor="middle" font-size="11.5" fill="#7c2d12">How objects interact &amp;</text>
  <text x="705" y="163" text-anchor="middle" font-size="11.5" fill="#7c2d12">share responsibility</text>
  <line x1="600" y1="176" x2="810" y2="176" stroke="#fdba74" stroke-width="1.5"/>
  <g font-size="12.5" fill="#7c2d12">
    <rect x="595" y="190" width="220" height="27" rx="6" fill="#ffedd5"/><text x="705" y="208" text-anchor="middle">Strategy</text>
    <rect x="595" y="223" width="220" height="27" rx="6" fill="#ffedd5"/><text x="705" y="241" text-anchor="middle">Observer</text>
    <rect x="595" y="256" width="220" height="27" rx="6" fill="#ffedd5"/><text x="705" y="274" text-anchor="middle">Command</text>
    <rect x="595" y="289" width="220" height="27" rx="6" fill="#ffedd5"/><text x="705" y="307" text-anchor="middle">State</text>
    <rect x="595" y="322" width="220" height="27" rx="6" fill="#ffedd5"/><text x="705" y="340" text-anchor="middle">Template Method</text>
    <rect x="595" y="355" width="220" height="27" rx="6" fill="#ffedd5"/><text x="705" y="373" text-anchor="middle">Chain of Responsibility</text>
  </g>

  <text x="430" y="452" text-anchor="middle" font-size="12" fill="#334155">Ask: is my problem about <tspan font-weight="700" fill="#1d4ed8">creating</tspan>, <tspan font-weight="700" fill="#047857">structuring</tspan>, or <tspan font-weight="700" fill="#b45309">coordinating</tspan> objects? That picks the family.</text>
</svg>
