<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Race Conditions &amp; Synchronization</text>
  <text x="410" y="63" text-anchor="middle" font-size="13" fill="#64748b">The clinician's view: understand the disease, learn to detect it, then apply the right cure</text>

  <defs>
    <marker id="ov_arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Anatomy -->
  <rect x="40" y="96" width="740" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="56" y="112" width="190" height="58" rx="8" fill="#dc2626"/>
  <text x="151" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1 · Anatomy of a</text>
  <text x="151" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Race Condition</text>
  <text x="262" y="130" font-size="13" font-weight="700" fill="#b91c1c">What exactly goes wrong, at the instruction level.</text>
  <text x="262" y="151" font-size="11.5" fill="#334155">Read-modify-write and check-then-act, the bad interleavings, atomicity vs visibility,</text>
  <text x="262" y="168" font-size="11.5" fill="#334155">and why "it worked on my machine" is the signature of a race.</text>

  <line x1="410" y1="186" x2="410" y2="204" stroke="#94a3b8" stroke-width="2" marker-end="url(#ov_arr)"/>

  <!-- Detecting -->
  <rect x="40" y="206" width="740" height="90" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="56" y="222" width="190" height="58" rx="8" fill="#d97706"/>
  <text x="151" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2 · Detecting &amp;</text>
  <text x="151" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Reproducing</text>
  <text x="262" y="240" font-size="13" font-weight="700" fill="#b45309">Finding a bug that hides from you by design.</text>
  <text x="262" y="261" font-size="11.5" fill="#334155">Why races are non-deterministic and slip past normal tests; code review red flags,</text>
  <text x="262" y="278" font-size="11.5" fill="#334155">stress/concurrency testing, thread sanitizers and static analysis.</text>

  <line x1="410" y1="296" x2="410" y2="314" stroke="#94a3b8" stroke-width="2" marker-end="url(#ov_arr)"/>

  <!-- Fixing -->
  <rect x="40" y="316" width="740" height="90" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="56" y="332" width="190" height="58" rx="8" fill="#059669"/>
  <text x="151" y="357" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3 · Fixing &amp;</text>
  <text x="151" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Preventing</text>
  <text x="262" y="350" font-size="13" font-weight="700" fill="#047857">Choosing the right cure — and not creating new bugs.</text>
  <text x="262" y="371" font-size="11.5" fill="#334155">Match the fix to the race: atomics, correct locking, immutability, confinement;</text>
  <text x="262" y="388" font-size="11.5" fill="#334155">compound-action traps, and how over-fixing causes deadlock or kills throughput.</text>
</svg>
