<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Mutex: One Key, One Thread in the Critical Section</text>

  <defs>
    <marker id="mx_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- threads waiting -->
  <text x="120" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Threads competing</text>
  <rect x="50" y="96" width="140" height="40" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="120" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Thread A (holds key)</text>

  <rect x="50" y="150" width="140" height="38" rx="8" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="120" y="174" text-anchor="middle" font-size="11.5" fill="#64748b">Thread B — waiting</text>
  <rect x="50" y="200" width="140" height="38" rx="8" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="120" y="224" text-anchor="middle" font-size="11.5" fill="#64748b">Thread C — waiting</text>
  <rect x="50" y="250" width="140" height="38" rx="8" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="120" y="274" text-anchor="middle" font-size="11.5" fill="#64748b">Thread D — waiting</text>

  <!-- the lock / key -->
  <circle cx="330" cy="116" r="34" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
  <text x="330" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">MUTEX</text>
  <text x="330" y="126" text-anchor="middle" font-size="9" fill="#7c2d12">1 key only</text>

  <line x1="190" y1="116" x2="294" y2="116" stroke="#059669" stroke-width="2.4" marker-end="url(#mx_arr)"/>
  <text x="242" y="106" text-anchor="middle" font-size="9.5" fill="#047857">acquire()</text>

  <!-- critical section -->
  <rect x="430" y="70" width="320" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
  <text x="590" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Critical Section</text>
  <text x="590" y="116" text-anchor="middle" font-size="10.5" fill="#991b1b">the shared mutable state</text>
  <rect x="470" y="130" width="240" height="60" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="590" y="154" text-anchor="middle" font-size="11" fill="#991b1b" font-family="monospace">balance += amount;</text>
  <text x="590" y="174" text-anchor="middle" font-size="9.5" fill="#dc2626">only the key-holder may enter</text>

  <line x1="364" y1="116" x2="428" y2="140" stroke="#059669" stroke-width="2.4" marker-end="url(#mx_arr)"/>

  <!-- release cycle -->
  <path d="M590,220 C590,300 330,300 330,152" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mx_arr)"/>
  <text x="455" y="300" text-anchor="middle" font-size="10.5" fill="#1d4ed8">release() &#8594; next waiting thread gets the key</text>

  <rect x="120" y="336" width="560" height="60" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="400" y="358" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Serialization is the point AND the cost:</text>
  <text x="400" y="377" text-anchor="middle" font-size="10.5" fill="#7c2d12">correctness is guaranteed, but threads queue up — keep the critical section as small as possible.</text>
</svg>
