<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">API Design Fundamentals</text>
  <text x="410" y="63" text-anchor="middle" font-size="13" fill="#64748b">How independent systems talk to each other &#8212; the contract that outlives any single implementation</text>

  <defs><marker id="ov_a" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs>

  <!-- REST -->
  <rect x="40" y="96" width="740" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="56" y="112" width="200" height="60" rx="8" fill="#2563eb"/>
  <text x="156" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1 &#183; REST API</text>
  <text x="156" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Design</text>
  <text x="272" y="130" font-size="13" font-weight="700" fill="#1d4ed8">The architectural style: resources, HTTP methods, status codes, statelessness.</text>
  <text x="272" y="151" font-size="11.5" fill="#334155">The six REST constraints, why HTTP verbs map to CRUD, idempotency and safety,</text>
  <text x="272" y="169" font-size="11.5" fill="#334155">and the Richardson Maturity Model from RPC-over-HTTP to true hypermedia.</text>

  <line x1="410" y1="188" x2="410" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#ov_a)"/>

  <!-- Resource Modeling -->
  <rect x="40" y="208" width="740" height="92" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="56" y="224" width="200" height="60" rx="8" fill="#059669"/>
  <text x="156" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2 &#183; Resource</text>
  <text x="156" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Modeling</text>
  <text x="272" y="242" font-size="13" font-weight="700" fill="#047857">Turning a domain into well-shaped URLs: nouns, collections, hierarchy.</text>
  <text x="272" y="263" font-size="11.5" fill="#334155">Identifying resources, naming conventions, nesting &amp; relationships, sub-resources,</text>
  <text x="272" y="281" font-size="11.5" fill="#334155">filtering/sorting/pagination, and modeling actions that aren't CRUD.</text>

  <line x1="410" y1="300" x2="410" y2="318" stroke="#94a3b8" stroke-width="2" marker-end="url(#ov_a)"/>

  <!-- Standards -->
  <rect x="40" y="320" width="740" height="92" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="56" y="336" width="200" height="60" rx="8" fill="#d97706"/>
  <text x="156" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3 &#183; Standards &amp;</text>
  <text x="156" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Best Practices</text>
  <text x="272" y="354" font-size="13" font-weight="700" fill="#b45309">The conventions that make an API predictable, robust, and pleasant.</text>
  <text x="272" y="375" font-size="11.5" fill="#334155">Consistency, error formats, HATEOAS, content negotiation, security basics, docs</text>
  <text x="272" y="393" font-size="11.5" fill="#334155">(OpenAPI), rate limiting &#8212; the polish that separates a good API from a bad one.</text>
</svg>
