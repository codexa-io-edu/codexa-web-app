<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">The Three Hazards Thread-Safe Design Must Defeat</text>

  <!-- Atomicity -->
  <rect x="30" y="66" width="250" height="330" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="155" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">1 · Atomicity</text>
  <text x="155" y="112" text-anchor="middle" font-size="10.5" fill="#991b1b">an operation isn't indivisible</text>

  <text x="50" y="140" font-size="10.5" fill="#334155" font-family="monospace">count++  really means:</text>
  <rect x="50" y="150" width="210" height="24" rx="4" fill="#fee2e2"/><text x="60" y="167" font-size="10" fill="#991b1b" font-family="monospace">1. read count</text>
  <rect x="50" y="178" width="210" height="24" rx="4" fill="#fee2e2"/><text x="60" y="195" font-size="10" fill="#991b1b" font-family="monospace">2. add 1</text>
  <rect x="50" y="206" width="210" height="24" rx="4" fill="#fee2e2"/><text x="60" y="223" font-size="10" fill="#991b1b" font-family="monospace">3. write count</text>

  <text x="155" y="258" text-anchor="middle" font-size="10" fill="#334155">Two threads interleave &#8594;</text>
  <text x="155" y="274" text-anchor="middle" font-size="10" fill="#334155">both read 5, both write 6.</text>
  <text x="155" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">One increment lost.</text>

  <rect x="50" y="316" width="210" height="66" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.3"/>
  <text x="155" y="338" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">Fix with:</text>
  <text x="155" y="356" text-anchor="middle" font-size="10" fill="#334155">atomic ops, locks, or</text>
  <text x="155" y="371" text-anchor="middle" font-size="10" fill="#334155">immutability (no writes)</text>

  <!-- Visibility -->
  <rect x="290" y="66" width="240" height="330" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">2 · Visibility</text>
  <text x="410" y="112" text-anchor="middle" font-size="10.5" fill="#7c2d12">a write may never be seen</text>

  <rect x="310" y="132" width="90" height="60" rx="6" fill="#ffedd5" stroke="#d97706"/>
  <text x="355" y="156" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Thread A</text>
  <text x="355" y="174" text-anchor="middle" font-size="9" fill="#7c2d12">writes flag=true</text>
  <text x="355" y="186" text-anchor="middle" font-size="8.5" fill="#7c2d12">(to its cache)</text>

  <rect x="420" y="132" width="90" height="60" rx="6" fill="#ffedd5" stroke="#d97706"/>
  <text x="465" y="156" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Thread B</text>
  <text x="465" y="174" text-anchor="middle" font-size="9" fill="#7c2d12">still sees flag=false</text>
  <text x="465" y="186" text-anchor="middle" font-size="8.5" fill="#7c2d12">(stale cache)</text>

  <text x="410" y="222" text-anchor="middle" font-size="10" fill="#334155">Each core caches values.</text>
  <text x="410" y="238" text-anchor="middle" font-size="10" fill="#334155">Without a memory barrier,</text>
  <text x="410" y="254" text-anchor="middle" font-size="10" fill="#334155">B may loop forever on a</text>
  <text x="410" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">stale copy of flag.</text>

  <rect x="310" y="316" width="200" height="66" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.3"/>
  <text x="410" y="338" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Fix with:</text>
  <text x="410" y="356" text-anchor="middle" font-size="10" fill="#334155">volatile, locks, or</text>
  <text x="410" y="371" text-anchor="middle" font-size="10" fill="#334155">final fields (immutability)</text>

  <!-- Ordering -->
  <rect x="540" y="66" width="250" height="330" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="665" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">3 · Ordering</text>
  <text x="665" y="112" text-anchor="middle" font-size="10.5" fill="#6d28d9">instructions get reordered</text>

  <text x="560" y="140" font-size="10" fill="#334155" font-family="monospace">you wrote:</text>
  <rect x="560" y="148" width="210" height="22" rx="4" fill="#ede9fe"/><text x="570" y="164" font-size="9.5" fill="#6d28d9" font-family="monospace">data = compute();  // 1</text>
  <rect x="560" y="172" width="210" height="22" rx="4" fill="#ede9fe"/><text x="570" y="188" font-size="9.5" fill="#6d28d9" font-family="monospace">ready = true;      // 2</text>

  <text x="560" y="222" font-size="10" fill="#334155" font-family="monospace">CPU/compiler may run:</text>
  <rect x="560" y="230" width="210" height="22" rx="4" fill="#ddd6fe"/><text x="570" y="246" font-size="9.5" fill="#6d28d9" font-family="monospace">ready = true;      // 2 first!</text>
  <rect x="560" y="254" width="210" height="22" rx="4" fill="#ddd6fe"/><text x="570" y="270" font-size="9.5" fill="#6d28d9" font-family="monospace">data = compute();  // 1</text>

  <text x="665" y="298" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">Another thread sees</text>
  <text x="665" y="312" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">ready=true, data=null.</text>

  <rect x="560" y="326" width="210" height="56" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="665" y="348" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">Fix with:</text>
  <text x="665" y="366" text-anchor="middle" font-size="10" fill="#334155">happens-before (volatile,</text>
  <text x="665" y="379" text-anchor="middle" font-size="9.5" fill="#334155">locks, final) — see JMM</text>
</svg>
