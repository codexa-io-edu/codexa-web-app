<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Compare-And-Swap (CAS): Lock-Free Optimism in One Instruction</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748b">The hardware primitive behind AtomicInteger and most optimistic concurrency</text>

  <defs>
    <marker id="cas_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="cas_red" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="100" width="180" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">1. Read current</text>
  <text x="150" y="146" text-anchor="middle" font-size="10.5" fill="#334155" font-family="monospace">expected = count (5)</text>
  <text x="150" y="162" text-anchor="middle" font-size="9.5" fill="#64748b">no lock taken</text>

  <!-- step 2 -->
  <rect x="310" y="100" width="180" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">2. Compute next</text>
  <text x="400" y="146" text-anchor="middle" font-size="10.5" fill="#334155" font-family="monospace">next = 5 + 1 = 6</text>

  <!-- step 3 -->
  <rect x="560" y="100" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">3. CAS(expected, next)</text>
  <text x="660" y="140" text-anchor="middle" font-size="9.5" fill="#1e3a8a">atomically, in ONE instruction:</text>
  <text x="660" y="156" text-anchor="middle" font-size="9" fill="#334155">"if count still == 5, set it to 6"</text>

  <line x1="240" y1="135" x2="308" y2="135" stroke="#475569" stroke-width="1.8" marker-end="url(#cas_arr)"/>
  <line x1="490" y1="135" x2="558" y2="135" stroke="#475569" stroke-width="1.8" marker-end="url(#cas_arr)"/>

  <!-- success -->
  <rect x="560" y="220" width="200" height="56" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="660" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">SUCCESS</text>
  <text x="660" y="262" text-anchor="middle" font-size="9.5" fill="#065f46">no other thread changed it — done</text>
  <line x1="660" y1="170" x2="660" y2="218" stroke="#059669" stroke-width="1.8" marker-end="url(#cas_arr)"/>
  <text x="690" y="198" font-size="9.5" fill="#047857">match</text>

  <!-- failure / retry -->
  <rect x="300" y="300" width="360" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="323" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">FAIL — someone else changed count first</text>
  <text x="480" y="342" text-anchor="middle" font-size="9.5" fill="#991b1b">discard 'next', re-read the new value, and try again (spin)</text>
  <path d="M600,276 C600,300 660,300 660,300" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="620" y1="290" x2="300" y2="255" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#cas_red)"/>
  <path d="M300,328 C120,328 150,135 58,135" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#cas_red)"/>
  <text x="150" y="300" text-anchor="middle" font-size="9.5" fill="#b91c1c">retry the whole loop</text>

  <text x="400" y="386" text-anchor="middle" font-size="11" fill="#334155">No thread ever blocks — a failed thread just retries. This is "non-blocking" / "lock-free" concurrency.</text>
</svg>
