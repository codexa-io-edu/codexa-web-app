<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .box { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .lbl { font-size: 10px; fill: #64748b; }
    .key { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">One idea, two directions: which side does the proxy stand in for?</text>

  <!-- FORWARD panel -->
  <rect x="24" y="46" width="370" height="380" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="24" y="46" width="370" height="38" rx="10" fill="#2563eb"/>
  <text x="44" y="71" class="h">Forward proxy — stands in for the CLIENT</text>

  <!-- clients grouped -->
  <rect x="44" y="104" width="120" height="150" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="104" y="122" text-anchor="middle" class="lbl">your network</text>
  <rect x="58" y="132" width="92" height="26" rx="5" fill="#64748b"/><text x="104" y="150" text-anchor="middle" class="box">client</text>
  <rect x="58" y="164" width="92" height="26" rx="5" fill="#64748b"/><text x="104" y="182" text-anchor="middle" class="box">client</text>
  <rect x="58" y="196" width="92" height="26" rx="5" fill="#64748b"/><text x="104" y="214" text-anchor="middle" class="box">client</text>

  <!-- forward proxy -->
  <rect x="190" y="150" width="70" height="58" rx="8" fill="#2563eb"/><text x="225" y="175" text-anchor="middle" class="box">fwd</text><text x="225" y="192" text-anchor="middle" class="box">proxy</text>
  <line x1="164" y1="179" x2="188" y2="179" stroke="#94a3b8" stroke-width="2"/>

  <!-- internet + servers -->
  <ellipse cx="330" cy="179" rx="42" ry="30" fill="#cbd5e1"/><text x="330" y="183" text-anchor="middle" class="lbl">internet</text>
  <line x1="260" y1="179" x2="288" y2="179" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="240" width="80" height="26" rx="5" fill="#059669"/><text x="340" y="258" text-anchor="middle" class="box">any site</text>
  <line x1="330" y1="209" x2="340" y2="238" stroke="#94a3b8" stroke-width="2"/>

  <text x="44" y="300" class="key">The destination sees the proxy's IP,</text>
  <text x="44" y="318" class="key">not the client's.</text>
  <text x="44" y="344" class="lbl">Used by clients to reach the outside world:</text>
  <text x="44" y="362" class="lbl">corporate filtering, egress logging, shared</text>
  <text x="44" y="380" class="lbl">caching, anonymity. e.g. Squid, Zscaler.</text>

  <!-- REVERSE panel -->
  <rect x="406" y="46" width="370" height="380" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="406" y="46" width="370" height="38" rx="10" fill="#7c3aed"/>
  <text x="426" y="71" class="h">Reverse proxy — stands in for the SERVER</text>

  <!-- clients (internet) -->
  <rect x="426" y="132" width="80" height="26" rx="5" fill="#64748b"/><text x="466" y="150" text-anchor="middle" class="box">client</text>
  <rect x="426" y="164" width="80" height="26" rx="5" fill="#64748b"/><text x="466" y="182" text-anchor="middle" class="box">client</text>
  <rect x="426" y="196" width="80" height="26" rx="5" fill="#64748b"/><text x="466" y="214" text-anchor="middle" class="box">client</text>
  <text x="466" y="120" text-anchor="middle" class="lbl">internet</text>

  <!-- reverse proxy -->
  <rect x="540" y="150" width="70" height="58" rx="8" fill="#7c3aed"/><text x="575" y="175" text-anchor="middle" class="box">rev</text><text x="575" y="192" text-anchor="middle" class="box">proxy</text>
  <line x1="506" y1="150" x2="538" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <line x1="506" y1="179" x2="538" y2="179" stroke="#94a3b8" stroke-width="2"/>
  <line x1="506" y1="208" x2="538" y2="186" stroke="#94a3b8" stroke-width="2"/>

  <!-- backends grouped -->
  <rect x="640" y="120" width="120" height="120" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="700" y="138" text-anchor="middle" class="lbl">your servers</text>
  <rect x="654" y="148" width="92" height="24" rx="5" fill="#059669"/><text x="700" y="165" text-anchor="middle" class="box">server 1</text>
  <rect x="654" y="178" width="92" height="24" rx="5" fill="#059669"/><text x="700" y="195" text-anchor="middle" class="box">server 2</text>
  <rect x="654" y="208" width="92" height="24" rx="5" fill="#059669"/><text x="700" y="225" text-anchor="middle" class="box">server 3</text>
  <line x1="610" y1="172" x2="652" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="179" x2="652" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="186" x2="652" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <text x="426" y="300" class="key">The client sees the proxy's address,</text>
  <text x="426" y="318" class="key">not the real servers behind it.</text>
  <text x="426" y="344" class="lbl">Used in front of servers: load balancing,</text>
  <text x="426" y="362" class="lbl">TLS termination, caching, routing, security.</text>
  <text x="426" y="380" class="lbl">e.g. NGINX, Envoy, HAProxy, Cloudflare.</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
