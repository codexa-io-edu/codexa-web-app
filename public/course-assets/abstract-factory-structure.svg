<svg viewBox="0 0 820 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="450" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Abstract Factory: One Factory Makes a Matching Family</text>

  <defs>
    <marker id="af_tri" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
    </marker>
    <marker id="af_dash" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#d97706" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Abstract factory -->
  <rect x="300" y="72" width="230" height="72" rx="10" fill="#ffedd5" stroke="#d97706" stroke-width="2.4"/>
  <text x="415" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">GUIFactory (interface)</text>
  <text x="415" y="116" text-anchor="middle" font-size="10.5" fill="#7c2d12" font-family="monospace">createButton()</text>
  <text x="415" y="132" text-anchor="middle" font-size="10.5" fill="#7c2d12" font-family="monospace">createCheckbox()</text>

  <!-- concrete factories -->
  <rect x="150" y="200" width="180" height="66" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="240" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">WindowsFactory</text>
  <text x="240" y="248" text-anchor="middle" font-size="9.5" fill="#7c2d12">makes Windows widgets</text>

  <rect x="500" y="200" width="180" height="66" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="590" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">MacFactory</text>
  <text x="590" y="248" text-anchor="middle" font-size="9.5" fill="#7c2d12">makes macOS widgets</text>

  <line x1="240" y1="200" x2="360" y2="144" stroke="#475569" stroke-width="1.5" marker-end="url(#af_tri)"/>
  <line x1="590" y1="200" x2="470" y2="144" stroke="#475569" stroke-width="1.5" marker-end="url(#af_tri)"/>

  <!-- product families -->
  <!-- Button family -->
  <rect x="150" y="330" width="180" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="240" y="357" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">WinButton / MacButton</text>
  <!-- Checkbox family -->
  <rect x="150" y="384" width="180" height="44" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
  <text x="240" y="411" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">WinCheckbox / MacCheckbox</text>

  <rect x="500" y="330" width="180" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="590" y="357" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">«interface» Button</text>
  <rect x="500" y="384" width="180" height="44" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
  <text x="590" y="411" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">«interface» Checkbox</text>

  <line x1="240" y1="330" x2="240" y2="270" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#af_dash)"/>
  <line x1="590" y1="330" x2="590" y2="270" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#af_dash)"/>

  <text x="415" y="300" text-anchor="middle" font-size="11.5" fill="#334155">Pick ONE factory at startup — you can never accidentally mix a WinButton with a MacCheckbox.</text>
  <text x="415" y="440" text-anchor="middle" font-size="11" fill="#64748b">Factory Method makes ONE product; Abstract Factory makes a whole coordinated SET of products.</text>
</svg>
