<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Why Races Hide: Most Interleavings Are Fine</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">The bug only appears for specific, rare timing windows — so tests usually pass</text>

  <!-- many good runs -->
  <text x="140" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Most runs: no overlap</text>
  <g>
    <rect x="60" y="106" width="160" height="26" rx="5" fill="#dcfce7" stroke="#059669"/><text x="140" y="124" text-anchor="middle" font-size="10" fill="#047857">A finishes, then B &#8594; 7 &#10003;</text>
    <rect x="60" y="138" width="160" height="26" rx="5" fill="#dcfce7" stroke="#059669"/><text x="140" y="156" text-anchor="middle" font-size="10" fill="#047857">B finishes, then A &#8594; 7 &#10003;</text>
    <rect x="60" y="170" width="160" height="26" rx="5" fill="#dcfce7" stroke="#059669"/><text x="140" y="188" text-anchor="middle" font-size="10" fill="#047857">A, then B &#8594; 7 &#10003;</text>
    <rect x="60" y="202" width="160" height="26" rx="5" fill="#dcfce7" stroke="#059669"/><text x="140" y="220" text-anchor="middle" font-size="10" fill="#047857">... thousands more &#10003;</text>
  </g>

  <!-- rare bad run -->
  <text x="410" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Rare run: exact overlap</text>
  <rect x="300" y="106" width="220" height="122" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="132" text-anchor="middle" font-size="10.5" fill="#991b1b" font-family="monospace">A reads 5</text>
  <text x="410" y="152" text-anchor="middle" font-size="10.5" fill="#991b1b" font-family="monospace">B reads 5</text>
  <text x="410" y="172" text-anchor="middle" font-size="10.5" fill="#991b1b" font-family="monospace">A writes 6</text>
  <text x="410" y="192" text-anchor="middle" font-size="10.5" fill="#991b1b" font-family="monospace">B writes 6</text>
  <text x="410" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">&#8594; 6  &#10007; lost update</text>

  <!-- factors -->
  <text x="670" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Timing depends on:</text>
  <g font-size="10.5" fill="#334155">
    <text x="560" y="118">&#8226; OS scheduler decisions</text>
    <text x="560" y="140">&#8226; CPU load &amp; core count</text>
    <text x="560" y="162">&#8226; cache state, GC pauses</text>
    <text x="560" y="184">&#8226; other running processes</text>
    <text x="560" y="206">&#8226; debugger / logging (!)</text>
  </g>

  <rect x="60" y="258" width="700" height="150" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="410" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">The cruel consequences</text>
  <text x="410" y="310" text-anchor="middle" font-size="11.5" fill="#7c2d12">&#8226; Passes every test on your laptop, fails in production under load</text>
  <text x="410" y="332" text-anchor="middle" font-size="11.5" fill="#7c2d12">&#8226; A "Heisenbug": adding a log line or debugger changes timing and hides it</text>
  <text x="410" y="354" text-anchor="middle" font-size="11.5" fill="#7c2d12">&#8226; Non-reproducible — the same input gives different results run to run</text>
  <text x="410" y="376" text-anchor="middle" font-size="11.5" fill="#7c2d12">&#8226; Rare (1-in-a-million) locally, but common at scale (millions of requests/day)</text>
  <text x="410" y="398" text-anchor="middle" font-size="10.5" fill="#b45309" font-weight="700">This is why races must be prevented by design, not found by luck.</text>
</svg>
