<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="400" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Strategy: Interchangeable Algorithms Behind One Interface</text>

  <defs>
    <marker id="st_tri" markerWidth="13" markerHeight="13" refX="6.5" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
    </marker>
    <marker id="st_diamond" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,6 L8,1 L16,6 L8,11 Z" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Context -->
  <rect x="60" y="150" width="200" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
  <text x="160" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">ShoppingCart</text>
  <text x="160" y="196" text-anchor="middle" font-size="9.5" fill="#1e3a8a">(the Context)</text>
  <line x1="78" y1="206" x2="242" y2="206" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="160" y="226" text-anchor="middle" font-size="10.5" fill="#1e3a8a" font-family="monospace">- PaymentStrategy</text>

  <!-- Strategy interface -->
  <rect x="360" y="150" width="200" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="460" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">«interface»</text>
  <text x="460" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">PaymentStrategy</text>
  <text x="460" y="210" text-anchor="middle" font-size="10" fill="#3730a3" font-family="monospace">pay(amount)</text>

  <!-- holds a strategy (aggregation) -->
  <line x1="260" y1="185" x2="358" y2="183" stroke="#0f172a" stroke-width="1.8" marker-start="url(#st_diamond)"/>
  <text x="310" y="176" text-anchor="middle" font-size="9.5" fill="#334155">has-a</text>

  <!-- concrete strategies -->
  <rect x="330" y="290" width="130" height="52" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="395" y="313" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">CreditCardPay</text>
  <text x="395" y="330" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">pay()</text>

  <rect x="480" y="290" width="120" height="52" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="540" y="313" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">PayPalPay</text>
  <text x="540" y="330" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">pay()</text>

  <rect x="620" y="290" width="120" height="52" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="680" y="313" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">CryptoPay</text>
  <text x="680" y="330" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">pay()</text>

  <line x1="395" y1="290" x2="450" y2="216" stroke="#475569" stroke-width="1.4" marker-end="url(#st_tri)"/>
  <line x1="540" y1="290" x2="470" y2="216" stroke="#475569" stroke-width="1.4" marker-end="url(#st_tri)"/>
  <line x1="680" y1="290" x2="490" y2="216" stroke="#475569" stroke-width="1.4" marker-end="url(#st_tri)"/>

  <text x="390" y="270" text-anchor="middle" font-size="11" fill="#64748b">interchangeable implementations</text>

  <text x="390" y="372" text-anchor="middle" font-size="12" fill="#334155">The cart calls <tspan font-family="monospace">strategy.pay(amount)</tspan> — inject a different strategy to change the algorithm, no edits to the cart. (That's OCP.)</text>
</svg>
