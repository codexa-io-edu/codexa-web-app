<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">The Prototype Trap: Shallow vs Deep Copy</text>

  <line x1="400" y1="56" x2="400" y2="392" stroke="#e2e8f0" stroke-width="2"/>

  <defs>
    <marker id="c_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0e7490"/>
    </marker>
  </defs>

  <!-- LEFT: shallow -->
  <text x="200" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">&#10007; Shallow copy</text>
  <text x="200" y="100" text-anchor="middle" font-size="11" fill="#64748b">copies the top object, SHARES nested objects</text>

  <rect x="40" y="118" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="115" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">original</text>
  <text x="115" y="157" text-anchor="middle" font-size="9.5" fill="#1e3a8a">gear ref &#8594;</text>

  <rect x="210" y="118" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="285" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">copy</text>
  <text x="285" y="157" text-anchor="middle" font-size="9.5" fill="#1e3a8a">gear ref &#8594;</text>

  <!-- shared nested -->
  <rect x="125" y="240" width="150" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">gear = [sword]</text>
  <text x="200" y="281" text-anchor="middle" font-size="9.5" fill="#991b1b">ONE shared list</text>

  <line x1="115" y1="168" x2="180" y2="238" stroke="#0e7490" stroke-width="1.8" marker-end="url(#c_arr)"/>
  <line x1="285" y1="168" x2="220" y2="238" stroke="#0e7490" stroke-width="1.8" marker-end="url(#c_arr)"/>

  <rect x="40" y="318" width="320" height="56" rx="9" fill="#fff1f2" stroke="#f87171" stroke-width="1.4"/>
  <text x="200" y="340" text-anchor="middle" font-size="11" fill="#991b1b">copy.gear.add("shield") ALSO changes</text>
  <text x="200" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">the original's gear — a hidden bug!</text>

  <!-- RIGHT: deep -->
  <text x="600" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">&#10003; Deep copy</text>
  <text x="600" y="100" text-anchor="middle" font-size="11" fill="#64748b">copies the top object AND its nested objects</text>

  <rect x="440" y="118" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="515" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">original</text>
  <text x="515" y="157" text-anchor="middle" font-size="9.5" fill="#1e3a8a">gear ref &#8594;</text>

  <rect x="610" y="118" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="685" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">copy</text>
  <text x="685" y="157" text-anchor="middle" font-size="9.5" fill="#1e3a8a">gear ref &#8594;</text>

  <rect x="430" y="240" width="150" height="54" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
  <text x="505" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">gear = [sword]</text>
  <text x="505" y="281" text-anchor="middle" font-size="9.5" fill="#065f46">original's own list</text>

  <rect x="620" y="240" width="150" height="54" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
  <text x="695" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">gear = [sword]</text>
  <text x="695" y="281" text-anchor="middle" font-size="9.5" fill="#065f46">copy's OWN list</text>

  <line x1="515" y1="168" x2="505" y2="238" stroke="#0e7490" stroke-width="1.8" marker-end="url(#c_arr)"/>
  <line x1="685" y1="168" x2="695" y2="238" stroke="#0e7490" stroke-width="1.8" marker-end="url(#c_arr)"/>

  <rect x="440" y="318" width="320" height="56" rx="9" fill="#f0fdf4" stroke="#34d399" stroke-width="1.4"/>
  <text x="600" y="340" text-anchor="middle" font-size="11" fill="#065f46">copy.gear.add("shield") affects</text>
  <text x="600" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">only the copy — fully independent.</text>
</svg>
