<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="430" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">The Strategy Ladder: Try the Top Rungs First</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748b">Each rung down adds power but also cost and complexity — reach for the simplest that works</text>

  <!-- rung 1 -->
  <rect x="120" y="78" width="560" height="56" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="140" y="102" font-size="14" font-weight="700" fill="#047857">1 · Don't share</text>
  <text x="140" y="122" font-size="11" fill="#065f46">Confine state to one thread (stack variables, thread-local). No sharing = no problem.</text>

  <!-- rung 2 -->
  <rect x="120" y="142" width="560" height="56" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="140" y="166" font-size="14" font-weight="700" fill="#047857">2 · Share, but immutable</text>
  <text x="140" y="186" font-size="11" fill="#065f46">If it never changes, any number of threads can read it freely. No locks needed.</text>

  <!-- rung 3 -->
  <rect x="120" y="206" width="560" height="56" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="140" y="230" font-size="14" font-weight="700" fill="#a16207">3 · Atomic / volatile</text>
  <text x="140" y="250" font-size="11" fill="#854d0e">For single-variable updates or flags — lock-free, cheap visibility &amp; atomicity.</text>

  <!-- rung 4 -->
  <rect x="120" y="270" width="560" height="56" rx="10" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="294" font-size="14" font-weight="700" fill="#b45309">4 · Synchronization / locks</text>
  <text x="140" y="314" font-size="11" fill="#7c2d12">Guard multi-step invariants across fields. Powerful, but risks contention &amp; deadlock.</text>

  <!-- rung 5 -->
  <rect x="120" y="334" width="560" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="358" font-size="14" font-weight="700" fill="#b91c1c">5 · Concurrent library types</text>
  <text x="140" y="378" font-size="11" fill="#991b1b">ConcurrentHashMap, BlockingQueue, etc. — battle-tested building blocks over hand-rolled locks.</text>

  <!-- arrow -->
  <defs>
    <marker id="lad" markerWidth="12" markerHeight="12" refX="6" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,0 L10,0 L6,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="70" y1="88" x2="70" y2="378" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#lad)"/>
  <text x="52" y="240" font-size="11" fill="#64748b" transform="rotate(-90 52 240)">simpler / safer  →  more powerful / costly</text>
</svg>
