<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10px; fill: #475569; }
    .lbl { font-size: 10.5px; fill: #64748b; }
    .id { font-size: 10px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">Bounded contexts: the same word, different models</text>
  <text x="24" y="50" class="lbl">"Customer" means something different in each part of the business — so each is its own context, and its own service.</text>

  <!-- Sales -->
  <rect x="24" y="70" width="240" height="150" rx="10" fill="#2563eb"/>
  <text x="40" y="94" class="h">Sales context</text>
  <text x="40" y="120" class="note" fill="#dbeafe">Customer =</text>
  <text x="40" y="140" class="note" fill="#dbeafe">• lead / prospect</text>
  <text x="40" y="158" class="note" fill="#dbeafe">• contact details</text>
  <text x="40" y="176" class="note" fill="#dbeafe">• deal stage, owner</text>
  <text x="40" y="200" class="note" fill="#dbeafe">→ Sales service + DB</text>

  <!-- Support -->
  <rect x="280" y="70" width="240" height="150" rx="10" fill="#059669"/>
  <text x="296" y="94" class="h">Support context</text>
  <text x="296" y="120" class="note" fill="#dcfce7">Customer =</text>
  <text x="296" y="140" class="note" fill="#dcfce7">• tickets / history</text>
  <text x="296" y="158" class="note" fill="#dcfce7">• entitlements / SLA</text>
  <text x="296" y="176" class="note" fill="#dcfce7">• satisfaction score</text>
  <text x="296" y="200" class="note" fill="#dcfce7">→ Support service + DB</text>

  <!-- Billing -->
  <rect x="536" y="70" width="240" height="150" rx="10" fill="#7c3aed"/>
  <text x="552" y="94" class="h">Billing context</text>
  <text x="552" y="120" class="note" fill="#ede9fe">Customer =</text>
  <text x="552" y="140" class="note" fill="#ede9fe">• account / plan</text>
  <text x="552" y="158" class="note" fill="#ede9fe">• payment method</text>
  <text x="552" y="176" class="note" fill="#ede9fe">• invoices, balance</text>
  <text x="552" y="200" class="note" fill="#ede9fe">→ Billing service + DB</text>

  <!-- shared id -->
  <rect x="300" y="250" width="200" height="40" rx="8" fill="#1e293b"/><text x="400" y="275" text-anchor="middle" class="h">same real person: customer_id 42</text>
  <line x1="144" y1="220" x2="340" y2="250" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="400" y1="220" x2="400" y2="250" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="656" y1="220" x2="460" y2="250" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>

  <rect x="24" y="308" width="752" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="330" class="note" fill="#1e293b" font-weight="700">A bounded context is a boundary within which one model &amp; "ubiquitous language" is consistent.</text>
  <text x="40" y="350" class="lbl">A microservice typically maps to ONE bounded context. Contexts reference each other by identity (customer_id), not by</text>
  <text x="40" y="366" class="lbl">sharing tables. Relationships between contexts (context mapping) use techniques like an anti-corruption layer, published</text>
  <text x="40" y="382" class="lbl">language, or customer/supplier — so one context's model doesn't leak into another. This is the core DDD tool for boundaries.</text>
</svg>
