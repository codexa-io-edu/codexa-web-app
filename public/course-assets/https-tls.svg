<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .lbl { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .mono { font-size: 11px; font-family: 'Consolas','Courier New',monospace; fill: #1e293b; }
    .note { font-size: 10.5px; fill: #64748b; }
    .msg { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
    .bad { font-size: 10.5px; font-weight: 700; fill: #dc2626; }
    .ok { font-size: 10.5px; font-weight: 700; fill: #059669; }
  </style>

  <text x="24" y="30" class="title">HTTPS = HTTP over TLS: what an attacker sees, and how trust is built</text>

  <!-- attacker view -->
  <text x="24" y="60" class="lbl">What someone snooping on public WiFi sees</text>
  <rect x="24" y="72" width="366" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="40" y="94" class="bad">Plain HTTP → readable</text>
  <text x="40" y="116" class="mono">POST /login  password=hunter2</text>
  <text x="40" y="134" class="note">anyone on the path can read &amp; tamper</text>

  <rect x="410" y="72" width="366" height="70" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="426" y="94" class="ok">HTTPS → encrypted gibberish</text>
  <text x="426" y="116" class="mono">9f3a…c7b1  (indecipherable)</text>
  <text x="426" y="134" class="note">confidential, tamper-evident, authenticated</text>

  <!-- handshake -->
  <text x="24" y="176" class="lbl">The TLS handshake (simplified)</text>
  <text x="120" y="198" class="msg">Client</text>
  <text x="600" y="198" class="msg">Server</text>
  <line x1="140" y1="206" x2="140" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="620" y1="206" x2="620" y2="360" stroke="#cbd5e1" stroke-width="2"/>

  <line x1="140" y1="222" x2="620" y2="234" stroke="#2563eb" stroke-width="2"/><polygon points="614,228 624,235 612,239" fill="#2563eb"/>
  <text x="200" y="220" class="msg">ClientHello (TLS version, cipher suites)</text>

  <line x1="620" y1="252" x2="140" y2="264" stroke="#2563eb" stroke-width="2"/><polygon points="146,258 136,265 148,269" fill="#2563eb"/>
  <text x="200" y="250" class="msg">ServerHello + certificate (public key)</text>

  <rect x="150" y="276" width="300" height="20" rx="4" fill="#fef9c3" stroke="#eab308"/>
  <text x="160" y="291" class="note">client verifies the certificate's chain of trust ↓</text>

  <line x1="140" y1="312" x2="620" y2="324" stroke="#059669" stroke-width="2"/><polygon points="614,318 624,325 612,329" fill="#059669"/>
  <text x="180" y="310" class="msg">key exchange → both derive a shared session key</text>

  <line x1="140" y1="344" x2="620" y2="352" stroke="#059669" stroke-width="3"/>
  <text x="200" y="342" class="ok">encrypted with fast symmetric crypto from here on</text>
  <text x="150" y="372" class="note">Asymmetric keys establish trust &amp; a shared secret; symmetric keys do the bulk work (fast). Crypto details → Security topic.</text>

  <!-- cert chain -->
  <text x="24" y="404" class="lbl">Chain of trust (why the padlock is trustworthy)</text>
  <rect x="24" y="416" width="180" height="40" rx="6" fill="#2563eb"/><text x="36" y="434" class="msg" fill="#fff">Site cert</text><text x="36" y="449" class="note" fill="#dbeafe">example.com</text>
  <path d="M 204 436 L 244 436" stroke="#64748b" stroke-width="2"/><polygon points="240,431 250,436 240,441" fill="#64748b"/>
  <rect x="252" y="416" width="200" height="40" rx="6" fill="#3b82f6"/><text x="264" y="434" class="msg" fill="#fff">Intermediate CA</text><text x="264" y="449" class="note" fill="#dbeafe">signs the site cert</text>
  <path d="M 452 436 L 492 436" stroke="#64748b" stroke-width="2"/><polygon points="488,431 498,436 488,441" fill="#64748b"/>
  <rect x="500" y="416" width="256" height="40" rx="6" fill="#059669"/><text x="512" y="434" class="msg" fill="#fff">Root CA</text><text x="512" y="449" class="note" fill="#dcfce7">pre-trusted in your browser/OS store</text>
</svg>
