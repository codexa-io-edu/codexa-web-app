<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Check-Then-Act: The Gap Between Looking and Leaping</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">Both threads check "is it there?", both see "no", both act — the classic TOCTOU race</text>

  <!-- lanes -->
  <rect x="60" y="80" width="320" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="220" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Thread A — createUser("alice")</text>
  <rect x="440" y="80" width="320" height="34" rx="6" fill="#fed7aa" stroke="#d97706"/><text x="600" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Thread B — createUser("alice")</text>

  <!-- check A -->
  <rect x="60" y="130" width="320" height="48" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="220" y="150" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">CHECK: exists("alice")? &#8594; false</text>
  <text x="220" y="168" text-anchor="middle" font-size="9.5" fill="#334155">"good, the name is free"</text>

  <!-- check B (interleaves) -->
  <rect x="440" y="188" width="320" height="48" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="600" y="208" text-anchor="middle" font-size="11" fill="#7c2d12" font-family="monospace">CHECK: exists("alice")? &#8594; false</text>
  <text x="600" y="226" text-anchor="middle" font-size="9.5" fill="#b91c1c">&#9888; still false — A hasn't acted yet!</text>

  <!-- act A -->
  <rect x="60" y="252" width="320" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="220" y="272" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">ACT: insert("alice")</text>
  <text x="220" y="290" text-anchor="middle" font-size="9.5" fill="#047857">succeeds</text>

  <!-- act B -->
  <rect x="440" y="310" width="320" height="48" rx="8" fill="#fed7aa" stroke="#d97706"/>
  <text x="600" y="330" text-anchor="middle" font-size="11" fill="#7c2d12" font-family="monospace">ACT: insert("alice")</text>
  <text x="600" y="348" text-anchor="middle" font-size="9.5" fill="#b91c1c">duplicate! (or overwrites A)</text>

  <!-- time arrow -->
  <defs>
    <marker id="ct_t" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="410" y1="128" x2="410" y2="360" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="30" y1="128" x2="30" y2="360" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ct_t)"/>
  <text x="22" y="250" font-size="11" fill="#64748b" transform="rotate(-90 22 250)">time  &#8595;</text>

  <rect x="150" y="378" width="520" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">The check and the act must be ONE atomic step.</text>
  <text x="410" y="420" text-anchor="middle" font-size="10.5" fill="#991b1b">Fix: hold a lock across both, or use an atomic "insert-if-absent" / a unique DB constraint.</text>
</svg>
