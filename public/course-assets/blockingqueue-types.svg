<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Choosing a BlockingQueue Implementation</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">The library gives you the pattern for free — pick the queue that matches your needs</text>

  <!-- header -->
  <rect x="40" y="78" width="230" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="155" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Implementation</text>
  <rect x="280" y="78" width="200" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Bounded?</text>
  <rect x="490" y="78" width="290" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="635" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Use when</text>

  <!-- ArrayBlockingQueue -->
  <rect x="40" y="114" width="230" height="52" rx="6" fill="#f0fdf4" stroke="#34d399"/>
  <text x="56" y="136" font-size="11.5" font-weight="700" fill="#047857">ArrayBlockingQueue</text>
  <text x="56" y="154" font-size="9.5" fill="#065f46">array-backed, fixed size</text>
  <rect x="280" y="114" width="200" height="52" rx="6" fill="#f0fdf4" stroke="#34d399"/>
  <text x="380" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">YES (fixed)</text>
  <rect x="490" y="114" width="290" height="52" rx="6" fill="#f0fdf4" stroke="#34d399"/>
  <text x="504" y="136" font-size="10" fill="#334155">The default safe choice — bounded,</text>
  <text x="504" y="152" font-size="10" fill="#334155">gives backpressure. Set capacity at creation.</text>

  <!-- LinkedBlockingQueue -->
  <rect x="40" y="172" width="230" height="52" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="56" y="194" font-size="11.5" font-weight="700" fill="#b45309">LinkedBlockingQueue</text>
  <text x="56" y="212" font-size="9.5" fill="#7c2d12">linked nodes</text>
  <rect x="280" y="172" width="200" height="52" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="380" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Optional</text>
  <text x="380" y="212" text-anchor="middle" font-size="8.5" fill="#7c2d12">unbounded by default &#9888;</text>
  <rect x="490" y="172" width="290" height="52" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="504" y="194" font-size="10" fill="#334155">Higher throughput (separate put/take locks),</text>
  <text x="504" y="210" font-size="10" fill="#334155">but ALWAYS set a capacity or risk OOM.</text>

  <!-- SynchronousQueue -->
  <rect x="40" y="230" width="230" height="52" rx="6" fill="#faf5ff" stroke="#a78bfa"/>
  <text x="56" y="252" font-size="11.5" font-weight="700" fill="#6d28d9">SynchronousQueue</text>
  <text x="56" y="270" font-size="9.5" fill="#334155">zero capacity</text>
  <rect x="280" y="230" width="200" height="52" rx="6" fill="#faf5ff" stroke="#a78bfa"/>
  <text x="380" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">Holds nothing</text>
  <text x="380" y="270" text-anchor="middle" font-size="8.5" fill="#334155">direct hand-off</text>
  <rect x="490" y="230" width="290" height="52" rx="6" fill="#faf5ff" stroke="#a78bfa"/>
  <text x="504" y="252" font-size="10" fill="#334155">Each put waits for a matching take.</text>
  <text x="504" y="268" font-size="10" fill="#334155">Used by cached thread pools for direct handoff.</text>

  <!-- PriorityBlockingQueue -->
  <rect x="40" y="288" width="230" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="310" font-size="11.5" font-weight="700" fill="#1d4ed8">PriorityBlockingQueue</text>
  <text x="56" y="328" font-size="9.5" fill="#1e3a8a">ordered by priority</text>
  <rect x="280" y="288" width="200" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="380" y="312" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">Unbounded &#9888;</text>
  <rect x="490" y="288" width="290" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="504" y="310" font-size="10" fill="#334155">Consume in priority order, not FIFO.</text>
  <text x="504" y="326" font-size="10" fill="#334155">Note: no backpressure (unbounded).</text>

  <!-- DelayQueue -->
  <rect x="40" y="346" width="230" height="52" rx="6" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="56" y="368" font-size="11.5" font-weight="700" fill="#0e7490">DelayQueue</text>
  <text x="56" y="386" font-size="9.5" fill="#0e7490">time-delayed items</text>
  <rect x="280" y="346" width="200" height="52" rx="6" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="380" y="376" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0e7490">Unbounded</text>
  <rect x="490" y="346" width="290" height="52" rx="6" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="504" y="368" font-size="10" fill="#334155">Items become available only after a delay.</text>
  <text x="504" y="384" font-size="10" fill="#334155">Schedulers, retry-with-backoff, caches.</text>

  <rect x="40" y="410" width="740" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="410" y="430" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">&#9888; The unbounded queues silently trade backpressure for OOM risk.</text>
  <text x="410" y="448" text-anchor="middle" font-size="10.5" fill="#991b1b">If a producer can outrun consumers, always bound the queue.</text>
</svg>
