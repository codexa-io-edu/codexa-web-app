<svg viewBox="0 0 820 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="450" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Processes Are Isolated; Threads Share Memory</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">Each process has its own address space. Threads inside a process share the heap but keep their own stacks.</text>

  <!-- Process A -->
  <rect x="40" y="80" width="340" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
  <text x="210" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Process A  (own address space)</text>

  <!-- shared region -->
  <rect x="60" y="120" width="300" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="210" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">SHARED by all threads</text>
  <text x="210" y="162" text-anchor="middle" font-size="11" fill="#1e3a8a">Heap (objects) · Code · Global data</text>
  <text x="210" y="184" text-anchor="middle" font-size="10.5" fill="#dc2626">fast to share — but the source of race conditions</text>
  <text x="210" y="199" text-anchor="middle" font-size="10" fill="#991b1b">(shared mutable state needs synchronization)</text>

  <!-- threads with own stacks -->
  <rect x="60" y="222" width="92" height="160" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
  <text x="106" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Thread 1</text>
  <rect x="72" y="256" width="68" height="60" rx="5" fill="#ffffff" stroke="#34d399"/><text x="106" y="290" text-anchor="middle" font-size="10" fill="#065f46">own stack</text>
  <text x="106" y="336" text-anchor="middle" font-size="9.5" fill="#065f46">own PC +</text>
  <text x="106" y="350" text-anchor="middle" font-size="9.5" fill="#065f46">registers</text>

  <rect x="164" y="222" width="92" height="160" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
  <text x="210" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Thread 2</text>
  <rect x="176" y="256" width="68" height="60" rx="5" fill="#ffffff" stroke="#34d399"/><text x="210" y="290" text-anchor="middle" font-size="10" fill="#065f46">own stack</text>
  <text x="210" y="336" text-anchor="middle" font-size="9.5" fill="#065f46">own PC +</text>
  <text x="210" y="350" text-anchor="middle" font-size="9.5" fill="#065f46">registers</text>

  <rect x="268" y="222" width="92" height="160" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
  <text x="314" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Thread 3</text>
  <rect x="280" y="256" width="68" height="60" rx="5" fill="#ffffff" stroke="#34d399"/><text x="314" y="290" text-anchor="middle" font-size="10" fill="#065f46">own stack</text>
  <text x="314" y="336" text-anchor="middle" font-size="9.5" fill="#065f46">own PC +</text>
  <text x="314" y="350" text-anchor="middle" font-size="9.5" fill="#065f46">registers</text>

  <!-- Process B -->
  <rect x="440" y="80" width="340" height="330" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="610" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">Process B  (separate address space)</text>
  <rect x="460" y="120" width="300" height="86" rx="8" fill="#f5d0fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="610" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Its OWN heap / code / data</text>
  <text x="610" y="172" text-anchor="middle" font-size="10.5" fill="#6d28d9">cannot see Process A's memory at all</text>
  <text x="610" y="190" text-anchor="middle" font-size="10" fill="#7c2d12">a crash here does NOT corrupt Process A</text>

  <rect x="460" y="222" width="140" height="160" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="530" y="300" text-anchor="middle" font-size="11" fill="#6d28d9">its own threads</text>
  <text x="530" y="318" text-anchor="middle" font-size="11" fill="#6d28d9">&amp; stacks</text>

  <!-- IPC arrow -->
  <defs>
    <marker id="ipc" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <line x1="382" y1="300" x2="618" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ipc)"/>
  <line x1="618" y1="330" x2="382" y2="330" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ipc)"/>
  <rect x="628" y="222" width="132" height="70" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.3"/>
  <text x="694" y="244" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">IPC required</text>
  <text x="694" y="262" text-anchor="middle" font-size="9.5" fill="#991b1b">pipes, sockets,</text>
  <text x="694" y="276" text-anchor="middle" font-size="9.5" fill="#991b1b">shared mem, queues</text>

  <text x="410" y="434" text-anchor="middle" font-size="11.5" fill="#334155">Threads talk cheaply through shared memory (risky); processes must copy data across a boundary (safe but slower).</text>
</svg>
