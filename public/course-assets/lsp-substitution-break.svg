<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">LSP: A Subtype Must Not Surprise Its Base Type</text>
  <text x="410" y="56" text-anchor="middle" font-size="13" fill="#64748b">The classic Square-extends-Rectangle trap</text>

  <!-- hierarchy -->
  <rect x="310" y="80" width="200" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Rectangle</text>
  <text x="410" y="124" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">setWidth(w)</text>
  <text x="410" y="139" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">setHeight(h)</text>

  <defs>
    <marker id="tri3" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="310" y="196" width="200" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Square extends Rectangle</text>
  <text x="410" y="240" text-anchor="middle" font-size="10.5" fill="#991b1b">setWidth also sets height</text>
  <text x="410" y="254" text-anchor="middle" font-size="10.5" fill="#991b1b">(to keep all sides equal)</text>
  <line x1="410" y1="196" x2="410" y2="148" stroke="#475569" stroke-width="1.6" marker-end="url(#tri3)"/>

  <!-- the client code that breaks -->
  <rect x="60" y="290" width="430" height="120" rx="10" fill="#0f172a"/>
  <text x="76" y="314" font-size="11.5" fill="#e2e8f0" font-family="monospace">// Code written against Rectangle:</text>
  <text x="76" y="334" font-size="11.5" fill="#93c5fd" font-family="monospace">void test(Rectangle r) {</text>
  <text x="90" y="352" font-size="11.5" fill="#e2e8f0" font-family="monospace">r.setWidth(5); r.setHeight(4);</text>
  <text x="90" y="370" font-size="11.5" fill="#e2e8f0" font-family="monospace">assert r.area() == 20;</text>
  <text x="76" y="388" font-size="11.5" fill="#93c5fd" font-family="monospace">}</text>

  <!-- the failure -->
  <rect x="520" y="290" width="240" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Pass a Square &#8594; &#10007;</text>
  <text x="538" y="342" font-size="11.5" fill="#991b1b" font-family="monospace">setWidth(5)  &#8594; 5&#215;5</text>
  <text x="538" y="362" font-size="11.5" fill="#991b1b" font-family="monospace">setHeight(4) &#8594; 4&#215;4</text>
  <text x="538" y="386" font-size="12.5" fill="#dc2626" font-family="monospace" font-weight="700">area() == 16, not 20</text>

  <text x="410" y="284" text-anchor="middle" font-size="11.5" fill="#334155">"A square is a rectangle" in English &#8212; but the Square breaks the Rectangle's contract, so it is NOT a valid subtype.</text>
</svg>
