<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .lbl { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .fr { font-size: 9px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10.5px; fill: #64748b; }
    .ok { font-size: 11px; font-weight: 700; fill: #059669; }
    .prob { font-size: 11px; font-weight: 700; fill: #dc2626; }
    .strm { font-size: 10px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">HTTP/2: many streams multiplexed over one connection</text>

  <!-- multiplexing -->
  <text x="24" y="64" class="ok">✓ Solved: app-layer HOL. Requests/responses interleave as frames on a single TCP connection.</text>

  <text x="30" y="92" class="strm">stream 1</text>
  <text x="30" y="116" class="strm">stream 2</text>
  <text x="30" y="140" class="strm">stream 3</text>

  <!-- one connection pipe with interleaved frames -->
  <rect x="100" y="80" width="640" height="76" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="108" y="74" class="note">one TCP connection ↓ (frames from all streams interleaved)</text>
  <rect x="112" y="90" width="70" height="18" rx="3" fill="#2563eb"/><text x="124" y="103" class="fr">S1 frame</text>
  <rect x="188" y="90" width="70" height="18" rx="3" fill="#059669"/><text x="200" y="103" class="fr">S2 frame</text>
  <rect x="264" y="90" width="70" height="18" rx="3" fill="#d97706"/><text x="276" y="103" class="fr">S3 frame</text>
  <rect x="340" y="90" width="70" height="18" rx="3" fill="#2563eb"/><text x="352" y="103" class="fr">S1 frame</text>
  <rect x="416" y="90" width="70" height="18" rx="3" fill="#d97706"/><text x="428" y="103" class="fr">S3 frame</text>
  <rect x="492" y="90" width="70" height="18" rx="3" fill="#059669"/><text x="504" y="103" class="fr">S2 frame</text>
  <text x="112" y="132" class="note">Plus HPACK header compression &amp; stream prioritization. No more 6-connection hack or spriting/bundling.</text>

  <!-- TCP HOL problem -->
  <text x="24" y="196" class="prob">✗ Remaining problem: TCP-level head-of-line blocking</text>
  <text x="24" y="216" class="note">All streams ride the SAME TCP connection. TCP guarantees in-order bytes, so if ONE packet is lost…</text>

  <rect x="100" y="234" width="640" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="112" y="250" width="80" height="20" rx="3" fill="#2563eb"/><text x="126" y="264" class="fr">S1 packet</text>
  <rect x="200" y="250" width="80" height="20" rx="3" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/><text x="212" y="264" class="fr">LOST ✗</text>
  <rect x="288" y="250" width="80" height="20" rx="3" fill="#94a3b8"/><text x="300" y="264" class="fr">S2 (held)</text>
  <rect x="376" y="250" width="80" height="20" rx="3" fill="#94a3b8"/><text x="388" y="264" class="fr">S3 (held)</text>
  <rect x="464" y="250" width="80" height="20" rx="3" fill="#94a3b8"/><text x="476" y="264" class="fr">S1 (held)</text>
  <text x="112" y="294" class="prob">…TCP holds back ALL later packets — every stream stalls until the lost one is retransmitted.</text>

  <!-- takeaway -->
  <rect x="24" y="322" width="732" height="94" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="346" class="lbl">The catch</text>
  <text x="40" y="368" class="note">HTTP/2 removed head-of-line blocking at the <tspan font-weight="700">application</tspan> layer, but the streams are only <tspan font-weight="700">logically</tspan> independent —</text>
  <text x="40" y="386" class="note">they still share one TCP byte-stream, so a single lost packet blocks them all at the <tspan font-weight="700">transport</tspan> layer.</text>
  <text x="40" y="406" class="note">On lossy networks (mobile!) this hurts. Fixing it means changing the transport itself → HTTP/3 over QUIC.</text>
</svg>
