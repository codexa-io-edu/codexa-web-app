<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .layer { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .lsub { font-size: 10px; fill: #f1f5f9; }
    .note { font-size: 11px; fill: #64748b; }
    .lbl { font-size: 11px; font-weight: 700; fill: #1e293b; }
    .port { font-size: 10px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">Where the transport layer sits — and what it does</text>

  <!-- stack -->
  <rect x="40" y="60" width="330" height="50" rx="6" fill="#64748b"/>
  <text x="56" y="82" class="layer">Application</text>
  <text x="56" y="99" class="lsub">HTTP · DNS · SMTP · SSH — your app's data</text>

  <rect x="40" y="118" width="330" height="66" rx="6" fill="#2563eb"/>
  <text x="56" y="140" class="layer">Transport  ← this topic</text>
  <text x="56" y="158" class="lsub">TCP (reliable, ordered)  |  UDP (fast, best-effort)</text>
  <text x="56" y="174" class="lsub">delivers data process-to-process, addressed by PORT</text>

  <rect x="40" y="192" width="330" height="50" rx="6" fill="#94a3b8"/>
  <text x="56" y="214" class="layer">Network (IP)</text>
  <text x="56" y="231" class="lsub">moves packets host-to-host by IP address</text>

  <rect x="40" y="250" width="330" height="44" rx="6" fill="#cbd5e1"/>
  <text x="56" y="272" class="lbl">Link (Ethernet / Wi-Fi)</text>
  <text x="56" y="288" class="note">the physical hop</text>

  <text x="40" y="320" class="note">IP delivers packets to the right machine but is unreliable</text>
  <text x="40" y="336" class="note">(packets can drop, duplicate, arrive out of order).</text>
  <text x="40" y="352" class="note">The transport layer turns that into something apps can use.</text>
  <text x="40" y="374" class="note">(IP addressing &amp; routing → "How the Internet Works".)</text>

  <!-- ports / multiplexing -->
  <text x="430" y="76" class="lbl">Ports: one machine, many apps</text>
  <rect x="430" y="88" width="300" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="446" y="112" class="note">One IP address (e.g. 203.0.113.7) …</text>
  <rect x="446" y="124" width="270" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="456" y="142" class="port">:443  → web server (HTTPS)</text>
  <rect x="446" y="156" width="270" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="456" y="174" class="port">:22   → SSH</text>
  <rect x="446" y="188" width="270" height="26" rx="4" fill="#dcfce7" stroke="#059669"/><text x="456" y="206" class="port">:53   → DNS (UDP)</text>
  <text x="446" y="230" class="note">…the port picks which app gets the data.</text>

  <text x="430" y="266" class="lbl">The core tradeoff</text>
  <rect x="430" y="278" width="300" height="120" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="446" y="302" class="note"><tspan font-weight="700" fill="#2563eb">TCP</tspan> — guarantees every byte arrives, in order.</text>
  <text x="446" y="320" class="note">Costs a handshake, ACKs, and possible waiting.</text>
  <text x="446" y="346" class="note"><tspan font-weight="700" fill="#059669">UDP</tspan> — just sends; may lose or reorder packets.</text>
  <text x="446" y="364" class="note">No setup, tiny overhead, lowest latency.</text>
  <text x="446" y="388" class="note">Reliability vs. speed — pick per use case.</text>
</svg>
