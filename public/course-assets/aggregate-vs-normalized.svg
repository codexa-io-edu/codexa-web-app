<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 13px; font-weight: 700; fill: #475569; }
    .tbl { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .h { font-size: 11px; font-weight: 700; fill: #1e293b; }
    .c { font-size: 11px; fill: #334155; }
    .mono { font-size: 11.5px; fill: #334155; font-family: 'SFMono-Regular', Consolas, monospace; }
    .note { font-size: 11px; fill: #64748b; }
    .good { font-size: 11px; font-weight: 700; fill: #059669; }
    .warn { font-size: 11px; font-weight: 700; fill: #d97706; }
  </style>

  <text x="24" y="30" class="title">Same data, two philosophies: normalized (SQL) vs aggregate (NoSQL)</text>

  <!-- LEFT: relational normalized -->
  <text x="24" y="62" class="sub">Relational — split into tables, joined at read time</text>

  <rect x="24" y="76" width="150" height="90" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="24" y="76" width="150" height="24" rx="6" fill="#2563eb"/>
  <text x="34" y="93" class="tbl">customers</text>
  <text x="34" y="118" class="h">id</text><text x="70" y="118" class="h">name</text>
  <line x1="24" y1="124" x2="174" y2="124" stroke="#e2e8f0"/>
  <text x="34" y="142" class="c">42</text><text x="70" y="142" class="c">Asha</text>

  <rect x="24" y="180" width="150" height="110" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="24" y="180" width="150" height="24" rx="6" fill="#2563eb"/>
  <text x="34" y="197" class="tbl">addresses</text>
  <text x="34" y="222" class="h">cust_id</text><text x="96" y="222" class="h">city</text>
  <line x1="24" y1="228" x2="174" y2="228" stroke="#e2e8f0"/>
  <text x="34" y="246" class="c">42</text><text x="96" y="246" class="c">Pune</text>

  <rect x="200" y="130" width="160" height="160" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="200" y="130" width="160" height="24" rx="6" fill="#2563eb"/>
  <text x="210" y="147" class="tbl">orders</text>
  <text x="210" y="172" class="h">id</text><text x="250" y="172" class="h">cust_id</text><text x="315" y="172" class="h">amt</text>
  <line x1="200" y1="178" x2="360" y2="178" stroke="#e2e8f0"/>
  <text x="210" y="196" class="c">101</text><text x="250" y="196" class="c">42</text><text x="315" y="196" class="c">1200</text>
  <text x="210" y="216" class="c">102</text><text x="250" y="216" class="c">42</text><text x="315" y="216" class="c">450</text>

  <!-- join arrows -->
  <path d="M 174 130 C 190 150, 190 165, 200 172" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 174 235 C 190 220, 190 205, 200 196" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="150" y="316" class="warn">read needs JOINs across 3 tables</text>
  <text x="24" y="338" class="good">✓ no duplication  ✓ update city in one place</text>
  <text x="24" y="356" class="note">Optimized for consistency &amp; flexible queries.</text>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="380" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- RIGHT: aggregate document -->
  <text x="424" y="62" class="sub">Document / aggregate — one self-contained record</text>

  <rect x="424" y="76" width="352" height="230" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="440" y="100" class="mono">{</text>
  <text x="440" y="120" class="mono">  "_id": 42,</text>
  <text x="440" y="140" class="mono">  "name": "Asha",</text>
  <text x="440" y="160" class="mono">  "address": { "city": "Pune" },</text>
  <text x="440" y="180" class="mono">  "orders": [</text>
  <text x="440" y="200" class="mono">    { "id": 101, "amt": 1200 },</text>
  <text x="440" y="220" class="mono">    { "id": 102, "amt": 450 }</text>
  <text x="440" y="240" class="mono">  ]</text>
  <text x="440" y="260" class="mono">}</text>
  <text x="440" y="288" class="good">✓ one read fetches everything — no joins</text>

  <text x="424" y="332" class="warn">✗ "Asha"/"Pune" may be duplicated across docs</text>
  <text x="424" y="350" class="note">Optimized for fast reads of a known access pattern.</text>
  <text x="424" y="368" class="note">You manage consistency of any duplicated data.</text>

  <!-- bottom takeaway -->
  <rect x="24" y="396" width="752" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="420" class="h">The mental shift</text>
  <text x="40" y="440" class="c">SQL models data by its <tspan font-weight="700">structure</tspan> and joins at read time. NoSQL models data by its <tspan font-weight="700">access pattern</tspan>,</text>
  <text x="40" y="456" class="c">pre-joining (embedding) what a query needs so a read is a single fast lookup — at the cost of managed duplication.</text>
</svg>
