<svg viewBox="0 0 820 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="450" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Exception → HTTP Status Mapping &amp; Global Handler</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Domain throws typed exceptions; a single global handler translates them to consistent HTTP responses</text>
  <defs>
    <marker id="eh_a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="eh_r" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>

  <!-- exceptions (left) -->
  <text x="170" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Domain exceptions</text>
  <rect x="40" y="102" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="55" y="124" font-family="monospace" font-size="10" fill="#b91c1c">ResourceNotFoundException</text>
  <rect x="40" y="142" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="55" y="164" font-family="monospace" font-size="10" fill="#b91c1c">ConflictException</text>
  <rect x="40" y="182" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="55" y="204" font-family="monospace" font-size="10" fill="#b91c1c">ValidationException</text>
  <rect x="40" y="222" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="55" y="244" font-family="monospace" font-size="10" fill="#b91c1c">UnauthorizedException</text>
  <rect x="40" y="262" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="55" y="284" font-family="monospace" font-size="10" fill="#b91c1c">MethodArgumentNotValidException</text>
  <rect x="40" y="302" width="260" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="55" y="324" font-family="monospace" font-size="10" fill="#b91c1c">Exception (catch-all)</text>

  <!-- arrows to handler -->
  <line x1="300" y1="119" x2="378" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#eh_a)"/>
  <line x1="300" y1="159" x2="378" y2="210" stroke="#475569" stroke-width="1.4" marker-end="url(#eh_a)"/>
  <line x1="300" y1="199" x2="378" y2="220" stroke="#475569" stroke-width="1.4" marker-end="url(#eh_a)"/>
  <line x1="300" y1="239" x2="378" y2="230" stroke="#475569" stroke-width="1.4" marker-end="url(#eh_a)"/>
  <line x1="300" y1="279" x2="378" y2="240" stroke="#475569" stroke-width="1.4" marker-end="url(#eh_a)"/>
  <line x1="300" y1="319" x2="378" y2="250" stroke="#475569" stroke-width="1.4" marker-end="url(#eh_a)"/>

  <!-- global handler -->
  <rect x="380" y="168" width="150" height="100" rx="10" fill="#334155"/>
  <text x="455" y="200" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f1f5f9">@ControllerAdvice</text>
  <text x="455" y="218" text-anchor="middle" font-size="10" fill="#94a3b8">Global</text>
  <text x="455" y="234" text-anchor="middle" font-size="10" fill="#94a3b8">Exception</text>
  <text x="455" y="250" text-anchor="middle" font-size="10" fill="#94a3b8">Handler</text>

  <!-- status codes (right) -->
  <text x="660" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">HTTP status + body</text>
  <rect x="542" y="102" width="236" height="34" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="557" y="124" font-family="monospace" font-size="10" fill="#b45309">404 Not Found</text>
  <rect x="542" y="142" width="236" height="34" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="557" y="164" font-family="monospace" font-size="10" fill="#b45309">409 Conflict</text>
  <rect x="542" y="182" width="236" height="34" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="557" y="204" font-family="monospace" font-size="10" fill="#b45309">422 Unprocessable</text>
  <rect x="542" y="222" width="236" height="34" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="557" y="244" font-family="monospace" font-size="10" fill="#b45309">401 Unauthorized</text>
  <rect x="542" y="262" width="236" height="34" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="557" y="284" font-family="monospace" font-size="10" fill="#b45309">400 Bad Request + field errors</text>
  <rect x="542" y="302" width="236" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="557" y="324" font-family="monospace" font-size="10" fill="#b91c1c">500 Internal Server Error</text>

  <line x1="530" y1="119" x2="532" y2="119" stroke="#dc2626" stroke-width="1.4"/>
  <line x1="530" y1="119" x2="532" y2="119" stroke="#dc2626" stroke-width="1.4"/>
  <line x1="530" y1="200" x2="542" y2="119" stroke="#dc2626" stroke-width="1.4" marker-end="url(#eh_r)"/>
  <line x1="530" y1="210" x2="542" y2="159" stroke="#dc2626" stroke-width="1.4" marker-end="url(#eh_r)"/>
  <line x1="530" y1="220" x2="542" y2="199" stroke="#dc2626" stroke-width="1.4" marker-end="url(#eh_r)"/>
  <line x1="530" y1="230" x2="542" y2="239" stroke="#dc2626" stroke-width="1.4" marker-end="url(#eh_r)"/>
  <line x1="530" y1="240" x2="542" y2="279" stroke="#dc2626" stroke-width="1.4" marker-end="url(#eh_r)"/>
  <line x1="530" y1="250" x2="542" y2="319" stroke="#dc2626" stroke-width="1.4" marker-end="url(#eh_r)"/>

  <rect x="40" y="368" width="740" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="410" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">The pattern: domain throws typed, meaningful exceptions; NO HTTP concern in the domain.</text>
  <text x="410" y="410" text-anchor="middle" font-size="10.5" fill="#334155">The global handler at the edge translates exceptions to status codes + structured error bodies, exactly once.</text>
  <text x="410" y="428" text-anchor="middle" font-size="10" fill="#64748b">The catch-all Exception handler ALWAYS logs the full stack trace but returns only "Internal Server Error" to the client.</text>
</svg>
