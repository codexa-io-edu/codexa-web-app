<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .sub { font-size: 9.5px; fill: #e2e8f0; }
    .conn { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
    .mono { font-size: 10px; font-family: 'Consolas','Courier New',monospace; fill: #1e293b; }
    .note { font-size: 10.5px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="title">Two separate connections — and how the backend still learns the client IP</text>

  <!-- client -->
  <rect x="40" y="120" width="150" height="70" rx="8" fill="#64748b"/><text x="115" y="150" text-anchor="middle" class="box">Client</text><text x="115" y="170" text-anchor="middle" class="sub">203.0.113.5</text>

  <!-- proxy -->
  <rect x="330" y="110" width="150" height="90" rx="10" fill="#7c3aed"/><text x="405" y="145" text-anchor="middle" class="box">Reverse Proxy</text><text x="405" y="165" text-anchor="middle" class="sub">public: 198.51.100.7</text><text x="405" y="181" text-anchor="middle" class="sub">internal: 10.0.0.2</text>

  <!-- backend -->
  <rect x="620" y="120" width="150" height="70" rx="8" fill="#059669"/><text x="695" y="150" text-anchor="middle" class="box">Backend</text><text x="695" y="170" text-anchor="middle" class="sub">10.0.0.14</text>

  <!-- connection 1 -->
  <line x1="190" y1="155" x2="328" y2="155" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)"/>
  <text x="200" y="110" class="conn">Connection #1</text>
  <text x="200" y="126" class="note">TLS, HTTP/2, from the internet</text>

  <!-- connection 2 -->
  <line x1="480" y1="155" x2="618" y2="155" stroke="#059669" stroke-width="3" marker-end="url(#g)"/>
  <text x="500" y="110" class="conn">Connection #2</text>
  <text x="490" y="126" class="note">plain HTTP/1.1, pooled &amp; kept alive</text>

  <text x="230" y="230" class="note">The proxy <tspan font-weight="700">terminates</tspan> the client's connection and opens its <tspan font-weight="700">own</tspan> to the backend.</text>

  <!-- header box -->
  <rect x="200" y="252" width="400" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="216" y="274" class="conn">So the backend sees the proxy's IP (10.0.0.2). To pass the real client:</text>
  <rect x="216" y="286" width="368" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="228" y="304" class="mono">X-Forwarded-For: 203.0.113.5</text>
  <text x="228" y="322" class="mono">X-Forwarded-Proto: https   (also: Forwarded, RFC 7239)</text>

  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  </defs>
</svg>
