<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Synchronization &amp; Locking</text>
  <text x="410" y="63" text-anchor="middle" font-size="13" fill="#64748b">When you can't avoid shared mutable state, these are the tools that coordinate access to it</text>

  <!-- Mutex -->
  <rect x="40" y="90" width="740" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="56" y="106" width="180" height="56" rx="8" fill="#2563eb"/>
  <text x="146" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Mutex</text>
  <text x="252" y="124" font-size="13" font-weight="700" fill="#1d4ed8">Mutual exclusion: one thread in the critical section at a time.</text>
  <text x="252" y="145" font-size="11.5" fill="#334155">The fundamental primitive — acquire a lock, do the work, release it. Everyone else waits.</text>
  <text x="252" y="163" font-size="11.5" fill="#334155">In Java: ReentrantLock and the intrinsic lock behind synchronized.</text>

  <!-- Monitors -->
  <rect x="40" y="188" width="740" height="88" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="56" y="204" width="180" height="56" rx="8" fill="#059669"/>
  <text x="146" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Monitors</text>
  <text x="252" y="222" font-size="13" font-weight="700" fill="#047857">A lock + condition variables bundled with the data it protects.</text>
  <text x="252" y="243" font-size="11.5" fill="#334155">Mutual exclusion PLUS the ability to wait for a condition and be signalled.</text>
  <text x="252" y="261" font-size="11.5" fill="#334155">In Java: every object is a monitor (synchronized + wait/notify); Lock + Condition.</text>

  <!-- Read-Write Locks -->
  <rect x="40" y="286" width="740" height="88" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="56" y="302" width="180" height="56" rx="8" fill="#d97706"/>
  <text x="146" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Read-Write</text>
  <text x="146" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Locks</text>
  <text x="252" y="320" font-size="13" font-weight="700" fill="#b45309">Many readers OR one writer — concurrency for read-heavy data.</text>
  <text x="252" y="341" font-size="11.5" fill="#334155">Reads don't conflict, so let them run in parallel; only writes need exclusivity.</text>
  <text x="252" y="359" font-size="11.5" fill="#334155">In Java: ReentrantReadWriteLock, StampedLock.</text>

  <!-- Optimistic vs Pessimistic -->
  <rect x="40" y="384" width="740" height="88" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="56" y="400" width="180" height="56" rx="8" fill="#7c3aed"/>
  <text x="146" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Optimistic vs</text>
  <text x="146" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Pessimistic</text>
  <text x="252" y="418" font-size="13" font-weight="700" fill="#6d28d9">Two philosophies: lock upfront, or proceed and verify at the end.</text>
  <text x="252" y="439" font-size="11.5" fill="#334155">Pessimistic assumes conflict (lock first). Optimistic assumes none (check-and-retry, CAS).</text>
  <text x="252" y="457" font-size="11.5" fill="#334155">Spans threads (AtomicInteger CAS) and databases (version columns).</text>
</svg>
