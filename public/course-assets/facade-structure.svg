<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Facade: One Simple Door Over a Complex Subsystem</text>

  <defs>
    <marker id="f_arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- client -->
  <rect x="60" y="170" width="140" height="60" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Client</text>
  <text x="130" y="215" text-anchor="middle" font-size="9.5" fill="#1e3a8a">one call: watch()</text>

  <!-- facade -->
  <rect x="260" y="150" width="170" height="100" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.6"/>
  <text x="345" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">HomeTheaterFacade</text>
  <line x1="278" y1="196" x2="412" y2="196" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="345" y="218" text-anchor="middle" font-size="11" fill="#6d28d9" font-family="monospace">watchMovie()</text>
  <text x="345" y="236" text-anchor="middle" font-size="9.5" fill="#7c3aed">coordinates everything</text>

  <line x1="200" y1="200" x2="258" y2="200" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#f_arr)"/>

  <!-- subsystem -->
  <rect x="480" y="86" width="290" height="228" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="625" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">Complex subsystem</text>

  <rect x="500" y="120" width="250" height="34" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="625" y="142" text-anchor="middle" font-size="11" fill="#047857">Projector.on() / setInput()</text>
  <rect x="500" y="160" width="250" height="34" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="625" y="182" text-anchor="middle" font-size="11" fill="#047857">SoundSystem.setVolume()</text>
  <rect x="500" y="200" width="250" height="34" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="625" y="222" text-anchor="middle" font-size="11" fill="#047857">Lights.dim(10)</text>
  <rect x="500" y="240" width="250" height="34" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="625" y="262" text-anchor="middle" font-size="11" fill="#047857">StreamingPlayer.play()</text>
  <rect x="500" y="280" width="250" height="26" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="625" y="298" text-anchor="middle" font-size="10.5" fill="#047857">Screen.lower() ...</text>

  <line x1="430" y1="180" x2="498" y2="137" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#f_arr)"/>
  <line x1="430" y1="192" x2="498" y2="177" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#f_arr)"/>
  <line x1="430" y1="208" x2="498" y2="217" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#f_arr)"/>
  <line x1="430" y1="220" x2="498" y2="257" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#f_arr)"/>

  <text x="400" y="352" text-anchor="middle" font-size="11.5" fill="#334155">The facade does NOT hide the subsystem — advanced callers can still use it directly. It just offers an easy path.</text>
  <text x="400" y="376" text-anchor="middle" font-size="11" fill="#64748b">Like a receptionist: one point of contact who coordinates many departments for you.</text>
</svg>
