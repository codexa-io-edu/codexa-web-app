<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .box { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 10.5px; fill: #64748b; }
    .step { font-size: 10.5px; font-weight: 700; fill: #1e293b; }
    .bad { font-size: 10.5px; font-weight: 700; fill: #dc2626; }
    .lbl { font-size: 10px; font-weight: 700; fill: #1e293b; }
  </style>

  <text x="24" y="30" class="title">Why it's hard: the lost-ack dilemma</text>

  <!-- sender/receiver -->
  <rect x="60" y="80" width="130" height="50" rx="8" fill="#2563eb"/><text x="125" y="110" text-anchor="middle" class="box">Sender</text>
  <rect x="610" y="80" width="130" height="50" rx="8" fill="#059669"/><text x="675" y="110" text-anchor="middle" class="box">Receiver</text>

  <!-- message -->
  <line x1="190" y1="98" x2="608" y2="98" stroke="#2563eb" stroke-width="2.4" marker-end="url(#b)"/>
  <text x="320" y="90" class="step">1 · message sent</text>

  <!-- process -->
  <text x="612" y="152" class="step">2 · receiver processes it ✓</text>

  <!-- ack lost -->
  <line x1="608" y1="175" x2="300" y2="175" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="6,5"/>
  <text x="360" y="168" class="bad">3 · ack sent…</text>
  <text x="250" y="192" class="bad">✗ ack lost in the network</text>
  <line x1="300" y1="165" x2="320" y2="185" stroke="#dc2626" stroke-width="2.4"/><line x1="320" y1="165" x2="300" y2="185" stroke="#dc2626" stroke-width="2.4"/>

  <!-- dilemma -->
  <rect x="60" y="220" width="340" height="120" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="76" y="244" class="lbl">The sender got no ack. Now what?</text>
  <text x="76" y="268" class="note"><tspan font-weight="700" fill="#dc2626">Retry</tspan> the message →</text>
  <text x="96" y="286" class="note">but the receiver may have already processed it</text>
  <text x="96" y="302" class="note">→ <tspan font-weight="700">DUPLICATE</tspan></text>
  <text x="76" y="324" class="note"><tspan font-weight="700" fill="#dc2626">Don't retry</tspan> → but it may never have arrived → <tspan font-weight="700">LOSS</tspan></text>

  <rect x="420" y="220" width="356" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="436" y="244" class="lbl">Where you acknowledge decides the guarantee</text>
  <text x="436" y="268" class="note">• ack <tspan font-weight="700">before</tspan> processing → at-most-once (safe from dup, risks loss)</text>
  <text x="436" y="290" class="note">• ack <tspan font-weight="700">after</tspan> processing → at-least-once (safe from loss, risks dup)</text>
  <text x="436" y="312" class="note">• ack + effect made <tspan font-weight="700">atomic</tspan> + dedup → exactly-once</text>
  <text x="436" y="332" class="note">  (effectively-once)</text>

  <rect x="24" y="356" width="752" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="378" class="note">You can never be certain a lost ack means "not processed." That uncertainty is fundamental — so systems choose which risk to take:</text>
  <text x="40" y="396" class="note">accept possible loss (at-most-once) or accept possible duplicates and handle them (at-least-once). Exactly-once engineers the duplicates away.</text>

  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
</svg>
