<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">API Evolution</text>
  <text x="410" y="63" text-anchor="middle" font-size="13" fill="#64748b">A published API is a contract. These three disciplines let it grow without breaking the clients depending on it.</text>
  <defs><marker id="ov_a" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs>

  <rect x="40" y="90" width="740" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="56" y="106" width="196" height="60" rx="8" fill="#2563eb"/>
  <text x="154" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1 · Versioning</text>
  <text x="154" y="152" text-anchor="middle" font-size="11" fill="#bfdbfe">URI · Header · Query</text>
  <text x="268" y="126" font-size="12.5" font-weight="700" fill="#1d4ed8">Signal intentional breaking changes to consumers.</text>
  <text x="268" y="147" font-size="11" fill="#334155">URI versioning, header versioning, query-param — tradeoffs, routing,</text>
  <text x="268" y="165" font-size="11" fill="#334155">when a new version is warranted, lifecycle management and deprecation.</text>

  <line x1="410" y1="182" x2="410" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#ov_a)"/>

  <rect x="40" y="202" width="740" height="92" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="56" y="218" width="196" height="60" rx="8" fill="#059669"/>
  <text x="154" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2 · Backward</text>
  <text x="154" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Compatibility</text>
  <text x="268" y="238" font-size="12.5" font-weight="700" fill="#047857">What actually breaks clients — and what doesn't.</text>
  <text x="268" y="259" font-size="11" fill="#334155">Breaking vs. non-breaking changes; additive-only evolution; Postel's Law;</text>
  <text x="268" y="277" font-size="11" fill="#334155">Sunset/Deprecation headers; consumer-driven contract testing.</text>

  <line x1="410" y1="294" x2="410" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#ov_a)"/>

  <rect x="40" y="314" width="740" height="92" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="56" y="330" width="196" height="60" rx="8" fill="#d97706"/>
  <text x="154" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3 · Extensibility</text>
  <text x="154" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Patterns</text>
  <text x="268" y="350" font-size="12.5" font-weight="700" fill="#b45309">Design today's API so tomorrow's changes don't break anything.</text>
  <text x="268" y="371" font-size="11" fill="#334155">Open/Closed for APIs; optional fields; generic envelopes; feature flags;</text>
  <text x="268" y="389" font-size="11" fill="#334155">forward compatibility; designing stable, evolvable contracts from day one.</text>
</svg>
