<svg viewBox="0 0 820 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="820" height="600" fill="#ffffff"/>

  <!-- Arrows (drawn first, behind boxes) -->
  <line x1="410" y1="80"  x2="205" y2="148" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="410" y1="80"  x2="615" y2="148" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="175" y1="228" x2="352" y2="298" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="645" y1="228" x2="468" y2="298" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="410" y1="362" x2="410" y2="408" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="410" y1="472" x2="410" y2="513" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Requirements -->
  <rect x="300" y="24" width="220" height="56" rx="10" fill="#0f172a"/>
  <text x="410" y="58" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Requirements</text>

  <!-- Functional Requirements -->
  <rect x="40" y="150" width="270" height="78" rx="10" fill="#2563eb"/>
  <text x="175" y="184" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Functional Requirements</text>
  <text x="175" y="208" text-anchor="middle" fill="#dbeafe" font-size="14">WHAT it must do</text>

  <!-- Non-Functional Requirements -->
  <rect x="510" y="150" width="270" height="78" rx="10" fill="#7c3aed"/>
  <text x="645" y="184" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Non-Functional Req.</text>
  <text x="645" y="208" text-anchor="middle" fill="#ede9fe" font-size="14">HOW WELL it must do it</text>

  <!-- HLD -->
  <rect x="250" y="298" width="320" height="64" rx="10" fill="#0891b2"/>
  <text x="410" y="326" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">High-Level Design (HLD)</text>
  <text x="410" y="348" text-anchor="middle" fill="#cffafe" font-size="14">big-picture architecture</text>

  <!-- LLD -->
  <rect x="250" y="408" width="320" height="64" rx="10" fill="#0d9488"/>
  <text x="410" y="436" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Low-Level Design (LLD)</text>
  <text x="410" y="458" text-anchor="middle" fill="#ccfbf1" font-size="14">detailed internals</text>

  <!-- Implementation -->
  <rect x="290" y="515" width="240" height="56" rx="10" fill="#16a34a"/>
  <text x="410" y="549" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Implementation</text>
</svg>
