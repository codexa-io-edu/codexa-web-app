<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .h { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .dim { font-size: 11px; font-weight: 700; fill: #1e293b; }
    .v { font-size: 11px; fill: #334155; }
    .note { font-size: 10.5px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="title">TCP vs. UDP: reliability vs. speed</text>

  <!-- headers -->
  <rect x="24" y="48" width="220" height="40" fill="#1e293b"/><text x="38" y="73" class="h" font-size="12">Property</text>
  <rect x="244" y="48" width="266" height="40" fill="#2563eb"/><text x="258" y="73" class="h">TCP</text>
  <rect x="510" y="48" width="246" height="40" fill="#059669"/><text x="524" y="73" class="h">UDP</text>

  <g>
    <rect x="24" y="88" width="732" height="36" fill="#f8fafc"/>
    <text x="38" y="111" class="dim">Connection</text>
    <text x="258" y="111" class="v">connection-oriented (handshake first)</text>
    <text x="524" y="111" class="v">connectionless (just send)</text>

    <rect x="24" y="124" width="732" height="36" fill="#ffffff"/>
    <text x="38" y="147" class="dim">Delivery</text>
    <text x="258" y="147" class="v">guaranteed (ACK + retransmit)</text>
    <text x="524" y="147" class="v">best-effort (may be lost)</text>

    <rect x="24" y="160" width="732" height="36" fill="#f8fafc"/>
    <text x="38" y="183" class="dim">Ordering</text>
    <text x="258" y="183" class="v">in-order (sequence numbers)</text>
    <text x="524" y="183" class="v">no ordering (may arrive shuffled)</text>

    <rect x="24" y="196" width="732" height="36" fill="#ffffff"/>
    <text x="38" y="219" class="dim">Flow / congestion control</text>
    <text x="258" y="219" class="v">yes — adapts to the network</text>
    <text x="524" y="219" class="v">none (the app must manage it)</text>

    <rect x="24" y="232" width="732" height="36" fill="#f8fafc"/>
    <text x="38" y="255" class="dim">Overhead / speed</text>
    <text x="258" y="255" class="v">larger header, setup cost — slower</text>
    <text x="524" y="255" class="v">tiny header, no setup — lowest latency</text>

    <rect x="24" y="268" width="732" height="36" fill="#ffffff"/>
    <text x="38" y="291" class="dim">One-to-many</text>
    <text x="258" y="291" class="v">no (point-to-point only)</text>
    <text x="524" y="291" class="v">yes (broadcast / multicast)</text>

    <rect x="24" y="304" width="732" height="52" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="38" y="326" class="dim">Typical users</text>
    <text x="258" y="326" class="v">HTTP(S), email, SSH, file transfer,</text>
    <text x="258" y="341" class="v">databases — every byte must arrive</text>
    <text x="524" y="326" class="v">DNS, video/voice, gaming, live</text>
    <text x="524" y="341" class="v">streams, QUIC/HTTP3, WebRTC</text>
  </g>

  <text x="24" y="382" class="note">Use <tspan font-weight="700" fill="#2563eb">TCP</tspan> when correctness matters and a small delay is fine. Use <tspan font-weight="700" fill="#059669">UDP</tspan> when speed matters more than perfect delivery,</text>
  <text x="24" y="400" class="note">or when the application handles reliability itself (as QUIC does — see Web Communication Protocols).</text>
  <text x="24" y="420" class="note">Both run on top of IP; the difference is entirely what they add on top of it.</text>
</svg>
