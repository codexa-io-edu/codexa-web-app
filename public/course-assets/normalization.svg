<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 13px; font-weight: 700; fill: #475569; }
    .tbl { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .h { font-size: 11px; font-weight: 700; fill: #1e293b; }
    .c { font-size: 11px; fill: #334155; }
    .bad { font-size: 11px; fill: #dc2626; font-weight:700; }
    .note { font-size: 11px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="title">Normalization: remove duplication, avoid update anomalies</text>

  <!-- BEFORE -->
  <text x="24" y="62" class="sub">Before — one wide table (data repeats)</text>
  <rect x="24" y="72" width="470" height="150" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="24" y="72" width="470" height="26" rx="6" fill="#dc2626"/>
  <rect x="24" y="86" width="470" height="12" fill="#dc2626"/>
  <text x="34" y="90" class="tbl">orders  (unnormalized)</text>

  <line x1="24" y1="122" x2="494" y2="122" stroke="#fee2e2"/>
  <text x="34" y="116" class="h">order_id</text>
  <text x="110" y="116" class="h">customer</text>
  <text x="210" y="116" class="h">customer_city</text>
  <text x="360" y="116" class="h">product</text>

  <text x="34" y="144" class="c">101</text><text x="110" y="144" class="c">Asha</text><text x="210" y="144" class="bad">Pune</text><text x="360" y="144" class="c">Keyboard</text>
  <text x="34" y="166" class="c">102</text><text x="110" y="166" class="c">Asha</text><text x="210" y="166" class="bad">Pune</text><text x="360" y="166" class="c">Mouse</text>
  <text x="34" y="188" class="c">103</text><text x="110" y="188" class="c">Asha</text><text x="210" y="188" class="bad">Pune</text><text x="360" y="188" class="c">Monitor</text>
  <text x="34" y="210" class="note">"Pune" and "Asha" are stored 3 times → change once, risk missing the others.</text>

  <!-- arrow -->
  <path d="M 258 232 L 258 262" stroke="#64748b" stroke-width="2"/>
  <polygon points="252,258 258,270 264,258" fill="#64748b"/>
  <text x="278" y="255" class="note">decompose into related tables (3NF)</text>

  <!-- AFTER -->
  <text x="24" y="298" class="sub">After — each fact stored once, linked by keys</text>

  <!-- customers -->
  <rect x="24" y="310" width="210" height="120" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="24" y="310" width="210" height="26" rx="6" fill="#059669"/>
  <rect x="24" y="324" width="210" height="12" fill="#059669"/>
  <text x="34" y="328" class="tbl">customers</text>
  <text x="34" y="354" class="h">id</text><text x="90" y="354" class="h">name</text><text x="160" y="354" class="h">city</text>
  <line x1="24" y1="360" x2="234" y2="360" stroke="#dcfce7"/>
  <text x="34" y="380" class="c">1</text><text x="90" y="380" class="c">Asha</text><text x="160" y="380" class="c">Pune</text>
  <text x="34" y="400" class="note">stored exactly once ✓</text>

  <!-- products -->
  <rect x="266" y="310" width="200" height="120" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="266" y="310" width="200" height="26" rx="6" fill="#059669"/>
  <rect x="266" y="324" width="200" height="12" fill="#059669"/>
  <text x="276" y="328" class="tbl">products</text>
  <text x="276" y="354" class="h">id</text><text x="330" y="354" class="h">name</text>
  <line x1="266" y1="360" x2="466" y2="360" stroke="#dcfce7"/>
  <text x="276" y="380" class="c">10</text><text x="330" y="380" class="c">Keyboard</text>
  <text x="276" y="400" class="c">11</text><text x="330" y="400" class="c">Mouse</text>

  <!-- orders -->
  <rect x="498" y="310" width="258" height="180" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="498" y="310" width="258" height="26" rx="6" fill="#059669"/>
  <rect x="498" y="324" width="258" height="12" fill="#059669"/>
  <text x="508" y="328" class="tbl">orders</text>
  <text x="508" y="354" class="h">id</text><text x="556" y="354" class="h">cust_id</text><text x="640" y="354" class="h">prod_id</text>
  <line x1="498" y1="360" x2="756" y2="360" stroke="#dcfce7"/>
  <text x="508" y="380" class="c">101</text><text x="556" y="380" class="c">1</text><text x="640" y="380" class="c">10</text>
  <text x="508" y="400" class="c">102</text><text x="556" y="400" class="c">1</text><text x="640" y="400" class="c">11</text>
  <text x="508" y="428" class="note">FK cust_id → customers.id</text>
  <text x="508" y="446" class="note">FK prod_id → products.id</text>

  <!-- connectors -->
  <path d="M 234 380 L 498 380" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 466 385 C 480 400, 480 400, 498 400" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>

  <text x="24" y="510" class="note">Result: to fix a typo in "Pune", you update <tspan font-weight="700">one</tspan> row. No inconsistency possible.</text>
</svg>
